{"type": "일반", "cat": "민법", "q": "민법상 임차인의 비용상환청구권과 임대인의 보존행위에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["임차인은 필요비를 임대차가 존속하는 중에도 상환청구할 수 있다.","임대인이 임대물의 보존에 필요한 행위를 하는 때에는 임차인은 이를 거절하지 못한다.","임차인이 필요비를 부담하기로 하는 약정은 임차인에게 불리하므로 무효이다.","임대차 종료 후 임차인이 부담하여야 할 비용 등은 특별한 사정이 없는 한 보증금에서 공제할 수 있다."], "answer": 2, "expl": "비용상환청구권은 임의규정이므로 임차인이 필요비를 부담하기로 한 약정도 유효하다. 강행규정만 임차인에게 불리한 약정이 무효로 되는데, 비용상환청구권은 그 목록에 들지 않기 때문이다. 필요비의 존속 중 청구 가능, 보존행위 거절 불가와 묶어 한 끗을 노리는 자리다.", "src": "2026-08-24 민법 비용상환청구권과 보존행위", "conceptKey": "민법 임대차-필요비특약 임의규정"},
{"type": "일반", "cat": "민법", "q": "민법상 계약의 해제와 위험부담에 관한 설명으로 옳은 것은?", "opts": ["매매 목적물의 시가를 고지하지 아니한 묵비는 기망행위에 해당한다.","해제의 의사표시는 단독행위이므로 원칙적으로 조건이나 기한을 붙일 수 없다.","채무자에게 책임 없는 사유로 이행이 불능으로 된 경우 채권자는 이를 이유로 계약을 해제할 수 있다.","임대인의 동의 없는 전대차에서 전차인도 지상물의 매수를 청구할 수 있다."], "answer": 1, "expl": "해제는 상대방 있는 단독행위여서 조건·기한을 붙이면 상대방의 지위가 불안해지므로 원칙적으로 허용되지 않는다. 채무자 무책의 이행불능은 해제가 아니라 위험부담의 문제로 처리된다. 시가의 묵비는 사기가 아니고, 무단전대의 전차인은 매수청구가 절대 안 된다는 것도 같은 노트의 함정축이다.", "src": "2026-08-24 민법 해제의 의사표시와 위험부담", "conceptKey": "민법 해제-단독행위 조건금지"},
{"type": "일반", "cat": "민법", "q": "민법상 해약금에 의한 해제에서 이행의 착수에 관한 설명으로 옳은 것은?", "opts": ["일반적으로 기한의 이익은 매수인에게 있으므로 특별한 사정이 없는 한 매수인은 이행기 전에도 이행에 착수할 수 있다.","매도인에게도 기한의 이익이 있는 경우에도 매수인은 특별한 사정이 없는 한 이행기 전에 언제든지 이행에 착수할 수 있다.","토지거래계약 허가의 신청은 이행의 착수에 해당한다.","매매의 일방예약에서 예약완결권의 행사기간을 약정하지 아니하면 그 기간은 5년이다."], "answer": 0, "expl": "기한의 이익은 원칙적으로 매수인에게 있다고 보므로 매수인은 이행기 전에도 착수할 수 있다. 기한의 이익이 누구에게 있느냐가 착수 가능 시점을 결정하는 메커니즘이기 때문이다. 매도인에게도 기한의 이익이 있으면 이행기 전 착수가 불가하고, 허가신청·소 제기는 착수가 아니며, 예약완결권 기간은 약정이 없으면 10년이다.", "src": "2026-08-24 민법 해약금 해제와 이행의 착수", "conceptKey": "민법 해약금-기한이익과 이행착수"},
{"type": "OX", "cat": "민법", "q": "이행불능을 이유로 손해배상을 청구하는 경우, 배상액은 해제 당시가 아니라 이행불능 당시의 목적물 시가를 기준으로 산정한다. (O/X)", "opts": ["O","X"], "answer": 0, "expl": "O. 이행불능으로 인한 전보배상액은 이행불능 당시의 시가가 기준이다. 해제 시를 기준으로 하면 해제권자가 유리한 시점을 골라 배상액을 조작할 수 있게 되기 때문이다. 해제 당시·계약 당시로 바꿔 내는 것이 전형적 함정이다.", "src": "2026-08-24 민법 손해배상액 산정 기준", "conceptKey": "민법 해제-이행불능시 배상액 기준"},
{"type": "일반", "cat": "민법", "q": "⏪ 민법상 사기에 의한 의사표시와 의사표시의 효력 발생에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)", "opts": ["사기가 성립하려면 표의자에게 재산상의 손실을 주려는 사기자의 고의가 있어야 한다.","청약의 의사표시는 상대방에게 도달한 후에도 상대방이 그 내용을 알기 전이라면 철회할 수 있다.","변칙세일과 같이 실질적으로 재산상 손실을 주지 아니하는 행위도 기망행위가 될 수 있다.","의사표시의 상대방이 제한능력자인 경우 그 법정대리인이 도달을 안 후에도 표의자는 도달을 주장할 수 없다."], "answer": 2, "expl": "사기의 성립에 재산상 손실을 주려는 고의는 필요하지 않으므로 변칙세일처럼 손실이 없어도 기망행위가 된다. 사기취소는 의사결정의 자유 침해를 막는 제도이지 재산 손해의 전보 제도가 아니기 때문이다. 철회는 도달 전에만 가능하고, 제한능력자 상대방은 법정대리인이 도달을 안 후에는 도달 주장이 가능하다.", "src": "2026-07-20 민법 사기의 성립과 의사표시의 도달 (장기복습·41일전)", "conceptKey": "민법 사기-기망 고의 불요"},
{"type": "일반", "cat": "민법", "q": "⏪ 민법상 부동산 이중매매에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)", "opts": ["제2매수인의 적극가담으로 제2매매가 반사회적 법률행위로서 무효인 경우에도 선의의 전득자는 유효하게 소유권을 취득할 수 있다.","제1매수인은 무효인 제2매매에 대하여 채권자취소권을 행사할 수 있다.","제3자가 적극가담하여 채권을 침해하는 구조라면 이중으로 부동산임대차계약이 체결된 경우에도 이중매매의 법리가 적용될 수 있다.","제2매수인의 적극가담이 없는 때에는 매매계약을 먼저 체결한 매수인이 소유권을 취득한다."], "answer": 2, "expl": "이중매매 법리의 본질은 제3자가 적극 가담하여 앞선 채권을 침해하였다는 데 있으므로 이중임대차에도 적용될 수 있다. 적극가담형 제2매매는 제103조 위반으로 처음부터 무효라서 전득자도 보호받지 못하고, 취소할 법률행위 자체가 없어 채권자취소권도 행사할 수 없다. 적극가담이 없으면 먼저 등기한 매수인이 취득한다는 점도 비교해 두자.", "src": "2026-06-02 민법 부동산 이중매매 (장기복습·89일전)", "conceptKey": "민법 이중매매-임대차 확장"},
{"type": "조합", "cat": "민법", "q": "⏪ 민법상 강행규정과 단속규정 위반의 효력에 관한 설명으로 옳은 것을 모두 고른 것은?<br>ㄱ. 중간생략등기를 금지하는 규정은 단속규정이므로 이를 위반한 등기라도 거래의 효력까지 부정되는 것은 아니다.<br>ㄴ. 강행규정을 위반하여 무효인 법률행위는 추인하여도 유효로 되지 않는다.<br>ㄷ. 과도한 위약벌 약정은 무효가 될 수 있다.<br>ㄹ. 법정 한도를 초과하는 중개보수 약정은 그 전부가 무효이다.", "opts": ["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 1, "expl": "단속규정 위반은 행위자 제재가 목적이라 거래는 유효하고, 강행규정 위반의 무효는 존재 자체가 없는 것이어서 추인해도 살아나지 않으며, 과도한 위약벌은 경제적 파멸의 수단이 될 수 있어 무효가 될 수 있다. 초과 중개보수는 일부무효 법리로 한도 초과 부분만 무효이고 나머지는 유효하다. 전부무효로 바꿔치기하는 것이 단골 함정이다.", "src": "2026-06-02 민법 강행규정·단속규정 (장기복습·89일전)", "conceptKey": "민법 규정위반-일부무효"},
{"type": "일반", "cat": "부동산학개론", "q": "부동산학개론상 수확체감의 법칙과 차액지대론에 관한 설명으로 옳은 것은?", "opts": ["토지처럼 고정된 생산요소에 가변요소를 계속 추가로 투입하면 일정 시점부터 한계생산이 점차 줄어든다.","리카도의 차액지대론에서 지대는 생산에 투입된 비용에 해당한다.","알론소는 튀넨의 입찰지대이론을 농업에 적용하여 농작물별 지대곡선을 도출하였다.","차액지대론에서 같은 토지에 노동·자본을 더 투입하는 집약적 경작을 하면 추가 투입의 한계생산은 체증한다."], "answer": 0, "expl": "수확체감의 법칙은 고정요소인 토지에 가변요소를 늘릴수록 추가 1단위의 산출 증가분이 줄어드는 현상이다. 이 체감 때문에 집약적 경작과 경작지 확장이 같은 한계비용에서 만나는 균형점이 생기고 그 지점이 지대 크기를 결정한다. 리카도의 지대는 비용이 아니라 잉여이고, 알론소는 튀넨을 도시에 적용해 대상을 산업별로 바꾸었다.", "src": "2026-08-28 부동산학개론 토지경제와 지대이론", "conceptKey": "학개론 지대-수확체감"},
{"type": "일반", "cat": "부동산학개론", "q": "부동산학개론상 도시내부구조 이론에 관한 설명으로 옳은 것은?", "opts": ["호이트의 선형이론은 시카고시 한 도시만을 분석하여 도출되었다.","호이트의 선형이론에 따르면 주거지는 도로를 따라 소득계층별로 형성되며, 접근성이 좋은 도로 주변에는 저소득층의 주거지가 자리잡게 된다.","다핵심이론은 이종의 활동이 한곳에 모이면서 여러 개의 핵이 형성된다고 본다.","버제스의 동심원이론은 침입·경쟁·천이의 생태학적 과정으로 도시의 확장을 설명한다."], "answer": 3, "expl": "동심원이론은 튀넨의 구조를 시카고시에 적용해 주거지역 중심의 생태학적 분석을 한 이론으로, 침입에서 경쟁·천이로 이어지는 과정을 쓴다. 호이트는 시카고를 넘어 142개 도시를 분석해 주거지가 도로를 따라 소득계층별로 형성된다고 보았고, 좋은 접근성 때문에 도로 주변에는 고소득층이 자리한다. 다핵심이론의 핵은 동종활동의 집적으로 생긴다.", "src": "2026-08-28 부동산학개론 도시내부구조 이론", "conceptKey": "학개론 도시구조-동심원 생태학"},
{"type": "일반", "cat": "부동산학개론", "q": "감정평가에 관한 규칙 및 감정평가이론상 동일수급권과 가격제원칙 등에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["부동산가격이 최고가 되려면 외부 상황에 적합하여야 한다는 것이 적합의 원칙이고, 내부의 구성환경이 균형을 맞추어야 한다는 것이 균형의 원칙이다.","동일수급권은 대상부동산과 대체·경쟁 관계가 성립하는 지역으로서 인근지역은 포함하나 유사지역은 포함하지 아니한다.","비교방식은 시장성의 원리에 기초한 방식으로 공시지가기준법이 여기에 속한다.","수익방식에 의한 대상부동산의 시산가액을 수익가액이라 한다."], "answer": 1, "expl": "동일수급권은 대상이 속한 인근지역과 대상이 속하지 아니한 유사지역을 모두 포함한다. 대체·경쟁이 성립하는 범위를 묶는 개념이므로 어느 한쪽만 담을 이유가 없기 때문이다. 적합은 외부, 균형은 내부라는 대비축과 함께 포함 범위를 좁혀 내는 함정에 대비하자.", "src": "2026-08-28 부동산학개론 감정평가 기초", "conceptKey": "학개론 감정평가-동일수급권 범위"},
{"type": "조합", "cat": "부동산학개론", "q": "부동산학개론상 공업입지이론과 상업입지이론에 관한 설명으로 옳은 것을 모두 고른 것은?<br>ㄱ. 베버의 최소비용이론은 수송비·노동비·집적이익을 고려하여 비용이 최소인 지점을 공장의 최적입지로 본다.<br>ㄴ. 원료지수가 1보다 크면 원료가 무거운 경우이므로 원료산지에 가까이 입지하는 것이 유리하다.<br>ㄷ. 뢰쉬는 생산비용이 최소가 되는 지점에 기업이 입지하여야 한다고 보았다.<br>ㄹ. 넬슨의 소매입지이론은 특정 점포가 최대 이익을 얻으려면 어떤 장소에 입지하여야 하는가를 다룬다.", "opts": ["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 2, "expl": "베버는 수송비·노동비·집적이익의 세 요소로 최소비용 지점을 찾고, 원료지수가 1을 넘으면 원료가 무거워 원료지향형이 되며, 넬슨은 점포의 최대 이익 입지를 다룬다. 뢰쉬는 비용이 아니라 수요 측면에서 시장 확대가능성이 가장 높은 지점을 최적입지로 보았다. 베버와 뢰쉬의 기준을 서로 바꿔 내는 것이 공업입지의 단골 함정이다.", "src": "2026-08-28 부동산학개론 공업·상업입지이론", "conceptKey": "학개론 입지-베버 뢰쉬 대비"},
{"type": "계산", "cat": "부동산학개론", "q": "갑은 적산법으로 대상부동산의 임대료를 구하려 한다. 기초가액이 6억원, 기대이율이 연 3퍼센트, 필요제경비가 연 500만원일 때 적산법에 의한 임대료는? (다른 조건은 동일)", "opts": ["1,800만원","1억 8,000만원","2,450만원","2,300만원"], "answer": 3, "expl": "기초가액 6억원에 기대이율 3퍼센트를 곱한 기대수익 1,800만원에 필요제경비 500만원을 더하면 2,300만원이다. 적산법은 초대경비, 곧 기초가액 곱하기 기대이율에 경비를 더하는 구조이기 때문이다. 경비를 빼먹은 1,800만원이 전형적 오답이다.", "src": "2026-08-28 부동산학개론 적산법", "conceptKey": "학개론 적산법-초대경비 계산", "calc": {"expr":"600000000*0.03+5000000","expected":23000000}},
{"type": "계산", "cat": "부동산학개론", "q": "어느 부동산의 총투자액은 15억원이고 연간 유효총소득은 1억 2,000만원, 순영업소득은 연 7,500만원이다. 이 부동산의 순소득승수는? (다른 조건은 동일)", "opts": ["12.5","20","25","30"], "answer": 1, "expl": "순소득승수는 총투자액을 순영업소득으로 나눈 값이므로 15억원 나누기 7,500만원으로 20이 된다. 투자금이 순영업소득 몇 해분에 해당하는지를 보는 지표이기 때문에 분모에 반드시 순영업소득이 온다. 유효총소득 1억 2,000만원으로 나눈 12.5가 함정 오답이다.", "src": "2026-08-28 부동산학개론 수익률·승수 지표", "conceptKey": "학개론 승수-순소득승수 계산", "calc": {"expr":"1500000000/75000000","expected":20}},
{"type": "계산", "cat": "부동산학개론", "q": "갑은 시장가치 6억원인 상가를 매입하면서 저당대출 4억원을 이용하고 나머지 2억원은 자기자본으로 충당하였다. 이 투자의 부채비율은? (다른 조건은 동일)", "opts": ["약 66.7퍼센트","100퍼센트","150퍼센트","200퍼센트"], "answer": 3, "expl": "부채비율은 부채를 자기자본으로 나눈 값이므로 4억원 나누기 2억원으로 200퍼센트가 된다. 총자산이 아니라 자기자본이 분모라는 것이 이 지표의 핵심 구조다. 부채를 총자산으로 나눈 약 66.7퍼센트는 대부비율이므로 혼동하면 안 된다.", "src": "2026-08-28 부동산학개론 부채 관련 지표", "conceptKey": "학개론 부채비율-자기자본 분모", "calc": {"expr":"400000000/200000000*100","expected":200}},
{"type": "일반", "cat": "부동산공법", "q": "주택법령상 주택의 종류와 시설 등에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["도시형 생활주택 중 단지형 연립주택과 단지형 다세대주택은 5개층까지 건축할 수 있다.","환지 방식으로 시행하는 도시개발사업으로 조성된 택지는 공공택지에 해당하지 아니한다.","주택단지의 공구별 세대수는 300세대 이상으로 하며, 사업계획승인은 공구별로 나누어 받는 것이 아니다.","지역난방공급시설은 주택단지 밖의 시설이지만 부대시설에 해당한다."], "answer": 3, "expl": "부대시설은 냉난방공급시설이고 지역난방공급시설은 단지 밖 시설이어서 부대시설이 아니다. 부대시설은 주택단지 안에서 주택에 딸리는 시설이라는 위치 기준으로 갈리기 때문이다. 가스·통신·지역난방시설은 단지 안 기간시설 쪽에 묶이고, 도시정비사업·환지 도시개발 택지는 공공택지에서 빠진다.", "src": "2026-08-25 부동산공법 주택의 종류와 부대시설", "conceptKey": "공법 주택법-지역난방 부대시설 제외"},
{"type": "사례", "cat": "부동산공법", "q": "갑은 같은 직장에 근무하는 동료들과 국민주택을 공급받기 위하여 직장주택조합을 설립하려고 한다. 주택법령상 이에 관한 설명으로 옳은 것은?", "opts": ["이 직장주택조합의 조합원은 무주택자만 될 수 있다.","이 조합을 설립하려면 관할 시장·군수·구청장의 인가를 받아야 한다.","조합 총회에서 자금 관련 중요사항을 의결할 때에는 조합원의 100분의 10 이상이 직접 출석하여야 한다.","조합 가입 청약의 철회는 철회의 서면이 조합에 도달한 날에 효력이 발생한다."], "answer": 0, "expl": "국민주택을 공급받기 위한 직장주택조합은 신고로 설립하고 조합원은 무주택자만 될 수 있다. 국민주택이라는 공적 재원의 혜택을 무주택 실수요자에게 한정하려는 구조이기 때문이다. 자금·임원선임 등 중요사항 총회는 100분의 20 직접 출석이 필요하고, 가입 청약 철회는 도달이 아니라 발송한 날 효력이 생긴다.", "src": "2026-08-25 부동산공법 직장주택조합", "conceptKey": "공법 주택법-직장조합 신고 무주택"},
{"type": "일반", "cat": "부동산공법", "q": "⏪ 국토의 계획 및 이용에 관한 법령상 도시·군관리계획으로 결정하는 사항 등에 관한 설명으로 옳은 것은?", "opts": ["성장관리계획구역·개발밀도관리구역·기반시설부담구역은 모두 도시·군관리계획으로 결정하여야 한다.","도시지역의 축소에 따른 용도지역 변경을 내용으로 하는 입안에서도 주민 의견청취를 생략할 수 없다.","도시지역에서 세부 용도지역이 지정되지 아니한 경우에는 자연녹지지역의 용적률 규정을 적용한다.","수산자원보호구역의 지정에 관한 도시·군관리계획의 결정권자는 해양수산부장관이다."], "answer": 3, "expl": "수산자원보호구역 지정의 관리계획 결정은 국토교통부장관이 아니라 해양수산부장관이 한다. 수산자원이라는 소관 사무를 따라 결정권이 옮겨 간 구조다. 성장관리·개발밀도·기반시설부담구역은 이용파트 소속이라 관리계획 결정 대상이 아니고, 도시지역 축소 입안은 현상 추인이라 의견청취 생략이 가능하며, 세부 미지정 시에는 보전녹지지역 용적률을 적용한다.", "src": "2026-06-03 부동산공법 도시군관리계획 결정 (장기복습·88일전)", "conceptKey": "공법 관리계획-수산자원 해수부"},
{"type": "일반", "cat": "부동산공법", "q": "⏪ 국토의 계획 및 이용에 관한 법령상 개발행위허가의 절차에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["재해복구나 재난수습을 위한 응급조치는 먼저 조치를 한 후 1개월 이내에 신고하면 된다.","개발행위허가에 조건을 붙이려는 경우에는 미리 개발행위허가 신청자의 의견을 들어야 한다.","이행보증금은 국가나 지방자치단체가 시행하는 개발행위에 대하여도 예치하게 하여야 한다.","토지분할과 물건을 1개월 이상 쌓아놓는 행위는 준공검사의 대상이 아니다."], "answer": 2, "expl": "이행보증금은 민간이 시행하는 개발행위에만 예치하게 하고 국가·지방자치단체는 예치 대상이 아니다. 원상회복 불이행의 위험을 담보하는 장치인데 공적 주체는 그 위험이 낮다고 보기 때문이다. 응급조치의 선조치 후 1개월 신고, 조건부 허가 시 의견청취, 준공검사 제외 대상과 묶어 절차 축을 정리해 두자.", "src": "2026-02-20 부동산공법 개발행위허가 절차 (장기복습·191일전)", "conceptKey": "공법 개발행위-이행보증금 민간만"},
{"type": "일반", "cat": "부동산공법", "q": "⏪ 국토의 계획 및 이용에 관한 법령상 지구단위계획구역과 지구단위계획에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["개발제한구역·도시자연공원구역·시가화조정구역·공원에서 해제되는 구역은 지구단위계획구역으로 지정할 수 없다.","지구단위계획에는 건축물의 용도제한, 건폐율·용적률, 건축물 높이의 최고한도 또는 최저한도가 포함되어야 한다.","정비구역이나 택지개발지구에서 시행된 사업이 끝난 후 10년이 지난 지역은 의무적 지정대상이 될 수 있다.","지구단위계획구역에서 가설건축물은 지구단위계획에 맞게 건축하여야 하는 규제의 대상에서 제외될 수 있다."], "answer": 0, "expl": "개발제한구역·도시자연공원구역·시가화조정구역·공원에서 해제되는 구역은 오히려 지구단위계획구역으로 지정할 수 있는 대표적 재량 지정대상이다. 해제로 규제의 공백이 생기는 땅을 계획으로 이어받으려는 취지이기 때문이다. 용도제한·건폐율·용적률·높이는 필수 포함 사항이고, 정비구역·택지지구 종료 후 10년 경과지는 의무적 지정대상 축이다.", "src": "2026-02-20 부동산공법 지구단위계획 (장기복습·191일전)", "conceptKey": "공법 지구단위-해제지역 지정가능"},
{"type": "일반", "cat": "부동산공법", "q": "⏪ 도시개발법령상 도시개발구역의 지정과 행위제한에 관한 설명으로 옳은 것은?", "opts": ["공업지역에서 도시개발구역으로 지정할 수 있는 규모는 1만제곱미터 이상이다.","도시개발구역은 분할하여 지정하거나 서로 떨어진 지역을 결합하여 지정할 수 있다.","경작지에서 관상용 죽목을 임시로 식재하는 행위는 행위제한의 대상이 아니므로 허가가 필요하지 않다.","도시개발구역에서 건축물의 대수선은 허가를 받지 아니하고 할 수 있다."], "answer": 1, "expl": "도시개발구역은 분할 지정과 결합 지정이 모두 가능하다. 사업의 실정에 맞게 구역의 형태를 짜도록 열어 둔 것이다. 지정규모는 공업지역만 3만제곱미터 이상이고 나머지가 1만 이상이며, 관상용 죽목의 임시 식재도 경작지에서는 허가가 필요하고, 대수선·용도변경을 포함한 건축은 허가 대상이다.", "src": "2026-02-21 부동산공법 도시개발구역의 지정 (장기복습·190일전)", "conceptKey": "공법 도시개발-분할결합 지정"},
{"type": "조합", "cat": "부동산공법", "q": "⏪ 도시개발법령상 도시개발구역을 지정한 후에 개발계획에 포함시킬 수 있는 사항을 모두 고른 것은?<br>ㄱ. 수용·사용 대상 토지의 세부목록<br>ㄴ. 순환개발 등 단계적 사업추진에 관한 사항<br>ㄷ. 임대주택건설계획<br>ㄹ. 도시개발구역 밖의 지역에 기반시설을 설치하는 사항", "opts": ["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 3, "expl": "세부목록·순환개발·임대주택건설계획·구역 밖 기반시설 설치는 모두 구역 지정 후에 개발계획에 넣을 수 있는 사항이다. 구역이 확정되어야 비로소 정할 수 있는 내용들이기 때문이다. 세순임박이라는 코드로 네 항목을 한 묶음으로 기억해 두면 개수 함정에 흔들리지 않는다.", "src": "2026-02-21 부동산공법 개발계획의 내용 (장기복습·190일전)", "conceptKey": "공법 도시개발-세순임박"},
{"type": "일반", "cat": "공인중개사법", "q": "주택임대차보호법령상 대항력에 관한 설명으로 <b>옳지 않은</b> 것은? (다툼이 있으면 판례에 따름)", "opts": ["올바른 전입신고서가 수리되어야 대항력이 발생한다.","임대차신고를 하면서 받은 확정일자에 의하여 그때부터 대항력이 발생한다.","적법한 임대권한이 없는 사람과 임대차계약을 체결한 경우에는 주택임대차보호법이 적용되지 아니한다.","인도와 주민등록은 배당요구의 종기까지 계속 존속하고 있어야 한다."], "answer": 1, "expl": "확정일자는 대항력을 발생시키는 요건이 아니고, 대항력 있는 상태에서 확정일자를 갖추면 우선변제권이 발생하는 것이다. 대항력은 주택의 인도와 주민등록이라는 사실 상태가 만들고 확정일자는 그 위에 날짜 도장을 얹는 구조이기 때문이다. 전입신고서의 수리, 적법한 임대권한, 배당요구 종기까지의 존속은 모두 그대로 옳은 축이다.", "src": "2026-08-26 공인중개사법 주택임대차 대항력", "conceptKey": "중개 주임법-확정일자 대항력 아님"},
{"type": "일반", "cat": "공인중개사법", "q": "분묘기지권과 장사 등에 관한 법령에 관한 설명으로 <b>옳지 않은</b> 것은? (다툼이 있으면 판례에 따름)", "opts": ["분묘기지권은 존속기간에 관하여 민법의 지상권에 관한 규정에 따른다.","분묘기지권은 권리자가 포기의 의사표시를 하는 외에 점유까지 포기하여야만 소멸하는 것은 아니다.","법인묘지에는 폭 5미터 이상의 도로와 주차장을 마련하여야 한다.","개인묘지를 설치한 경우에는 미리 신고하는 것이 아니라 설치 후 30일 이내에 신고하면 된다."], "answer": 0, "expl": "분묘기지권은 지상권과 유사한 물권이지만 존속기간은 민법의 지상권 규정에 따르지 않는다. 분묘 수호라는 특수한 목적에 맞춘 관습법상 물권이어서 기간 규정을 그대로 가져올 이유가 없기 때문이다. 소멸에는 포기의 의사표시로 족하고 점유 포기까지는 불요하며, 개인묘지는 사후 30일 신고라는 점도 함께 눌러 두자.", "src": "2026-08-26 공인중개사법 분묘기지권과 장사법", "conceptKey": "중개 분묘-존속기간 지상권규정 배제"},
{"type": "일반", "cat": "공인중개사법", "q": "부동산실명법령상 명의신탁등기의 효력과 처벌에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)", "opts": ["가등기를 타인 명의로 하는 것은 실명법 위반이 아니다.","전세권이나 저당권과 같이 소유권이 아닌 물권을 타인 명의로 등기하는 것은 부동산실명법이 금지하는 명의신탁등기에 해당하지 아니한다.","명의신탁에 따른 등기는 무효여서 수탁자가 얻은 이득이 없으므로, 신탁자는 부당이득반환을 원인으로 등기의 회복을 청구할 수 없다.","명의신탁이 무효인 경우 수탁자는 신탁자보다 무거운 형벌을 받는다."], "answer": 2, "expl": "명의신탁 등기는 무효이므로 수탁자에게는 반환할 이득 자체가 생기지 않아 부당이득반환 구성이 막힌다. 부당이득은 유효한 이득의 이동을 전제로 하는데 무효 등기는 그 이동이 없기 때문이다. 소유권 외의 물권과 가등기도 타인 명의로 하면 위반이고, 형벌은 신탁자가 5년 이하 징역·2억원 이하 벌금으로 수탁자보다 무겁다.", "src": "2026-08-26 공인중개사법 부동산실명법", "conceptKey": "중개 실명법-부당이득반환 불가"},
{"type": "조합", "cat": "공인중개사법", "q": "주택임대차보호법령상 옳은 것을 모두 고른 것은?<br>ㄱ. 법인은 원칙적으로 대항력을 취득할 수 없다.<br>ㄴ. 한국토지주택공사, 지방공사, 중소기업은 대항력을 취득할 수 있는 법인에 해당한다.<br>ㄷ. 우선변제권의 승계는 금융기관에게만 허락된다.<br>ㄹ. 우선변제권의 승계는 임차인의 채권을 양수한 일반 채권자에게도 허용된다.", "opts": ["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 1, "expl": "법인은 주민등록을 할 수 없어 원칙적으로 대항력을 취득하지 못하고, 예외적으로 공적 주체인 한국토지주택공사·지방공사와 보호 필요가 있는 중소기업만 문이 열려 있다. 우선변제권의 승계도 금융기관에게만 허락되므로 일반 채권 양수인에게는 허용되지 않는다. 예외 셋을 모든 법인이나 회사 일반으로 넓히는 것이 함정 패턴이다.", "src": "2026-08-26 공인중개사법 주택임대차 우선변제권", "conceptKey": "중개 주임법-법인 대항력 예외3"},
{"type": "사례", "cat": "공인중개사법", "q": "갑은 토지거래허가구역 안에 있는 을 소유의 토지를 매수하는 계약을 체결하였으나 아직 허가를 받지 아니하였다. 부동산 거래신고 등에 관한 법령상 이에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)", "opts": ["을이 허가신청 절차에 협력하지 아니하더라도 갑은 을에 대하여 협력의무 불이행을 이유로 한 손해배상을 청구할 수는 없다.","허가관청은 허가신청일부터 15일 이내에 허가 또는 불허가 처분을 하여야 한다.","을이 대가를 받지 아니하고 지상권을 설정하여 주는 계약이었다면 그 계약도 허가 대상이다.","갑과 을이 처음부터 허가를 잠탈할 의도로 계약을 체결하였다면 그 계약은 그때부터 이미 확정적으로 무효이다."], "answer": 3, "expl": "처음부터 허가를 잠탈할 의도였다면 계약은 유동적 무효를 거칠 것도 없이 그 시점부터 확정적으로 무효이다. 허가제를 피하려는 의도가 객관적 정황으로 드러나면 보호할 유동 상태 자체가 없기 때문이다. 협력 거부에는 계획 차질을 이유로 손해배상 청구가 가능하고, 처분 기한은 신청일이 아니라 허가신청서를 받은 날부터 15일이며, 무상의 지상권 설정은 투기 우려가 없어 허가 대상이 아니다.", "src": "2026-08-26 공인중개사법 토지거래허가제", "conceptKey": "중개 토지거래-잠탈 확정무효"},
{"type": "OX", "cat": "공인중개사법", "q": "공인중개사법령상 포상금은 지급 결정일로부터 1개월 이내에 지급하고, 부동산 거래신고 등에 관한 법령상 포상금은 신고 접수일로부터 2개월 이내에 지급한다. (O/X)", "opts": ["O","X"], "answer": 0, "expl": "O. 중개사법 포상금은 결정일부터 1개월, 거래신고법 포상금은 접수일부터 2개월이 지급 기한이다. 거래신고법 쪽은 위반 확인과 과태료 확정까지 절차가 더 길어 기한도 길게 설계되어 있다. 기산점을 결정일과 접수일로 서로 바꿔 내는 것이 전형적 함정이다.", "src": "2026-08-26 공인중개사법 포상금 제도", "conceptKey": "중개 포상금-지급기한 대비"},
{"type": "OX", "cat": "공인중개사법", "q": "토지거래허가구역의 지정은 시장·군수·구청장이 그 지정 사실을 공고한 날부터 5일 후에 효력이 발생한다. (O/X)", "opts": ["O","X"], "answer": 1, "expl": "X. 허가구역 지정의 효력은 지정권자인 국토교통부장관 또는 시·도지사가 그 지정을 공고한 날부터 5일 후에 발생한다. 지정 공고는 효력을 만드는 행위이고 시장·군수·구청장의 몫은 이미 생긴 규제를 주민에게 알리는 사실 전달이기 때문이다. 공고 주체를 아래 단계 행정청으로 바꿔치기하는 함정에 주의하자.", "src": "2026-08-26 공인중개사법 토지거래허가구역 지정", "conceptKey": "중개 토지거래-지정공고 주체"},
{"type": "일반", "cat": "부동산공시법", "q": "공간정보의 구축 및 관리 등에 관한 법령상 토지의 합병과 등록사항의 정정 등에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["요역지에 대한 지역권등기가 있는 토지도 합병할 수 있다.","지적측량성과와 다르게 정리된 경우에는 지적소관청이 직권으로 정정할 수 있다.","축척변경에 따른 청산금은 6개월 이내에 납부하게 하고 6개월 이내에 지급한다.","축척변경위원회는 5명 이상 10명 이하의 위원으로 구성하되 위원의 2분의 1 이상을 토지소유자로 한다."], "answer": 0, "expl": "요역지에 지역권등기가 있는 경우에는 합병할 수 없다. 합병으로 요역지가 늘어나면 승역지의 부담 범위가 함께 커지므로 요역지는 늘어나면 안 되기 때문이다. 직권정정 사유인 측량성과 불일치, 청산금의 6개월·6개월, 위원회의 5~10명과 2분의 1 소유자 구성은 그대로 옳은 수치 축이다.", "src": "2026-08-27 부동산공시법 지적 정리와 합병", "conceptKey": "공시 지적-요역지 지역권 합병불가"},
{"type": "일반", "cat": "부동산공시법", "q": "부동산등기법령상 가압류등기와 가등기에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["가압류등기가 마쳐진 뒤에도 채무자는 그 부동산을 처분할 수 있으나, 그 처분으로 이후 실행될 경매에서 가압류채권자에게 대항하지 못한다.","임차권과 같이 소유권 외의 권리도 가압류의 대상이 될 수 있다.","사인증여는 정지조건부 계약이므로 이를 원인으로 한 가등기를 할 수 있다.","가처분등기는 다툼이 있는 권리를 보전하기 위하여 당사자가 등기소에 직접 신청하여 실행한다."], "answer": 3, "expl": "가처분등기는 가압류·경매개시결정등기와 같이 법원의 촉탁으로 실행되는 등기이지 당사자가 직접 신청하는 등기가 아니다. 보전처분은 법원의 재판을 등기부에 얹는 절차이기 때문이다. 가압류가 처분 자체를 막는 것이 아니라 대항력만 부정한다는 구조, 보증금 회수가 가능한 임차권의 가압류 허용, 사인증여 가등기와 함께 정리해 두자.", "src": "2026-08-27 부동산공시법 처분제한등기와 가등기", "conceptKey": "공시 가처분-법원촉탁 실행"},
{"type": "일반", "cat": "부동산공시법", "q": "부동산등기법령상 촉탁에 따른 등기에 관한 설명으로 옳은 것은?", "opts": ["촉탁등기는 등기관이 스스로 판단하여 실행하는 직권등기의 일종이다.","매각으로 인한 소유권이전등기가 촉탁된 경우, 그 부동산에 있던 임의경매개시결정등기의 말소는 법원의 촉탁을 기다릴 필요 없이 등기관이 직권으로 한다.","촉탁은 다른 국가기관이 등기관에게 등기를 부탁하여 맡기는 구조이므로, 촉탁에 따른 등기는 직권등기에 해당하지 아니한다.","가압류등기는 가압류채권자와 채무자가 공동으로 신청하여 실행한다."], "answer": 2, "expl": "촉탁은 부탁할 촉과 맡길 탁의 결합으로, 집행법원 같은 다른 국가기관이 등기를 요청하는 구조라서 등기관이 스스로 판단해 고치는 직권등기와 구별된다. 매각 후 경매개시결정등기의 말소도 그 판단이 실체적이어서 직권이 아니라 법원의 촉탁으로 하고, 가압류등기 역시 당사자 신청이 아니라 법원 촉탁 사항이다. 촉탁과 직권을 한 단어처럼 묶어 내는 지문이 함정이다.", "src": "2026-08-27 부동산공시법 촉탁등기의 구조", "conceptKey": "공시 촉탁-직권 아님 어원"},
{"type": "조합", "cat": "부동산공시법", "q": "부동산등기법령상 등기관의 심사권과 직권말소에 관한 설명으로 옳은 것을 모두 고른 것은?<br>ㄱ. 등기관은 신청서류가 형식적으로 적법한지를 심사할 권한이 있을 뿐 신청인이 진정한 처분권자인지를 실체적으로 조사할 권한은 없다.<br>ㄴ. 등기신청할 권한이 없는 자가 신청하여 마쳐진 소유권이전등기는 직권말소의 대상이 되지 않는다.<br>ㄷ. 법원의 촉탁으로 실행되어야 할 가압류등기를 일반인이 신청하여 마쳐진 경우에도 등기관은 이를 직권말소할 수 없다.<br>ㄹ. 합유지분에 대한 가압류등기는 할 수 없다.", "opts": ["ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 0, "expl": "등기관의 심사권은 형식적 심사에 그치므로 무권한자의 신청으로 마쳐진 소유권이전등기는 실체 판단이 필요해 직권말소를 할 수 없다. 반면 가압류·가처분·경매개시결정등기처럼 법원 촉탁으로만 가능한 등기를 일반인이 신청한 것은 형식만 보아도 위법이 드러나므로 직권말소 사항이다. 합유는 지분 처분 자체가 막혀 있어 그 가압류도 허용되지 않는다.", "src": "2026-08-27 부동산공시법 등기관의 심사권", "conceptKey": "공시 심사권-직권말소 가부"},
{"type": "사례", "cat": "부동산공시법", "q": "갑은 자기 소유 X토지를 을에게 매도하는 계약을 체결하였으나 소유권이전등기를 마치기 전에 사망하였고, 병이 갑을 단독으로 상속하였다. 부동산등기법령상 이에 관한 설명으로 옳은 것은?", "opts": ["먼저 병 명의의 상속을 원인으로 한 소유권이전등기를 마친 후에야 비로소 을 명의의 소유권이전등기를 신청할 수 있다.","병은 자기 명의로 등기하지 아니하고도 갑 명의의 등기를 그대로 이용하여 을 명의로의 이전등기를 신청할 수 있다.","갑의 사망으로 매매계약에 따른 등기의무는 소멸한다.","이 경우에는 등기를 반드시 두 번 하여야 하므로 상속등기를 생략할 수 없다."], "answer": 1, "expl": "등기원인이 발생한 후 등기의무자가 사망하면 포괄승계인은 자기 명의 등기 없이 피상속인 명의의 등기를 그대로 이용하여 신청할 수 있다. 갑이 생전에 이미 이전의무를 지고 있었고 병이 그 의무를 포괄승계하였으므로 상속등기를 거쳤다가 다시 넘길 실익이 없기 때문이다. 등기의무는 소멸하는 것이 아니라 상속인에게 넘어간다는 점이 축이다.", "src": "2026-08-27 부동산공시법 포괄승계인의 등기신청", "conceptKey": "공시 포괄승계-상속등기 생략"},
{"type": "OX", "cat": "부동산공시법", "q": "소유권 외의 권리를 목적으로 하는 가압류등기는 부기등기로 한다. (O/X)", "opts": ["O","X"], "answer": 0, "expl": "O. 소유권을 가압류하면 주등기로 하지만 전세권·임차권 같은 소유권 외의 권리를 가압류할 때에는 그 권리의 등기에 부기등기로 한다. 대상 권리에 딸린 처분제한임을 등기부에서 한눈에 잇기 위한 형식이다. 주등기로 한다고 바꿔 내면 틀린 지문이 된다.", "src": "2026-08-27 부동산공시법 처분제한등기의 형식", "conceptKey": "공시 가압류-소유권외 부기"},
{"type": "사례", "cat": "부동산세법", "q": "갑은 주거·상업·공업지역 외의 지역에 있고 환지예정지가 아닌 자기 소유의 농지를 을 소유의 농지와 교환하고 양도소득세 비과세를 적용받았다. 소득세법령상 이에 관한 설명으로 옳은 것은?", "opts": ["이 비과세는 주거지역 안에 있는 농지를 교환한 경우에도 적용된다.","교환한 농지가 농지 외의 토지로 환지예정지로 지정되면 그 지정일 이후 5년이 지나야 비과세에서 제외된다.","갑은 교환으로 취득한 농지를 향후 3년간 실제로 경작하여야 한다.","갑이 매매계약서의 거래가액을 실지거래가액과 다르게 적은 경우, 속인 금액과 비과세받을 세액 중 큰 금액을 비과세 세액에서 뺀다."], "answer": 2, "expl": "농지의 교환·분합 비과세는 사후에 3년간 실제 경작할 것을 요구한다. 실제로 농사를 계속 짓는 사람의 농지 맞바꿈만 봐주려는 제도이기 때문이다. 주거·상업·공업지역 안의 농지와 환지예정지는 개발 이익이 예정된 땅이라 배제되고 환지예정지 지정 후에는 3년이 지나면 제외되며, 계약서를 거짓 기재하면 속인 금액과 비과세 세액 중 적은 금액을 빼는 제재가 따른다.", "src": "2026-08-27 부동산세법 농지의 교환·분합 비과세", "conceptKey": "세법 농지교환-사후 3년 경작"},
{"type": "일반", "cat": "부동산세법", "q": "소득세법령상 양도차익 계산에서 필요경비의 계산구조에 관한 설명으로 옳은 것은?", "opts": ["취득가액을 추계로 산정한 경우에는 자본적지출액과 양도비도 필요경비개산공제로 대체된다.","취득가액을 실지거래가액으로 확인한 경우에도 자본적지출액과 양도비는 실제 지출액이 아니라 필요경비개산공제로 대체된다.","매매사례가액은 양도일 또는 취득일 전후 각 6개월 이내의 가액을 말한다.","취득가액을 추계할 때 활용하는 가액에 기준시가는 포함되지 아니한다."], "answer": 0, "expl": "취득가액을 추계하면 자본적지출액과 양도비도 실액 대신 필요경비개산공제로 대체된다. 취득가액을 무엇으로 잡았느냐가 나머지 경비의 산정 방식까지 결정하는 연동 구조이기 때문이다. 실지거래가액이면 자본적지출·양도비가 그대로 반영되고, 추계 가액은 매매사례가액·감정가액·환산취득가액·기준시가이며 매매사례가액의 기간은 전후 각 3개월이다.", "src": "2026-08-27 부동산세법 필요경비 계산구조", "conceptKey": "세법 추계-개산공제 대체"},
{"type": "조합", "cat": "부동산세법", "q": "소득세법령상 실지거래가액에 의한 양도차익 계산 시 필요경비에 산입되지 아니하는 것을 모두 고른 것은?<br>ㄱ. 상속세<br>ㄴ. 취득자금에 충당한 대출금의 이자지급액<br>ㄷ. 파손된 유리의 교체와 같은 수익적지출액<br>ㄹ. 그 자산의 취득과 관련하여 직접 지출한 소송비용", "opts": ["ㄱ, ㄴ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 2, "expl": "상속세, 대출금 이자, 수익적지출액은 자산의 가치에 화체되는 돈이 아니어서 필요경비에 들어가지 못한다. 이자는 자본조달비용이고 수익적지출은 그 해의 사용가치로 이미 소모된 비용이기 때문이다. 반면 취득 관련 소송비용은 자산을 온전히 내 것으로 만드는 데 든 비용이므로 다른 소득에서 공제된 적이 없는 한 산입된다.", "src": "2026-08-27 부동산세법 필요경비 산입 여부", "conceptKey": "세법 필요경비-불산입 3종"},
{"type": "일반", "cat": "부동산세법", "q": "⏪ 지방세법령상 취득세 납세의무의 귀속에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["채권자가 채무자의 미등기 부동산을 대신 등기하면서 취득세를 대신 납부한 경우, 지방자치단체의 장은 그 사실을 채무자에게 즉시 통보하여야 한다.","상속인이 유증을 받은 경우에는 상속으로 본다.","감자로 인하여 과점주주가 된 경우는 과점주주에게 취득세를 부과하는 경우에 해당하지 아니한다.","임차인이 건물에 엘리베이터를 설치한 경우 그 취득세는 설치한 임차인이 납부할 의무가 있다."], "answer": 3, "expl": "임차인이 설치한 엘리베이터라도 취득세는 주체구조부취득자인 건물 주인, 곧 임대인이 납부할 의무를 진다. 부속물은 건물의 주체구조부에 붙어 그 소유자의 것이 되는 실질을 따르기 때문이다. 채권자 대위 납부 시의 즉시 통보, 상속인의 유증은 상속, 감자로 인한 과점주주 제외와 함께 실질 귀속의 축으로 정리하자.", "src": "2026-07-19 부동산세법 취득세 납세의무자 (장기복습·42일전)", "conceptKey": "세법 취득세-주체구조부취득자"},
{"type": "조합", "cat": "부동산세법", "q": "⏪ 지방세법령상 취득세의 과세대상과 상속재산의 재분할에 관한 설명으로 옳은 것을 모두 고른 것은?<br>ㄱ. 지적공부에 등록되지 아니한 토지라도 사실상 존재하는 토지는 과세대상에 포함된다.<br>ㄴ. 지하 또는 다른 구조물에 설치하는 급수·배수시설, 도관시설도 건축물에 포함된다.<br>ㄷ. 상속 후 재분할로 지분이 감소한 사람은 지분이 증가한 사람에게 증여한 것으로 본다.<br>ㄹ. 상속회복청구의 소에 의하여 재분할된 경우에도 지분 변동을 증여로 본다.", "opts": ["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 1, "expl": "취득세는 지적공부 등록 여부를 가리지 않고 사실상 존재하는 토지에 걸리고, 급수·배수시설이나 도관시설 같은 부속 설비도 건축물의 범위에 들어간다. 재분할로 지분이 줄어든 사람은 늘어난 사람에게 증여한 것으로 보지만, 상속회복청구의 소에 의한 재분할은 처음부터 그 비율로 상속받은 것으로 보아 증여가 끼어들 자리가 없다. 소에 의한 경우까지 증여로 넓히면 틀린다.", "src": "2026-07-19 부동산세법 취득세 과세대상과 재분할 (장기복습·42일전)", "conceptKey": "세법 취득세-재분할 증여의제"},
{"type": "OX", "cat": "부동산세법", "q": "소득세법령상 토지가 수용되는 경우 양도시기는 대금청산일, 수용개시일, 사업인정고시일 중 빠른 날이다. (O/X)", "opts": ["O","X"], "answer": 1, "expl": "X. 수용의 양도시기는 대금청산일·수용개시일·소유권이전등기접수일 중 빠른 날이고 사업인정고시일은 후보에 들지 않는다. 고시는 알리는 행위일 뿐이고 세법은 대금이나 권리가 실제로 움직인 날만 인정하기 때문이다. 세 후보 가운데 하나를 사업인정고시일이나 실제 사용일로 바꿔 끼우는 것이 전형적 함정이다.", "src": "2026-08-28 부동산세법 수용의 양도시기", "conceptKey": "세법 수용-양도시기 3요소"},
{"type": "일반", "cat": "공인중개사법", "q": "🔄 공인중개사법령상 개업공인중개사의 게시의무와 옥외광고물 표기에 관한 설명으로 옳은 것은?", "opts": ["중개사무소 옥외광고물을 설치하는 경우 개업공인중개사의 성명을 표기하여야 한다","개업공인중개사는 실무교육 수료증 원본을 중개사무소 안의 보기 쉬운 곳에 게시하여야 한다","개업공인중개사는 중개사무소에 옥외광고물을 반드시 설치하여야 한다","부칙상 개업공인중개사는 부동산중개라는 문자를 사용할 수 없다"], "answer": 0, "expl": "[정답 근거] 옥외광고물에는 성명 표기만 의무이고 사무소 명칭 표기나 설치 자체는 의무가 아니다. [메커니즘] 광고를 본 소비자가 누구에게 책임을 물을지 특정하려면 사람 이름이 필요해 성명만 강제했다. [함정] 실무교육 수료증 원본은 게시대상이 아니고, 부칙상 개공도 부동산중개 문자는 쓸 수 있다.", "src": "2026-07-24 공인중개사법 1-1 사무소 게시·명칭·옥외광고물 (한달전 재출제·원본 2026-07-31)", "conceptKey": "공인중개사법 1-1 옥외광고물", "monthlyOf": "2026-07-31"},
{"type": "사례", "cat": "공인중개사법", "q": "🔄 개업공인중개사 갑은 중개보조원 을을 고용하여 의뢰인 병의 중개업무를 보조하게 하였다. 이에 관한 설명으로 옳은 것은?", "opts": ["을이 병에게 자신이 중개보조원임을 고지하지 아니한 경우 을에게는 100만원 이하의 과태료가 부과된다","갑이 상당한 주의·감독을 게을리하였다면 갑에게도 500만원 이하의 과태료가 부과된다","갑은 을을 고용한 후 직무교육을 받게 하기 전에 먼저 등록관청에 고용신고를 하여야 한다","고용신고를 받은 등록관청은 을의 실무교육 수료 여부를 확인하여야 한다"], "answer": 1, "expl": "중개보조원 신분 고지의무 위반은 보조원 본인과 감독을 게을리한 개업공인중개사 모두 500만원 이하 과태료 대상이다. 의뢰인이 상대를 공인중개사로 오인하는 것을 막는 규정이라 실제 관리 책임자까지 함께 묶은 것이다. 순서는 고용→직무교육→신고이고 확인 대상도 실무교육이 아니라 직무교육이다.", "src": "2026-07-24 공인중개사법 1-5 고용인·인장·책임 (한달전 재출제·원본 2026-07-28)", "conceptKey": "공인중개사법 1-5 중개보조원 고지의무", "monthlyOf": "2026-07-28"},
{"type": "사례", "cat": "민법", "q": "🔄 갑의 무권대리인 을이 갑을 대리하여 병과 매매계약을 체결한 뒤 을이 갑을 단독으로 상속하였다. 이에 관한 설명으로 옳은 것은?", "opts": ["을이 본인의 지위에서 추인을 거절하는 것은 신의칙에 반하여 허용되지 아니한다","병에게 과실이 있더라도 병은 을에게 무권대리인의 책임을 물을 수 있다","을이 계약 당시 제한능력자인 미성년자였더라도 병은 을에게 손해배상책임을 물을 수 있다","을의 행위에 표현대리가 성립하면 그 행위는 처음부터 유권대리로 전환된다"], "answer": 0, "expl": "스스로 효력을 발생시키려던 자가 본인 자리에 앉았다고 추인을 거절하는 것은 선행행위에 모순되어 허용되지 않는다. 무권대리인의 책임은 무과실책임이지만 이를 물을 수 있는 상대방은 선의·무과실이어야 한다. 표현대리는 여전히 무권대리이고 상대방에게 선택권이 생길 뿐 유권대리가 되지는 않는다.", "src": "2026-07-20 민법 1-5 무권대리 (한달전 재출제·원본 2026-07-28)", "conceptKey": "민법총칙 1-5 무권대리 상속", "monthlyOf": "2026-07-28"},
{"type": "일반", "cat": "민법", "q": "🔄 민법상 복대리인의 선임과 그 지위에 관한 설명으로 옳은 것은?", "opts": ["복대리인은 본인이 직접 선임하는 자이므로 대리인의 복임행위를 요하지 아니한다","법정대리인은 그 책임으로 복대리인을 선임할 수 있고 그 책임은 원칙적으로 무과실책임이다","임의대리인은 본인의 승낙이 없더라도 언제든지 복대리인을 선임할 수 있다","대리인이 복대리인을 선임한 경우에는 표현대리가 성립할 여지가 없다"], "answer": 1, "expl": "[정답 근거] 법정대리인은 언제든 자기 책임으로 복대리인을 선임할 수 있고 그 책임은 원칙적으로 무과실책임이다. [메커니즘] 법정대리는 본인이 스스로 판단할 능력이 부족한 상황을 전제하므로 복임권은 넓게, 책임은 무겁게 설계된다. [함정] 임의대리인은 승낙이나 급박한 사유가 있을 때만 선임할 수 있고 복대리에도 표현대리가 성립할 수 있다.", "src": "2026-07-20 민법 1-4 복대리 (한달전 재출제·원본 2026-07-30)", "conceptKey": "민법 복대리 복임권", "monthlyOf": "2026-07-30"},
{"type": "계산", "cat": "부동산공법", "q": "🔄 도시지역 외의 지역에 있는 대지에 건폐율 특례가 적용되어 기준 건폐율에 20퍼센트포인트를 더할 수 있다. 기준 건폐율이 20퍼센트인 면적 1,000제곱미터 대지에 건축할 수 있는 최대 건축면적은? (다른 조건은 동일)", "opts": ["400제곱미터","500제곱미터","600제곱미터","700제곱미터"], "answer": 0, "expl": "특례 적용 건폐율은 20 + 20 = 40퍼센트이므로 1,000 × 40 ÷ 100 = 400제곱미터다. 도시지역 밖은 기반시설 부담이 적어 밀도를 다소 풀어주는 것이 특례의 취지다. 자연녹지에 추가로 10을 더 주는 규정, 수산자원 40·농공단지 70·공업단지 80이라는 상한 숫자와 섞어 출제된다.", "src": "2026-07-21 부동산공법 1-2 건폐율·용적률 숫자 (한달전 재출제·원본 2026-07-28)", "conceptKey": "부동산공법 1-2 건폐율 특례", "calc": {"expr":"1000 * (20 + 20) / 100","expected":400}, "monthlyOf": "2026-07-28"},

{"type": "사례", "cat": "부동산공시법", "q": "🔄 갑이 소유한 임야도에 등록된 토지가 사실상 형질변경되었으나 임야도에 등록할 수 있는 지목의 범위에서는 지목변경이 불가능하다. 이에 관한 설명으로 옳은 것은?", "opts": ["갑은 그 사유가 발생한 날부터 30일 이내에 지적소관청에 분할을 신청하여야 한다","갑은 그 사유가 발생한 날부터 60일 이내에 지적소관청에 등록전환을 신청할 수 있다","등록전환에 따른 면적은 오차 허용범위를 초과하는 경우에만 등록전환될 면적으로 정한다","등록전환으로 면적이 변동하여도 갑은 종전 임야대장의 면적을 그대로 유지하여야 한다"], "answer": 1, "expl": "[정답 근거] 임야도에 등록할 수 있는 지목 내에서 지목변경이 막히면 등록전환 사유가 되고 그 신청기한은 사유 발생일부터 60일이다. [메커니즘] 이용 실태가 임야를 벗어났는데 임야도에 남겨 두면 공부와 현실이 벌어지므로 지적도로 옮겨 관리한다. [함정] 등록전환 면적은 허용범위를 초과하든 이내이든 무조건 등록전환될 면적으로 정한다.", "src": "2026-07-23 부동산공시법 1-4 등록전환 (한달전 재출제·원본 2026-07-30)", "conceptKey": "부동산공시법 1-4 등록전환", "monthlyOf": "2026-07-30"},

];

/*__BUILD_PAYLOAD_START__*/
// ── 순수 함수 레이어: DOM 없이 채점 결과(payload v2)를 만든다. node로 단위테스트 가능.
function conceptFromSrc(src){
  return String(src||"").replace(/^\s*\d{4}-\d{2}-\d{2}\s*/,"").replace(/\s*\(재도전\)\s*$/,"").trim();
}
function buildPayload(questions, sel, quizDate, nowIso, schemaVersion){
  let score = 0; const results = [], wrong = [];
  questions.forEach((item, qi)=>{
    const isCorrect = sel[qi] === item.answer;
    if(isCorrect) score++;
    const ck = item.conceptKey || conceptFromSrc(item.src);
    const isRetry = !!item.retryOf || /\(재도전\)/.test(item.src||"") || String(item.q||"").indexOf("🔁") >= 0;
    const base = {
      id: quizDate + "-q" + (qi+1), cat: item.cat, type: item.type, q: item.q,
      options: item.opts, myAnswer: item.opts[sel[qi]], correct: item.opts[item.answer],
      expl: item.expl, src: item.src
    };
    const r = Object.assign({}, base, {
      conceptKey: ck,
      retryOf: isRetry ? (item.retryOf || ck) : null,
      correctAnswered: isCorrect
    });
    if(item.calc) r.calc = item.calc;
    results.push(r);
    if(!isCorrect) wrong.push(base);   // v1 하위호환 필드 (기존 수거 파이프라인용)
  });
  return { score: score, wrong: wrong, payload: {
    schemaVersion: schemaVersion, subject: "공인중개사", date: quizDate, quizId: quizDate,
    score: score, total: questions.length, wrongCount: wrong.length,
    results: results, wrong: wrong, generatedAt: nowIso
  }};
}
/*__BUILD_PAYLOAD_END__*/

const form = document.getElementById('quiz');
const selected = new Array(QUESTIONS.length).fill(null);
let graded = false;
let LAST_PAYLOAD = null;
let lastCat = null;

document.getElementById('total').textContent = ' / ' + QUESTIONS.length;

QUESTIONS.forEach((item, qi)=>{
  if(item.cat !== lastCat){
    const s = document.createElement('div');
    s.className = 'sec';
    s.textContent = '▍' + item.cat;
    form.appendChild(s);
    lastCat = item.cat;
  }
  const card = document.createElement('div');
  card.className = 'q';
  const isOX = item.type === 'OX';
  card.innerHTML = `
    <div class="qhead">
      <span class="qno">${qi+1}</span>
      <span class="qtype">${item.type}</span>
      <span class="qcat">${item.cat}</span>
    </div>
    <div class="qtext">${item.q}</div>
    <div class="opts ${isOX?'ox':''}" data-q="${qi}"></div>
    <div class="expl" id="expl-${qi}"></div>`;
  const optsEl = card.querySelector('.opts');
  item.opts.forEach((o, oi)=>{
    const el = document.createElement('div');
    el.className = 'opt';
    el.dataset.q = qi; el.dataset.o = oi;
    el.innerHTML = isOX
      ? `<span>${o}</span>`
      : `<span class="mk">${String.fromCharCode(65+oi)}</span><span>${o}</span>`;
    el.addEventListener('click', ()=>{
      if(graded) return;
      selected[qi] = oi;
      optsEl.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');
      updateProgress();
    });
    // 눈동자(👁) 소거 버튼 — 확실히 아닌 보기를 희미하게(다시 누르면 복구). 채점·선택·저장에 영향 없음.
    if(!isOX){
      const eye = document.createElement('button');
      eye.type = 'button';
      eye.className = 'eye';
      eye.textContent = '👁';
      eye.title = '확실히 아닌 보기 희미하게 (다시 누르면 복구)';
      eye.setAttribute('aria-label', '이 보기를 후보에서 제외');
      eye.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        if(graded) return;
        el.classList.toggle('ruled');
      });
      el.appendChild(eye);
    }
    optsEl.appendChild(el);
  });
  form.appendChild(card);
});

function updateProgress(){
  const done = selected.filter(s=>s!==null).length;
  document.getElementById('pcount').textContent = `${done} / ${QUESTIONS.length} 선택`;
  document.getElementById('pbar').style.width = (done/QUESTIONS.length*100)+'%';
  document.getElementById('submitBtn').disabled = done !== QUESTIONS.length;
}

const btn = document.getElementById('submitBtn');
btn.addEventListener('click', ()=>{ if(!graded){ grade(); } else { location.reload(); } });

document.getElementById('copyBtn').addEventListener('click', ()=>{
  if(!LAST_PAYLOAD) return;
  const txt = JSON.stringify(LAST_PAYLOAD, null, 2);
  const done = ()=>{ document.getElementById('dlnote').textContent = "📋 복사 완료 — velog-posts/공인중개사/claude_ox_오답/_inbox/에 붙여넣어 저장해도 된다"; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt, done));
  } else { fallbackCopy(txt, done); }
});
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  ta.remove();
}

function grade(){
  graded = true;
  const built = buildPayload(QUESTIONS, selected, QUIZ_DATE, new Date().toISOString(), SCHEMA_VERSION);
  LAST_PAYLOAD = built.payload;
  QUESTIONS.forEach((item, qi)=>{
    const opts = document.querySelectorAll(`.opt[data-q="${qi}"]`);
    opts.forEach((el, oi)=>{
      el.style.cursor='default';
      el.classList.remove('ruled');           // 채점 시 소거 표시 해제(정답이 희미하게 남지 않도록)
      const eye = el.querySelector('.eye');    // 눈동자 버튼 제거 — 채점 후엔 불필요
      if(eye) eye.remove();
      if(oi === item.answer) el.classList.add('correct');
      if(oi === selected[qi] && oi !== item.answer) el.classList.add('wrong');
    });
    const correct = selected[qi] === item.answer;
    const ex = document.getElementById('expl-'+qi);
    ex.innerHTML = `<span class="verdict" style="color:${correct?'var(--ok)':'var(--no)'}">${correct?'정답!':'오답'}</span>${item.expl}<span class="src">📄 출처: ${item.src}</span>`;
    ex.classList.add('show');
  });
  const r = document.getElementById('result');
  document.getElementById('score').textContent = built.score;
  document.getElementById('rmsg').textContent = msgFor(built.score);
  r.classList.add('show');
  btn.textContent = '🔄 다시 풀기';
  btn.classList.add('retry');
  document.getElementById('copyBtn').classList.add('show');

  // 결과 자동 다운로드 (월요일 수거·원장 갱신이 읽는 파일)
  downloadResult(built.payload);

  r.scrollIntoView({behavior:'smooth', block:'center'});
}

function downloadResult(payload){
  try{
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `공인중개사_오답_${QUIZ_DATE}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    document.getElementById('dlnote').textContent =
      payload.wrongCount>0 ? `💾 결과 저장됨(오답 ${payload.wrongCount}개) — 다운로드 폴더 확인` : "💾 만점 기록 저장됨";
  }catch(e){
    document.getElementById('dlnote').textContent = "⚠️ 자동 저장 실패 — 아래 '결과 JSON 복사'를 눌러 수동 저장";
  }
}

function msgFor(s){
  const t = QUESTIONS.length;
  const r = s/t;
  if(s===t)   return "만점. 오늘 등록증 발급해도 되겠는데요? 🏆";
  if(r>=0.8)  return "합격권. 틀린 거 해설만 한 번 더 보면 완벽합니다.";
  if(r>=0.6)  return "절반은 넘었어요. 오답 노트행 직행하는 개념들이 보이네요.";
  if(r>=0.4)  return "아직 흔들리는 개념이 있어요. 해설 정독하고 내일 재도전!";
  return "괜찮아요, 회독이 쌓이면 올라갑니다. 해설부터 차근차근.";
}
