  {"type": "일반", "cat": "부동산학개론", "q": "부동산학개론상 부동산정책과 정부의 시장개입에 관한 설명으로 옳은 것은?", "opts": ["부동산가격공시제도는 정부가 거래당사자로 참여하는 직접개입방식이다.", "재건축부담금제가 개발부담금제보다 먼저 도입되었다.", "개발부담금은 개발이익 환수에 관한 법률에, 재건축부담금은 재건축초과이익 환수에 관한 법률에 근거한다.", "토지비축(토지은행)제도는 정부가 토지를 직접 취득하지 아니하고 조세와 금융으로 유인만 바꾸는 간접개입방식에 해당한다."], "answer": 2, "expl": "두 부담금은 근거 법률 자체가 달라 제도의 계보가 갈린다. 개발이익 일반을 환수하는 제도가 먼저 생기고, 재건축 초과이익을 겨냥한 제도가 뒤에 붙은 것이다. 도입 순서를 뒤집거나(B) 정보제공형인 가격공시를 직접개입으로 분류하는 것(A)이 함정이다.", "src": "2026-07-22 부동산학개론 1-2 정책론", "conceptKey": "부동산학개론 1-2 부담금제·개입방식"},
  {"type": "조합", "cat": "부동산학개론", "q": "부동산학개론상 토지의 정착물이 아니라 동산으로 취급되는 것을 모두 고른 것은?<br>ㄱ. 가식(假植) 중인 수목<br>ㄴ. 정원에 놓아둔 정원석<br>ㄷ. 토지에 견고하게 축조된 담장<br>ㄹ. 명인방법을 갖춘 수목의 집단", "opts": ["ㄱ, ㄷ", "ㄱ, ㄴ", "ㄴ, ㄹ", "ㄱ, ㄴ, ㄹ"], "answer": 1, "expl": "임시로 심어둔 수목(ㄱ)과 그저 올려놓은 정원석(ㄴ)은 토지와 계속적으로 결합되어 있지 않아 동산이다. 정착물 여부는 결합의 계속성과 거래관념으로 판단하기 때문이다. 담장(ㄷ)은 부착된 정착물, 명인방법을 갖춘 수목집단(ㄹ)은 독립된 부동산으로 취급되어 함정이 된다.", "src": "2026-07-17 부동산학개론 1-5 정착물", "conceptKey": "부동산학개론 1-5 정착물·동산 구분"},
  {"type": "OX", "cat": "부동산학개론", "q": "부동산학개론상 공업지가 주거지로 바뀌는 것처럼 택지지역 내부의 소분류 간 용도전환이 진행 중인 토지는 이행지에 해당한다. (O/X)", "opts": ["O", "X"], "answer": 0, "expl": "O. 택지지역 내부의 소분류(주거·상업·공업) 사이에서 용도가 바뀌는 중인 토지는 이행지다. 대분류가 그대로이므로 지역 자체가 바뀌는 것이 아니라 안에서 옮겨가는 것이기 때문이다. 임지·농지·택지 등 대분류 상호 간에 전환 중인 토지인 후보지와 구분해야 한다.", "src": "2026-07-17 부동산학개론 1-6 이행지·후보지", "conceptKey": "부동산학개론 1-6 이행지 판정"},
  {"type": "일반", "cat": "부동산공시법", "q": "🔁 지적소관청이 토지소유자의 신청 없이 직권으로 등록사항을 정정할 수 있는 경우에 <b>해당하지 않는</b> 것은?", "opts": ["지적측량성과와 다르게 지적공부가 정리되어 등록된 경계와 실제 측량결과가 어긋나게 된 경우", "토지이동정리 결의서의 내용과 다르게 정리된 경우", "지적공부의 작성 또는 재작성 당시 잘못 정리된 경우", "인접 토지소유자의 승낙 없이 경계를 옮기기를 소유자가 원하는 경우"], "answer": 3, "expl": "직권정정은 공부가 결의서·측량성과 등 원자료와 어긋날 때 국가가 스스로 바로잡는 절차다. 공부의 정확성 회복이 목적이기 때문이다. 경계가 실제로 변경되는 정정은 인접 소유자의 승낙서나 확정판결서 정본이 필요해 직권정정 사유가 될 수 없다는 점이 함정이다.", "src": "2026-07-23 부동산공시법 등록사항정정 (재도전)", "conceptKey": "부동산공시법 §1 등록사항정정", "retryOf": "부동산공시법 §1 등록사항정정"},
  {"type": "일반", "cat": "부동산공시법", "q": "공간정보관리법령상 분할·합병에 따른 지번부여 방법에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["지번은 지적소관청이 지번부여지역별로 차례대로 부여한다.", "주거용 건축물이 있는 필지를 분할할 때 그 필지의 지번은 분할 후 최종 본번으로 부여한다.", "합병의 경우 토지소유자의 신청이 있으면 건축물이 위치한 지번을 합병 후의 지번으로 할 수 있다.", "축척변경 시행지역과 신규등록지역은 지번부여방법이 서로 구분된다."], "answer": 1, "expl": "건축물이 있는 필지를 분할할 때는 그 건축물이 있는 쪽에 분할 전의 지번을 우선하여 부여한다. 주소가 계속 쓰이는 건물 쪽의 지번을 흔들지 않으려는 취지다. 소유자 신청이 개입하는 것은 합병이고 분할은 신청 없이 원칙대로 간다는 대비가 함정 포인트다.", "src": "2026-07-18 부동산공시법 1-3 지번 부여", "conceptKey": "부동산공시법 1-3 분할·합병 지번부여"},
  {"type": "일반", "cat": "부동산공시법", "q": "공간정보관리법령상 지적공부 및 지적기준점성과의 열람·발급 신청에 관한 설명으로 옳은 것은?", "opts": ["지적도의 열람은 시·도지사에게 신청하여야 한다.", "지적도근점성과의 열람은 국토교통부장관에게 신청하여야 한다.", "지적삼각점성과의 열람은 시·도지사 또는 지적소관청에 신청할 수 있다.", "정보처리시스템으로 처리된 지적공부의 발급은 읍·면·동장에게는 신청할 수 없다."], "answer": 2, "expl": "지적기준점성과 중 지적삼각점성과만 시·도지사에게도 신청할 수 있고 나머지는 지적소관청 창구다. 지적삼각점이 시·도 단위로 관리되기 때문이다. 지적공부 일반의 열람·발급에는 시·도지사나 국토교통부장관이 등장하지 않는다는 판별법과 함께 묶어야 한다.", "src": "2026-07-23 부동산공시법 1-1 열람·발급", "conceptKey": "부동산공시법 1-1 열람·발급 신청처"},
  {"type": "일반", "cat": "부동산공시법", "q": "공간정보관리법령상 등록전환과 그 면적 결정에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["임야대장 면적과 등록전환될 면적의 차이가 허용범위 이내이면 등록전환될 면적으로 결정한다.", "그 차이가 허용범위를 초과하면 임야대장의 면적을 직권으로 정정한 뒤 등록전환될 면적으로 결정한다.", "임야도에 등록된 토지가 사실상 형질변경되었으나 지목변경을 할 수 없으면 등록전환을 신청할 수 있다.", "등록전환은 그 사유가 발생한 날부터 30일 이내에 신청하여야 한다."], "answer": 3, "expl": "등록전환의 신청기한은 사유 발생일부터 60일이다. 토지이동 신청기한은 대체로 60일로 통일되어 있기 때문이다. 면적은 허용범위 초과 여부와 관계없이 결국 등록전환될 면적으로 정해진다는 점(A·B)과 기한 숫자를 30일로 줄여 놓은 것이 함정이다.", "src": "2026-07-23 부동산공시법 1-4 등록전환", "conceptKey": "부동산공시법 1-4 등록전환 기한·면적"},
  {"type": "조합", "cat": "부동산공시법", "q": "공간정보관리법령상 토지소유자가 그 사유 발생일부터 60일 이내에 지적소관청에 합병을 신청하여야 하는 지목을 모두 고른 것은?<br>ㄱ. 제방<br>ㄴ. 하천<br>ㄷ. 구거<br>ㄹ. 잡종지", "opts": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 1, "expl": "제방·하천·구거·유지처럼 공공용 성격이 강한 지목은 합병 신청이 의무로 걸린다. 공부와 실제 이용현황을 국가가 일치시켜 관리해야 하는 토지이기 때문이다. 사적 이용이 자유로운 잡종지(ㄹ)를 끼워 넣어 의무 지목을 넓혀 놓은 것이 함정이다.", "src": "2026-07-23 부동산공시법 1-5 합병", "conceptKey": "부동산공시법 1-5 합병 신청의무 지목"},
  {"type": "사례", "cat": "부동산공시법", "q": "공간정보관리법령상 갑이 단독으로 소유한 A토지와 갑·을이 공유하는 B토지를 하나의 필지로 합병하려 한다. 이에 관한 설명으로 옳은 것은? (다른 조건은 동일)", "opts": ["두 토지의 지목만 같으면 소유관계와 관계없이 합병할 수 있다.", "갑이 B토지 지분의 과반수를 가지고 있으면 합병할 수 있다.", "소유자별 공유지분이 서로 달라 합병을 신청할 수 없다.", "합병 후 을이 승낙하면 지적소관청이 직권으로 이를 정정할 수 있다."], "answer": 2, "expl": "소유자별 공유지분이 서로 다르면 합병할 수 없다. 하나의 필지가 되면 지분관계가 뒤섞여 권리관계를 공부로 표시할 수 없기 때문이다. 지목이 같다는 사정이나 과반수 지분은 이 제한을 뚫는 사유가 되지 않는다는 점이 함정이다.", "src": "2026-07-23 부동산공시법 1-5 합병", "conceptKey": "부동산공시법 1-5 합병 소유관계 제한"},
  {"type": "OX", "cat": "부동산공시법", "q": "공간정보관리법령상 임야도에 등록된 토지를 도시·군관리계획선에 따라 나누려는 경우에는 분할이 아니라 등록전환을 신청하여야 한다. (O/X)", "opts": ["O", "X"], "answer": 0, "expl": "O. 도시·군관리계획선에 따른 경우는 분할 신청사유 목록이 아니라 지목변경 없이 등록전환을 신청할 수 있는 경우로 열거되어 있다. 임야도의 땅을 지적도로 옮겨야 정밀한 계획선을 표시할 수 있기 때문이다. 물리적으로 땅이 나뉜다는 사실에 끌려 분할로 답하면 틀린다.", "src": "2026-07-23 부동산공시법 1-3 등록전환", "conceptKey": "부동산공시법 1-3 도시군관리계획선 등록전환"},
  {"type": "일반", "cat": "부동산세법", "q": "지방세법령상 상속재산의 재분할과 취득세에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["상속개시 후 재분할로 특정 상속인의 지분이 증가하면 그 증가분은 다른 상속인으로부터 증여받은 것으로 본다.", "상속인이 유증을 받은 경우에는 상속으로 보아 취득세를 부과한다.", "상속회복청구의 소에 따른 재분할이라면 처음부터 그 비율로 상속받은 것으로 본다.", "상속회복청구의 소에 따른 재분할에서도 지분 증가분은 증여로 보아 취득세를 부과한다."], "answer": 3, "expl": "상속회복청구의 소에 따른 재분할은 애초의 상속분을 되찾은 것이므로 증여가 끼어들 자리가 없다. 원래부터 그 비율이었다고 소급해 보기 때문이다. 임의로 다시 나눈 재분할(증여 의제)과 소로 되찾은 경우를 같은 취급으로 묶은 것이 함정이다.", "src": "2026-07-19 부동산세법 4 상속재산 재분할", "conceptKey": "부동산세법 4 상속 재분할·증여의제"},
  {"type": "일반", "cat": "부동산세법", "q": "지방세법령상 취득으로 보지 <b>않는</b> 계약해제에 관한 설명으로 옳은 것은?", "opts": ["소유권이전등기를 이미 마쳤더라도 취득일부터 60일 이내에 계약이 해제된 사실이 화해조서 등으로 입증되면 취득으로 보지 않는다.", "등기·등록을 하지 않고 유상승계취득일부터 60일 이내에 계약이 해제된 사실이 입증되면 취득으로 보지 않는다.", "증여의 경우에도 취득일부터 60일 이내에 해제되어야 취득으로 보지 않는다.", "계약해제에서 등기 여부는 취득 여부의 판단과 무관하다."], "answer": 1, "expl": "핵심 요건은 등기·등록을 하지 않았을 것이다. 등기를 마친 순간 이미 취득이 완성되어 되돌릴 논의 자체가 사라지기 때문이다. 등기해도 된다고 하거나(A) 등기 여부가 무관하다고 하는 것(D), 증여의 기한을 60일로 바꿔 놓은 것(C)이 함정이다.", "src": "2026-07-19 부동산세법 6 계약해제", "conceptKey": "부동산세법 6 계약해제 취득 제외"},
  {"type": "일반", "cat": "부동산세법", "q": "지방세법령상 취득세 과세표준 산정 시 시가표준액에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["개별주택가격이 공시되지 않은 주택의 시가표준액은 특별자치시장 등이 임의로 정한 가액으로 한다.", "개별공시지가가 공시되지 않은 토지는 국토교통부장관이 제공한 토지가격비준표로 산정한 가액으로 한다.", "토지 및 주택 외의 건축물의 시가표준액은 대통령령으로 정하는 기준에 따라 지방자치단체의 장이 결정한 가액으로 한다.", "증여받은 부동산의 시가표준액이 1억원 이하인지는 지분으로 쪼개지 않고 전체를 기준으로 판단한다."], "answer": 0, "expl": "공시가격이 없는 주택은 임의로 정하는 것이 아니라 국토교통부장관이 제공한 주택가격비준표를 사용해 산정한다. 산정 기준을 법정화해 자의적 과세를 막기 위함이다. 비준표를 지우고 임의 결정으로 바꿔 놓아 절차 통제를 없앤 것이 함정이다.", "src": "2026-07-19 부동산세법 8 과세표준", "conceptKey": "부동산세법 8 시가표준액 산정"},
  {"type": "조합", "cat": "부동산세법", "q": "지방세법령상 취득세를 부과하는 경우를 모두 고른 것은?<br>ㄱ. 기부를 받아 부동산을 무상취득한 경우<br>ㄴ. 국가가 부동산을 취득한 경우<br>ㄷ. 가액의 증가 없이 건축물을 이전한 경우<br>ㄹ. 지적공부에 등록되지 않았으나 사실상 존재하는 토지를 취득한 경우", "opts": ["ㄱ, ㄴ, ㄷ", "ㄱ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": 2, "expl": "취득세는 무상·유상, 등기 여부, 공부 등록 여부를 가리지 않고 폭넓게 걸리므로 기부(ㄱ)·사실상 토지(ㄹ)는 물론 가액 증가가 없는 건축물 이전(ㄷ)도 과세된다. 등기 절차에 대응하는 세부담이 남기 때문이다. 국가의 취득(ㄴ)만은 무조건 비과세라는 점이 함정이다.", "src": "2026-07-19 부동산세법 1·5 과세대상·비과세", "conceptKey": "부동산세법 1·5 과세·비과세 판정"},
  {"type": "계산", "cat": "부동산세법", "q": "지방세법령상 갑이 특수관계인 을로부터 상가를 유상승계취득하였다. 아래 조건에서 부당행위계산 부인 여부를 판정할 때 기준이 되는 금액(시가인정액의 100분의 5에 해당하는 금액)은? (다른 조건은 동일)<br>· 시가인정액: 12억원<br>· 사실상취득가액: 11억 4천만원", "opts": ["3천만원", "4천 8백만원", "5천 4백만원", "6천만원"], "answer": 3, "expl": "기준금액은 시가인정액 12억원 × 5% = 6천만원이다. 유상승계취득의 부당행위계산은 차액이 3억원 이상이거나 시가인정액의 5% 이상일 때 인정된다. 여기서 차액은 6천만원이므로 기준을 충족한다. 증여 간주 기준인 3억원·30%와 요율을 섞으면 틀린다.", "src": "2026-07-19 부동산세법 3 부당행위계산", "conceptKey": "부동산세법 3 부당행위계산 기준금액", "calc": {"expr": "1200000000*0.05", "expected": 60000000}},
  {"type": "사례", "cat": "부동산세법", "q": "지방세법령상 갑은 아버지 을로부터 시가인정액 10억원인 아파트를 6억원의 대가를 지급하고 취득하였다. 이에 관한 설명으로 옳은 것은? (다른 조건은 동일)", "opts": ["대가를 지급한 사실이 있으므로 언제나 유상승계취득으로 본다.", "대가와 시가인정액의 차액이 3억원 이상이므로 증여로 본다.", "직계존비속 간 거래에는 무상취득 추정이 적용되지 않는다.", "차액이 시가인정액의 100분의 5 이상이므로 부당행위계산 규정을 먼저 적용한다."], "answer": 1, "expl": "차액 4억원은 3억원 이상이므로 대가를 지급했더라도 증여로 간주된다. 형식상 매매를 끼워 증여세·취득세 부담을 낮추는 것을 막기 위함이다. 증여 간주(3억원 또는 30%)를 먼저 보고, 해당하지 않을 때 비로소 유상승계의 부당행위계산(3억원 또는 5%)으로 넘어간다.", "src": "2026-07-19 부동산세법 3 증여 간주", "conceptKey": "부동산세법 3 증여간주 판정"},
  {"type": "일반", "cat": "민법", "q": "민법상 사기에 의한 의사표시의 성립과 효과에 관한 설명으로 <b>옳지 않은</b> 것은? (다툼이 있으면 판례에 따름)", "opts": ["사기가 성립하려면 표의자에게 재산상 손해를 가하려는 사기자의 고의가 있어야 한다.", "변칙세일과 같이 기망행위가 있었다면 표의자에게 실제 재산상 손실이 발생하지 아니하였더라도 사기가 성립할 수 있다.", "사기에 의한 의사표시는 원칙적으로 취소할 수 있다.", "착오·사기·강박을 이유로 한 취소는 선의의 제3자에게 대항하지 못한다."], "answer": 0, "expl": "사기의 고의는 기망하여 의사표시를 하게 하려는 것으로 족하고 재산상 손해를 입히려는 고의까지는 필요 없다. 표의자의 의사결정의 자유를 보호하는 제도이기 때문이다. 변칙세일처럼 실손해가 없어도 기망이 인정되는 사례를 손해요건으로 막아 놓은 것이 함정이다.", "src": "2026-07-20 민법 1-1 사기의 성립요건", "conceptKey": "민법 1-1 사기 성립요건"},
  {"type": "일반", "cat": "민법", "q": "민법상 의사표시의 효력발생과 도달에 관한 설명으로 옳은 것은?", "opts": ["의사표시는 상대방이 그 내용을 현실적으로 안 때에 효력이 생긴다.", "청약이 도달한 후라도 상대방이 알기 전이면 청약자는 이를 철회할 수 있다.", "상대방이 제한능력자인 경우 그 법정대리인이 도달을 안 후에는 표의자가 도달을 주장할 수 있다.", "표의자가 의사표시를 발송한 후 사망하면 그 의사표시는 효력을 잃는다."], "answer": 2, "expl": "제한능력자에 대한 의사표시는 법정대리인이 도달을 안 후에 표의자가 그 도달을 주장할 수 있다. 스스로 뜻을 이해하기 어려운 자를 보호하려는 취지다. 도달주의를 요지주의로 바꾸거나(A) 도달 후 철회를 허용하는 것(B)이 대표적 함정이다.", "src": "2026-07-20 민법 1-2 도달과 청약", "conceptKey": "민법 1-2 의사표시 도달"},
  {"type": "일반", "cat": "민법", "q": "민법상 무효행위의 추인과 취소할 수 있는 법률행위의 추인에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["취소할 수 있는 법률행위를 취소하면 그 행위는 처음부터 무효인 것으로 본다.", "취소된 법률행위는 취소할 수 있는 법률행위의 추인으로 다시 유효하게 할 수 없다.", "취소로 무효가 된 법률행위에 대하여는 무효행위의 추인을 할 수 있다.", "원시적 불능으로 무효인 계약에서도 그 무효를 이유로 이행이익의 배상을 청구할 수 있다."], "answer": 3, "expl": "무효인 계약에서 이행이익의 배상은 인정되지 않는다. 처음부터 효력이 없는 계약에서 이행되었을 이익을 상정할 수 없기 때문이다. 취소로 소급무효가 되면 취소권 추인 트랙이 닫히고 무효행위의 추인 트랙으로 갈아탄다는 구조(A~C)와 묶어 정리해야 한다.", "src": "2026-07-20 민법 1-7 무효·취소와 추인", "conceptKey": "민법 1-7 무효행위 추인"},
  {"type": "조합", "cat": "민법", "q": "민법 제135조에 따라 무권대리인이 상대방에게 계약의 이행 또는 손해배상 책임을 지기 위한 요건을 모두 고른 것은?<br>ㄱ. 본인의 추인을 얻지 못하였을 것<br>ㄴ. 상대방이 선의이고 과실이 없을 것<br>ㄷ. 무권대리인이 제한능력자가 아닐 것<br>ㄹ. 무권대리인에게 대리권 흠결에 관한 과실이 있을 것", "opts": ["ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 0, "expl": "무권대리인의 책임은 무과실책임이므로 대리인의 과실(ㄹ)은 요건이 아니다. 대리권 외관을 만든 쪽이 위험을 지도록 한 법정책임이기 때문이다. 다만 상대방이 악의·유과실이거나 대리인이 제한능력자이면 면책되므로 ㄴ·ㄷ은 필요하다는 대비가 함정 포인트다.", "src": "2026-07-20 민법 1-5 무권대리인의 책임", "conceptKey": "민법 1-5 무권대리인 책임요건"},
  {"type": "사례", "cat": "민법", "q": "민법상 갑의 무권대리인 을이 병에게 갑 소유 X토지를 매도한 뒤 갑이 사망하여 을이 갑을 단독상속하였다. 이에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)", "opts": ["을은 본인의 지위를 승계하였으므로 자유롭게 추인을 거절할 수 있다.", "을이 본인의 지위에서 추인을 거절하는 것은 신의칙에 반하여 허용되지 않는다.", "상속으로 무권대리행위는 당연히 무효로 확정된다.", "상속으로 매매계약이 소급하여 유효로 되므로 병은 계약을 철회할 수 없다."], "answer": 1, "expl": "스스로 대리행위를 해 놓고 본인 지위를 물려받았다는 이유로 거절하는 것은 앞선 행위와 모순되어 신의칙상 허용되지 않는다. 상대방의 신뢰를 보호하기 위함이다. 상속으로 계약이 자동 유효가 되는 것(D)도, 당연무효로 확정되는 것(C)도 아니라는 점이 함정이다.", "src": "2026-07-20 민법 1-5 무권대리인의 본인 상속", "conceptKey": "민법 1-5 무권대리인 본인상속"},
  {"type": "사례", "cat": "민법", "q": "민법상 갑의 대리인 을이 대리권의 범위를 넘어 병과 계약을 체결하였고, 병에게는 을에게 권한이 있다고 믿을 만한 정당한 이유가 있었다. 이에 관한 설명으로 <b>옳지 않은</b> 것은? (다툼이 있으면 판례에 따름)", "opts": ["표현대리가 성립하더라도 그 행위의 본질은 여전히 무권대리이다.", "병은 표현대리를 주장할 수도 있고 을에게 무권대리인의 책임을 물을 수도 있다.", "병에게 과실이 있으면 과실상계의 법리에 따라 갑의 책임이 경감된다.", "병이 소송에서 유권대리를 주장하였다고 하여 표현대리의 주장이 포함된 것으로 볼 수는 없다."], "answer": 2, "expl": "표현대리에는 과실상계의 법리가 적용되지 않아 본인의 책임이 비율로 깎이지 않는다. 표현대리는 성립하면 전부 책임을 지는 구조이기 때문이다. 성립 여부 단계에서 이미 상대방의 선의·무과실을 따졌으므로 다시 과실을 참작하지 않는다는 점이 함정이다.", "src": "2026-07-20 민법 1-6 표현대리", "conceptKey": "민법 1-6 표현대리 과실상계"},
  {"type": "OX", "cat": "민법", "q": "민법상 복대리인은 대리인이 자기의 이름으로 선임하지만, 대리행위는 본인의 이름으로 하며 그 효과는 본인에게 귀속된다. (O/X)", "opts": ["O", "X"], "answer": 0, "expl": "O. 복대리인은 대리인이 선임하되 본인의 대리인이지 대리인의 대리인이 아니다. 선임 주체와 대리의 상대방이 서로 다른 층위이기 때문이다. 본인이 직접 선임한다거나 대리인을 대리한다고 바꿔 놓는 지문이 전형적인 함정이다.", "src": "2026-07-20 민법 1-4 복대리", "conceptKey": "민법 1-4 복대리인의 지위"},
  {"type": "일반", "cat": "부동산공법", "q": "🔁 개발행위허가를 제한하려는 자가 거쳐야 하는 절차와 그 제한기간에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["개발행위허가의 제한은 중앙도시계획위원회 또는 지방도시계획위원회의 심의를 거쳐야 한다.", "제한기간은 한 차례만 3년 이내로 하는 것이 원칙이다.", "제한하거나 그 제한을 해제하려면 그 사실을 고시하여야 한다.", "지구단위계획구역으로 지정된 지역은 제한기간을 연장할 수 없다."], "answer": 3, "expl": "지구단위계획구역이나 기반시설부담구역으로 지정된 지역은 2년 이내의 기간으로 한 차례 더 연장할 수 있다. 계획 수립이 진행 중인 곳에서 난개발을 막을 시간이 더 필요하기 때문이다. 연장이 열리는 예외를 통째로 닫아 원칙만 남긴 것이 함정이다.", "src": "2026-07-21 부동산공법 개발행위허가 제한 (재도전)", "conceptKey": "부동산공법 개발행위허가 제한", "retryOf": "부동산공법 개발행위허가 제한"},
  {"type": "일반", "cat": "부동산공법", "q": "🔁 주민이 복합용도구역의 지정을 위하여 공간재구조화계획의 입안을 제안하는 경우에 관한 설명으로 옳은 것은?", "opts": ["주민은 도시혁신구역의 지정에 대해서만 입안을 제안할 수 있다.", "주민은 복합용도구역의 지정을 위하여 공간재구조화계획 입안권자에게 그 입안을 제안할 수 있다.", "도시혁신구역과 도시혁신계획은 다른 법률에 따라서도 결정될 수 있다.", "복합용도구역의 지정은 도시·군기본계획으로 결정한다."], "answer": 1, "expl": "복합용도구역 지정을 위한 공간재구조화계획의 입안 제안권이 주민에게 열려 있다. 토지를 실제로 쓰는 쪽의 수요를 계획에 끌어들이려는 취지다. 도시혁신구역과 도시혁신계획은 다른 법률로 결정할 수 없다는 점(C)을 뒤집어 놓은 것이 함정이다.", "src": "2026-07-21 부동산공법 1-5 복합용도구역 (재도전)", "conceptKey": "부동산공법 공간재구조화계획", "retryOf": "부동산공법 공간재구조화계획"},
  {"type": "일반", "cat": "부동산공법", "q": "국토의 계획 및 이용에 관한 법률상 용도지구의 세분·제안 및 건축제한에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["시·도 또는 대도시의 조례로 세분할 수 있는 용도지구에는 개발진흥지구가 포함된다.", "개발진흥지구 중 주민이 도시·군관리계획의 입안을 제안할 수 있는 것은 산업·유통개발진흥지구이다.", "고도지구에서 건축물 높이의 최고한도는 도시·군관리계획으로 정한다.", "집단취락지구에서의 건축제한은 개발제한구역의 지정 및 관리에 관한 특별조치법에 따른다."], "answer": 0, "expl": "조례로 다시 세분할 수 있는 용도지구는 경관지구·중요시설물보호지구·특정용도제한지구(경중특)로 한정된다. 지역 사정에 맞춘 미세조정이 필요한 지구만 열어 둔 것이다. 주민 제안이 가능한 개발진흥지구를 세분 대상에 끼워 넣어 두 논점을 섞은 것이 함정이다.", "src": "2026-07-21 부동산공법 1-4 용도지구", "conceptKey": "부동산공법 1-4 용도지구 세분·제안"},
  {"type": "일반", "cat": "부동산공법", "q": "국토의 계획 및 이용에 관한 법률령상 제1종 일반주거지역과 제2종 일반주거지역의 건축제한에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["제1종 일반주거지역에는 아파트를 건축할 수 없다.", "제2·3종 일반주거지역에서는 제1종에서 허용되는 건축물에 더하여 아파트와 종교시설을 건축할 수 있다.", "제1종 일반주거지역에서는 조례로 정하면 공연장 및 관람장을 건축할 수 있다.", "격리병원은 제1종·제2종 일반주거지역 모두에서 건축할 수 없다."], "answer": 2, "expl": "제1종 일반주거지역은 조례로 허용하더라도 문화 및 집회시설 중 공연장·관람장은 제외된다. 저층 주거환경의 정온을 지키기 위함이다. 공연장이 열리는 것은 제2종부터이므로, 1종과 2종의 분기점(아파트·종교시설·공연장·골프연습장)을 한 칸 앞당겨 놓은 것이 함정이다.", "src": "2026-07-21 부동산공법 1-1 주거지역 건축제한", "conceptKey": "부동산공법 1-1 일반주거지역 건축제한"},
  {"type": "조합", "cat": "부동산공법", "q": "국토의 계획 및 이용에 관한 법률상 시가화조정구역에서 허가를 받아 할 수 있는 행위를 모두 고른 것은?<br>ㄱ. 사회복지시설의 설치<br>ㄴ. 경찰파출소의 설치<br>ㄷ. 야외음악당 및 야외극장의 설치<br>ㄹ. 입목의 벌채·조림·육림", "opts": ["ㄱ, ㄴ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 3, "expl": "제시된 네 가지는 모두 허가를 받아 할 수 있는 행위에 해당한다. 시가화를 늦추는 구역이지만 주민 생활에 필수적이거나 임업 관리에 필요한 행위까지 막지는 않기 때문이다. 반면 주택의 신축은 허가로도 열리지 않고 기존 주택의 증축만 가능하다는 점이 함정이다.", "src": "2026-07-21 부동산공법 1-5 시가화조정구역", "conceptKey": "부동산공법 1-5 시가화조정구역 허가행위"},
  {"type": "계산", "cat": "부동산공법", "q": "국토의 계획 및 이용에 관한 법률령상 공동구가 설치되는 지역에서 공동구 점용예정자 갑이 부담할 설치비용 부담액이 9억원으로 확정되었다. 갑이 공동구 설치공사가 착수되기 전까지 납부하여야 하는 최소 금액은? (다른 조건은 동일)", "opts": ["3억원", "4억 5천만원", "6억원", "9억원"], "answer": 0, "expl": "착수 전 납부 최소액은 부담액의 3분의 1 이상이므로 9억원 ÷ 3 = 3억원이다. 공사 착수 시점에 재원의 일부를 미리 확보해 두려는 장치다. 나머지 부담액은 준공 시점에 맞춰 내면 되고, 관리비용을 연 2회로 분할 납부하는 규정과 혼동하면 틀린다.", "src": "2026-07-21 부동산공법 1-6 공동구 비용", "conceptKey": "부동산공법 1-6 공동구 비용 부담", "calc": {"expr": "900000000/3", "expected": 300000000}},
  {"type": "OX", "cat": "부동산공법", "q": "국토의 계획 및 이용에 관한 법률상 도시지역 중 주거지역·상업지역·공업지역 안의 농지를 취득하는 경우에도 농지취득자격증명에 관한 규정이 적용된다. (O/X)", "opts": ["O", "X"], "answer": 1, "expl": "X. 도시지역 중 주거·상업·공업지역 안의 농지는 이미 개발이 예정된 것으로 보아 농지취득자격증명 규정을 적용하지 않는다. 농지로 계속 쓸 것을 전제로 한 심사가 무의미하기 때문이다. 같은 도시지역이라도 녹지지역은 다르게 취급될 수 있다는 점을 함께 잡아 두어야 한다.", "src": "2026-07-21 부동산공법 1-3 농지취득자격증명", "conceptKey": "부동산공법 1-3 농취증 적용제외"},

/*__BUILD_PAYLOAD_START__*/
// ── 순수 함수 레이어: DOM 없이 채점 결과(payload v2)를 만든다. node로 단위테스트 가능.
function conceptFromSrc(src){
  return String(src||"").replace(/^\s*\d{4}-\d{2}-\d{2}\s*/,"").replace(/\s*\(재도전\)\s*$/,"").trim();
}
function buildPayload(questions, sel, quizDate, nowIso, schemaVersion){
  let score = 0; const results = [], wrong = [];
  questions.forEach((item, qi)=>{
    const isCorrect = sel[qi] === item.answer;
    if(isCorrect) score++;
    const ck = item.conceptKey || conceptFromSrc(item.src);
    const isRetry = !!item.retryOf || /\(재도전\)/.test(item.src||"") || String(item.q||"").indexOf("🔁") >= 0;
    const base = {
      id: quizDate + "-q" + (qi+1), cat: item.cat, type: item.type, q: item.q,
      options: item.opts, myAnswer: item.opts[sel[qi]], correct: item.opts[item.answer],
      expl: item.expl, src: item.src
    };
    const r = Object.assign({}, base, {
      conceptKey: ck,
      retryOf: isRetry ? (item.retryOf || ck) : null,
      correctAnswered: isCorrect
    });
    if(item.calc) r.calc = item.calc;
    results.push(r);
    if(!isCorrect) wrong.push(base);   // v1 하위호환 필드 (기존 수거 파이프라인용)
  });
  return { score: score, wrong: wrong, payload: {
    schemaVersion: schemaVersion, subject: "공인중개사", date: quizDate, quizId: quizDate,
    score: score, total: questions.length, wrongCount: wrong.length,
    results: results, wrong: wrong, generatedAt: nowIso
  }};
}
/*__BUILD_PAYLOAD_END__*/

const form = document.getElementById('quiz');
const selected = new Array(QUESTIONS.length).fill(null);
let graded = false;
let LAST_PAYLOAD = null;
let lastCat = null;

document.getElementById('total').textContent = ' / ' + QUESTIONS.length;

QUESTIONS.forEach((item, qi)=>{
  if(item.cat !== lastCat){
    const s = document.createElement('div');
    s.className = 'sec';
    s.textContent = '▍' + item.cat;
    form.appendChild(s);
    lastCat = item.cat;
  }
  const card = document.createElement('div');
  card.className = 'q';
  const isOX = item.type === 'OX';
  card.innerHTML = `
    <div class="qhead">
      <span class="qno">${qi+1}</span>
      <span class="qtype">${item.type}</span>
      <span class="qcat">${item.cat}</span>
    </div>
    <div class="qtext">${item.q}</div>
    <div class="opts ${isOX?'ox':''}" data-q="${qi}"></div>
    <div class="expl" id="expl-${qi}"></div>`;
  const optsEl = card.querySelector('.opts');
  item.opts.forEach((o, oi)=>{
    const el = document.createElement('div');
    el.className = 'opt';
    el.dataset.q = qi; el.dataset.o = oi;
    el.innerHTML = isOX
      ? `<span>${o}</span>`
      : `<span class="mk">${String.fromCharCode(65+oi)}</span><span>${o}</span>`;
    el.addEventListener('click', ()=>{
      if(graded) return;
      selected[qi] = oi;
      optsEl.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');
      updateProgress();
    });
    // 눈동자(👁) 소거 버튼 — 확실히 아닌 보기를 희미하게(다시 누르면 복구). 채점·선택·저장에 영향 없음.
    if(!isOX){
      const eye = document.createElement('button');
      eye.type = 'button';
      eye.className = 'eye';
      eye.textContent = '👁';
      eye.title = '확실히 아닌 보기 희미하게 (다시 누르면 복구)';
      eye.setAttribute('aria-label', '이 보기를 후보에서 제외');
      eye.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        if(graded) return;
        el.classList.toggle('ruled');
      });
      el.appendChild(eye);
    }
    optsEl.appendChild(el);
  });
  form.appendChild(card);
});

function updateProgress(){
  const done = selected.filter(s=>s!==null).length;
  document.getElementById('pcount').textContent = `${done} / ${QUESTIONS.length} 선택`;
  document.getElementById('pbar').style.width = (done/QUESTIONS.length*100)+'%';
  document.getElementById('submitBtn').disabled = done !== QUESTIONS.length;
}

const btn = document.getElementById('submitBtn');
btn.addEventListener('click', ()=>{ if(!graded){ grade(); } else { location.reload(); } });

document.getElementById('copyBtn').addEventListener('click', ()=>{
  if(!LAST_PAYLOAD) return;
  const txt = JSON.stringify(LAST_PAYLOAD, null, 2);
  const done = ()=>{ document.getElementById('dlnote').textContent = "📋 복사 완료 — velog-posts/공인중개사/claude_ox_오답/_inbox/에 붙여넣어 저장해도 된다"; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt, done));
  } else { fallbackCopy(txt, done); }
});
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  ta.remove();
}

function grade(){
  graded = true;
  const built = buildPayload(QUESTIONS, selected, QUIZ_DATE, new Date().toISOString(), SCHEMA_VERSION);
  LAST_PAYLOAD = built.payload;
  QUESTIONS.forEach((item, qi)=>{
    const opts = document.querySelectorAll(`.opt[data-q="${qi}"]`);
    opts.forEach((el, oi)=>{
      el.style.cursor='default';
      el.classList.remove('ruled');           // 채점 시 소거 표시 해제(정답이 희미하게 남지 않도록)
      const eye = el.querySelector('.eye');    // 눈동자 버튼 제거 — 채점 후엔 불필요
      if(eye) eye.remove();
      if(oi === item.answer) el.classList.add('correct');
      if(oi === selected[qi] && oi !== item.answer) el.classList.add('wrong');
    });
    const correct = selected[qi] === item.answer;
    const ex = document.getElementById('expl-'+qi);
    ex.innerHTML = `<span class="verdict" style="color:${correct?'var(--ok)':'var(--no)'}">${correct?'정답!':'오답'}</span>${item.expl}<span class="src">📄 출처: ${item.src}</span>`;
    ex.classList.add('show');
  });
  const r = document.getElementById('result');
  document.getElementById('score').textContent = built.score;
  document.getElementById('rmsg').textContent = msgFor(built.score);
  r.classList.add('show');
  btn.textContent = '🔄 다시 풀기';
  btn.classList.add('retry');
  document.getElementById('copyBtn').classList.add('show');

  // 결과 자동 다운로드 (월요일 수거·원장 갱신이 읽는 파일)
  downloadResult(built.payload);

  r.scrollIntoView({behavior:'smooth', block:'center'});
}

function downloadResult(payload){
  try{
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `공인중개사_오답_${QUIZ_DATE}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    document.getElementById('dlnote').textContent =
      payload.wrongCount>0 ? `💾 결과 저장됨(오답 ${payload.wrongCount}개) — 다운로드 폴더 확인` : "💾 만점 기록 저장됨";
  }catch(e){
    document.getElementById('dlnote').textContent = "⚠️ 자동 저장 실패 — 아래 '결과 JSON 복사'를 눌러 수동 저장";
  }
}

function msgFor(s){
  const t = QUESTIONS.length;
  const r = s/t;
  if(s===t)   return "만점. 오늘 등록증 발급해도 되겠는데요? 🏆";
  if(r>=0.8)  return "합격권. 틀린 거 해설만 한 번 더 보면 완벽합니다.";
  if(r>=0.6)  return "절반은 넘었어요. 오답 노트행 직행하는 개념들이 보이네요.";
  if(r>=0.4)  return "아직 흔들리는 개념이 있어요. 해설 정독하고 내일 재도전!";
  return "괜찮아요, 회독이 쌓이면 올라갑니다. 해설부터 차근차근.";
}
