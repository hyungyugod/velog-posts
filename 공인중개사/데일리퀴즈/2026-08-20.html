  { type: "계산", cat: "부동산학개론", q: "🔁 재조달원가가 4억원이고 경제적 내용연수가 40년, 경과연수가 6년인 건물이 있다. 정액법으로 감가수정할 때 이 건물의 적산가액은? (잔존가치는 없으며 다른 조건은 동일)", opts: ["6,000만원", "3억원", "3억 4,000만원", "3억 6,000만원"], answer: 2, calc: { expr: "400000000 - (400000000/40*6)", expected: 340000000 }, expl: "감가수정액은 재조달원가 4억을 내용연수 40년으로 나눈 1,000만원에 경과연수 6년을 곱한 6,000만원이다. 적산가액은 4억에서 이를 뺀 3억 4,000만원이 된다. 정액법은 매년 같은 금액을 깎는 방식이라 잔존가치가 0이면 계산이 단순해진다. 감가수정액 자체를 답으로 고르게 하는 것이 함정이다.", src: "2026-08-21 부동산학개론 금융론~감정평가론 (재도전)", conceptKey: "모의고사 1차 1-6", retryOf: "모의고사 1차 1-6" },
  { type: "계산", cat: "부동산학개론", q: "대출원금 3억원, 만기 30년, 연 이자율 5퍼센트, 원금균등상환방식(연 1회 상환)으로 대출을 받았다. 2회차에 상환하여야 하는 원리금은? (거치기간은 없으며 다른 조건은 동일)", opts: ["2,450만원", "2,500만원", "2,400만원", "2,950만원"], answer: 0, calc: { expr: "10000000 + (300000000-10000000)*0.05", expected: 24500000 }, expl: "원금균등상환은 원금을 30분의 1인 1,000만원씩 균등하게 갚는다. 2회차 이자는 1회차 상환 후 잔액 2억 9,000만원에 5퍼센트를 곱한 1,450만원이므로 원리금은 2,450만원이다. 원금이 일정하고 이자만 줄어드는 구조라 회차가 갈수록 원리금 총액이 감소한다. 1회차 원리금 2,500만원을 그대로 고르지 않도록 주의한다.", src: "2026-08-21 부동산학개론 금융론~감정평가론", conceptKey: "부동산학개론 금융론-원금균등상환 원리금" },

  { type: "일반", cat: "부동산학개론", q: "부동산의 공시방법인 등기와 등록에 관한 설명으로 <b>옳지 않은</b> 것은?", opts: ["부동산에 관한 권리관계의 공시는 부동산등기법이라는 단일 법률이 규율한다", "등록은 자동차관리법 등 개별 법률에 흩어져 규정되어 있다", "등록에 관하여도 등기와 마찬가지로 통일된 단일 법률이 마련되어 있다", "저당권과 같은 제한물권도 등기부에 기록하여 공시한다"], answer: 2, expl: "등기는 부동산등기법 하나로 통일되어 있으나 등록은 자동차관리법·상표법 등 대상별 개별법에 흩어져 있어 단일 등록법이 없다. 등기는 부동산이라는 단일 대상을 다루는 반면 등록은 대상이 제각각이라 규율 법률도 갈라진 것이다. 두 제도를 나란히 놓고 통일성을 뒤바꾸는 지문이 자주 나온다.", src: "2026-08-16 부동산학개론 총론~경제론", conceptKey: "부동산학개론 총론-등기와 등록 공시방법" },
  { type: "조합", cat: "부동산학개론", q: "부동산 가격공시와 지가변동률 조사에 관한 설명으로 옳은 것을 모두 고른 것은?<br>ㄱ. 표준지공시지가는 국토교통부장관이 매년 공시한다<br>ㄴ. 표본지는 지가변동률의 조사·산정을 위하여 선정하는 조사 대상지이다<br>ㄷ. 표준지를 선정하여 얻는 결과물은 지가변동률이다<br>ㄹ. 소지는 개발되기 이전의 자연 상태 그대로의 토지를 말한다", opts: ["ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], answer: 0, expl: "표준지는 결과물이 가격이고 표본지는 결과물이 지가변동률이므로 ㄷ은 둘을 맞바꾼 지문이다. 유사한 토지 중에서 대표를 뽑는다는 점은 같지만 무엇을 산출하려는가가 다르기 때문에 이름이 갈린다. 표준지와 표본지는 선정 주체보다 결과물로 구분하는 것이 안전하다.", src: "2026-08-16 부동산학개론 총론~경제론", conceptKey: "부동산학개론 총론-표준지와 표본지" },
  { type: "OX", cat: "부동산학개론", q: "원금균등상환방식에서는 매기 상환하는 원리금의 합계액이 시간이 지날수록 점차 줄어든다.", opts: ["O", "X"], answer: 0, expl: "O. 원금균등상환은 원금을 균등하게 나누어 갚고 이자는 남은 잔액에 이자율을 곱해 계산한다. 잔액이 계속 줄어드니 이자도 줄고, 원금 부분은 고정이므로 원리금 합계는 회차가 갈수록 감소한다. 원리금균등상환의 합계액이 일정한 것과 반대 방향임을 기억한다.", src: "2026-08-21 부동산학개론 금융론~감정평가론", conceptKey: "부동산학개론 금융론-원금균등상환 원리금 추이" },
  { type: "사례", cat: "민법", q: "🔁 갑은 을에게 자기 소유 X토지의 매도에 관한 대리권을 수여하였다. 그 후의 사정과 대리권의 소멸에 관한 설명으로 옳은 것은?", opts: ["갑이 성년후견개시심판을 받으면 그 사유만으로 을의 대리권이 소멸한다", "을이 파산선고를 받더라도 을의 대리권은 소멸하지 아니한다", "갑이 파산선고를 받아도 위임은 존속하므로 을의 대리권은 그대로 유지된다", "갑이 파산선고를 받으면 위임이 종료되어 을의 임의대리권도 소멸한다"], answer: 3, expl: "민법 제127조는 본인 쪽 사유로 사망만 들지만, 위임은 당사자 일방의 파산으로 종료되고 제128조에 따라 원인된 법률관계가 끝나면 임의대리권도 함께 소멸한다. 본인의 파산은 조문 하나가 아니라 위임 종료를 거치는 2단 경로로 작동한다. 제127조에 없으니 소멸하지 않는다고 외우면 이 경로를 놓친다.", src: "2026-08-17 민법 저당권~동시이행항변권 (재도전)", conceptKey: "민법 1-4 대리권 소멸", retryOf: "민법 1-4 대리권 소멸" },
  { type: "사례", cat: "민법", q: "갑은 을에게 X건물을 매도하였고 잔금지급과 소유권이전등기는 서로 동시이행관계에 있다. 을이 이행기가 지나도록 잔금을 지급하지 아니한 경우에 관한 설명으로 옳은 것은?", opts: ["을은 동시이행항변권을 행사하지 아니하였으므로 이행지체책임을 진다", "을은 동시이행항변권을 행사하지 아니하여도 이행지체책임을 지지 아니한다", "법원은 을이 항변하지 아니하여도 직권으로 동시이행항변권을 고려하여야 한다", "을이 동시이행항변권을 행사하면 법원은 갑의 청구를 기각하여야 한다"], answer: 1, expl: "동시이행항변권은 존재하는 것만으로 이행거절의 정당성을 주어 지체책임을 면하게 하지만, 재판에 반영되려면 당사자가 원용하여야 한다. 존재의 효과와 행사의 효과가 나뉘어 있기 때문이다. 항변이 있으면 법원은 청구를 기각하는 것이 아니라 상환이행판결을 내려야 한다.", src: "2026-08-17 민법 동시이행항변권", conceptKey: "민법 1-7 동시이행항변권 원용" },
  { type: "일반", cat: "민법", q: "저당권의 효력이 미치는 목적물의 범위에 관한 설명으로 <b>옳지 않은</b> 것은?", opts: ["저당권의 효력은 설정 전후를 불문하고 저당물의 부합물과 종물에 미친다", "토지에 매설된 유류저장탱크는 토지의 일부로 보므로 그 토지에 설정된 저당권의 효력이 미친다", "저당부동산에 대한 압류가 있기 전에 생긴 차임채권에도 저당권의 효력이 미친다", "저당권의 효력은 저당물에 딸린 종된 권리에도 미친다"], answer: 2, expl: "과실에 대하여는 저당부동산이 압류된 후에야 저당권의 효력이 미친다. 압류 전까지는 소유자의 사용수익권을 존중하고, 압류 시점부터 담보가치 실현을 위해 수익의 우선순위를 저당권자에게 넘겨주는 구조다. 부합물·종물은 시기를 묻지 않는 반면 과실만 압류라는 시점 요건이 붙는다는 대비가 함정이다.", src: "2026-08-17 민법 저당권의 효력이 미치는 범위", conceptKey: "민법 1-3 저당권 효력범위와 과실" },
  { type: "일반", cat: "민법", q: "저당권의 객체와 당사자에 관한 설명으로 옳은 것은?", opts: ["지역권과 토지의 일부에는 저당권을 설정할 수 없다", "저당권설정자는 반드시 채무자이어야 하므로 제3자는 설정자가 될 수 없다", "토지의 일부에도 분필을 거치지 아니하고 저당권을 설정할 수 있다", "지상권과 전세권에는 저당권을 설정할 수 없다"], answer: 0, expl: "저당권의 객체는 부동산 외에 지상권과 전세권이며, 지역권은 요역지에 부종하여 단독으로 담보에 제공할 수 없고 토지의 일부도 분필 전에는 객체가 되지 못한다. 저당권설정자는 채무를 지지 않는 물상보증인도 될 수 있어 채무자에 한정되지 않는다. 객체 제한과 당사자 제한을 뒤섞는 것이 함정이다.", src: "2026-08-17 민법 저당권의 객체와 당사자", conceptKey: "민법 1-1 저당권 객체와 설정자" },
  { type: "일반", cat: "민법", q: "저당부동산의 제3취득자의 지위에 관한 설명으로 <b>옳지 않은</b> 것은?", opts: ["제3취득자는 저당물의 소유권이나 용익권을 취득한 자를 말한다", "제3취득자가 지출한 필요비와 유익비는 저당물의 경매대가에서 우선하여 상환받을 수 있다", "제3취득자는 그 비용상환청구권을 피담보채권으로 하여 유치권을 행사할 수 없다", "후순위 근저당권자도 제3취득자이므로 채권최고액까지만 대위변제하면 된다"], answer: 3, expl: "후순위 근저당권자는 소유권이나 용익권을 취득한 자가 아니므로 제3취득자가 아니고, 선순위 저당권을 소멸시키려면 채권 전액을 변제하여야 한다. 제3취득자 보호는 목적물에 대한 이용·소유 이익을 지키기 위한 장치이기 때문이다. 제3취득자의 범위를 넓혀 후순위 담보권자를 끼워 넣는 지문에 주의한다.", src: "2026-08-17 민법 저당권 말소와 제3취득자", conceptKey: "민법 1-2 제3취득자 범위" },
  { type: "조합", cat: "민법", q: "저당권의 피담보채권의 범위에 포함되지 <b>않는</b> 것을 모두 고른 것은?<br>ㄱ. 저당목적물의 하자로 인하여 저당권자가 입은 손해의 배상금<br>ㄴ. 저당물의 보존을 위하여 지출한 비용<br>ㄷ. 저당권의 실행비용<br>ㄹ. 원본채권", opts: ["ㄱ, ㄷ", "ㄱ, ㄴ", "ㄴ, ㄹ", "ㄷ, ㄹ"], answer: 1, expl: "저당권은 목적물을 점유하지 않는 담보물권이므로 목적물의 하자로 인한 손해배상금과 보존비용은 피담보채권의 범위에 들어오지 않는다. 점유하지 않는 이상 목적물의 상태를 관리할 지위도 없기 때문이다. 반면 실행비용과 원본은 민법 제360조가 정한 범위에 포함된다.", src: "2026-08-17 민법 저당권의 피담보채권 범위", conceptKey: "민법 1-3 피담보채권 범위" },
  { type: "OX", cat: "민법", q: "제3자를 위한 계약에서 수익자는 통정허위표시의 무효로 대항할 수 없는 제3자에 해당하지 아니한다.", opts: ["O", "X"], answer: 0, expl: "O. 수익자는 기본관계인 보상관계에서 직접 권리를 얻을 뿐 새로운 이해관계를 맺은 자가 아니다. 그래서 기본관계가 통정허위표시로 무효이거나 사기로 취소되면 수익자의 권리도 함께 무너진다. 보상관계의 하자는 수익자에게 그대로 튀지만 대가관계의 하자는 튀지 않는다는 대비로 기억한다.", src: "2026-08-17 민법 제3자를 위한 계약", conceptKey: "민법 1-8 수익자의 지위" },
  { type: "일반", cat: "공인중개사법", q: "🔁 공인중개사법령상 연수교육의 미이수에 대한 제재와 실무교육의 효력에 관한 설명으로 옳은 것은?", opts: ["연수교육을 이수하지 아니하면 업무정지처분을 받는다", "연수교육을 이수하지 아니하면 중개사무소 개설등록이 취소된다", "연수교육을 이수하지 아니하면 과태료가 부과된다", "실무교육을 받고 개업하지 아니한 채 1년이 지나면 그 교육의 효력이 소멸한다"], answer: 2, expl: "연수교육 미이수는 업무정지나 등록취소가 아니라 과태료 사유다. 연수교육은 자격이나 등록의 존속요건이 아니라 사후적인 보수교육 의무여서 제재의 강도가 낮게 설계되어 있다. 실무교육은 이수 후 개업하지 않아도 기간 제한 없이 효력이 유지된다는 점도 함께 묶여 나온다.", src: "2026-08-13 공인중개사법 자격취소~부동산거래신고 (재도전)", conceptKey: "모의고사 2차 1-4", retryOf: "모의고사 2차 1-4" },
  { type: "일반", cat: "공인중개사법", q: "주택 임대차 계약의 신고 대상과 변경신고에 관한 설명으로 <b>옳지 않은</b> 것은?", opts: ["보증금이 6천만원을 초과하거나 월차임이 30만원을 초과하는 임대차계약이 신고대상이다", "보증금과 차임의 증감 없이 임대차 기간만 변경한 경우에는 변경신고 의무가 없다", "임대차계약의 신고를 하면 확정일자를 받은 것으로 본다", "보증금이 정확히 6천만원인 임대차계약도 신고대상에 해당한다"], answer: 3, expl: "기준은 초과이므로 보증금이 정확히 6천만원이거나 월차임이 정확히 30만원이면 신고대상이 아니다. 이 제도는 실거래가격 정보를 축적하려는 것이어서 일정 규모 이상만 걸러 내도록 문턱을 둔 것이다. 이상과 초과를 바꿔 놓는 것이 가장 흔한 함정이다.", src: "2026-08-19 공인중개사법 주택 임대차 계약 신고", conceptKey: "공인중개사법 1-2 주택임대차 신고 기준" },
  { type: "일반", cat: "공인중개사법", q: "부동산 거래신고 등에 관한 법령상 외국인등의 부동산 취득 특례에 관한 설명으로 <b>옳지 않은</b> 것은?", opts: ["군사시설 보호구역에서 허가를 받지 아니하고 체결한 토지취득계약도 그 효력은 유효하다", "외국인등이 군사시설 보호구역에서 토지취득계약을 체결하려면 계약체결 전에 신고관청의 허가를 받아야 한다", "외국인등이 토지취득의 허가를 받은 경우에는 토지거래허가에 관한 규정이 적용되지 아니한다", "특별자치시장은 스스로 신고관청이므로 분기 종료일부터 1개월 이내에 국토교통부장관에게 직접 제출한다"], answer: 0, expl: "허가를 받지 아니하고 체결한 토지취득계약은 그 효력이 발생하지 아니한다. 군사·문화·생태 등 보호가치가 큰 구역은 사후 제재가 아니라 계약 자체를 무력화하여 취득을 원천적으로 막는 방식을 택한 것이다. 신고구역의 사후신고와 허가구역의 사전허가를 뒤섞는 지문에 주의한다.", src: "2026-08-19 공인중개사법 외국인등의 부동산 취득 특례", conceptKey: "공인중개사법 1-4 외국인 사전허가" },
  { type: "일반", cat: "공인중개사법", q: "부동산 거래신고 등에 관한 법령상 토지거래계약 허가를 받은 자의 토지 이용의무와 이행강제금에 관한 설명으로 옳은 것은?", opts: ["허가관청은 2년마다 1회 이상 토지의 이용실태를 조사하여야 한다", "이행명령은 3개월 이내의 기간을 정하여 문서로 하여야 한다", "이행강제금은 최초의 이행명령이 있었던 날을 기준으로 6개월마다 부과할 수 있다", "이행강제금 부과처분에 대한 이의는 고지받은 날부터 3개월 이내에 제기하여야 한다"], answer: 1, expl: "이용실태 조사는 매년 1회 이상, 이행명령은 3개월 이내의 기간을 정하여 문서로 하고, 이행강제금은 최초 이행명령일을 기준으로 1년에 한 번씩 부과한다. 시정 기회는 짧게 주되 제재는 연 단위로 반복하는 구조다. 이의신청과 매수청구처럼 청(請)이 들어가는 절차의 기한이 1개월인 것과 구분한다.", src: "2026-08-19 공인중개사법 토지 이용에 대한 의무", conceptKey: "공인중개사법 1-6 이행명령과 이행강제금" },
  { type: "조합", cat: "공인중개사법", q: "부동산 거래신고 등에 관한 법령상 과태료의 부과에 관한 설명으로 옳은 것을 모두 고른 것은?<br>ㄱ. 부동산 거래신고를 하지 아니한 자는 500만원 이하의 과태료 부과대상이다<br>ㄴ. 거래당사자로서 공동신고를 거부한 자도 신고를 하지 아니한 자에 포함된다<br>ㄷ. 계약을 체결하지 아니하였음에도 거짓으로 거래신고를 한 자는 3천만원 이하의 과태료 부과대상이다<br>ㄹ. 계약을 체결하지 아니하고 거짓신고를 한 자도 자진신고에 따른 감경을 받을 수 있다", opts: ["ㄱ, ㄴ", "ㄱ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ", "ㄴ, ㄷ, ㄹ"], answer: 2, expl: "이른바 불불자, 즉 계약을 체결하지 아니하였음에도 거짓신고를 한 자는 3천만원 이하 과태료 대상이면서 자진신고 감경에서는 제외된다. 실제 거래가 없는 허위신고는 시세를 직접 왜곡하는 행위여서 감경 유인을 주지 않는 것이다. 안 한 자와 거짓으로 한 자를 구분하는 것이 이 단원의 뼈대다.", src: "2026-08-19 공인중개사법 과태료 체계", conceptKey: "공인중개사법 1-3 과태료 구분과 감경" },
  { type: "사례", cat: "공인중개사법", q: "갑은 을 소유의 X주택을 보증금 1억원, 월차임 50만원으로 임차하는 계약을 체결한 뒤 곧바로 관할 주민센터에 전입신고를 마쳤다. 이에 관한 설명으로 옳은 것은?", opts: ["전입신고와 별도로 30일 이내에 주택 임대차 계약의 신고를 하여야 한다", "임대차계약서를 제출하더라도 별도의 주택 임대차 신고서를 반드시 제출하여야 한다", "임대차계약의 신고를 하여도 확정일자는 별도로 받아야 한다", "전입신고를 하였으므로 주택 임대차 계약의 신고를 한 것으로 본다"], answer: 3, expl: "전입신고를 하면 주택 임대차 계약의 신고를 한 것으로 보고, 임대차계약을 신고하면 확정일자를 받은 것으로 본다. 같은 정보를 여러 창구에 중복 제출하지 않도록 제도 사이에 갈음 관계를 걸어 둔 것이다. 임대차계약서만 제출하여도 신고서를 제출한 것으로 본다는 점도 함께 정리한다.", src: "2026-08-19 공인중개사법 주택 임대차 계약 신고", conceptKey: "공인중개사법 1-2 임대차 신고 갈음관계" },
  { type: "OX", cat: "공인중개사법", q: "토지거래허가구역의 지정에 이의가 있는 자는 지정 공고일부터 30일 이내에 국토교통부장관에게 이의를 신청할 수 있다.", opts: ["O", "X"], answer: 1, expl: "X. 허가구역의 지정 자체에 대하여는 이의신청 제도를 두고 있지 않다. 지정 단계에서 이의를 허용하면 규제를 피하려는 신청이 몰려 투기 억제라는 목적이 무너지기 때문이다. 이의신청과 매수청구의 기한이 1개월인 것은 허가 신청에 대한 처분 단계의 이야기이므로 구분한다.", src: "2026-08-19 공인중개사법 토지거래허가구역", conceptKey: "공인중개사법 1-5 허가구역 지정 이의" },
  { type: "사례", cat: "부동산공법", q: "🔁 갑을 비롯한 토지소유자들이 도시개발구역에 도시개발조합을 설립하려 한다. 구역 안 토지면적의 60퍼센트에 해당하는 토지의 소유자와 토지소유자 총수의 70퍼센트가 동의하였다. 이에 관한 설명으로 옳은 것은? (국공유지는 없고 다른 조건은 동일)", opts: ["토지면적 요건을 충족하지 못하였으므로 조합설립인가를 신청할 수 없다", "토지소유자 총수 요건을 충족하지 못하였으므로 조합설립인가를 신청할 수 없다", "두 요건을 모두 충족하였으므로 조합설립인가를 신청할 수 있다", "두 요건 중 하나만 충족하면 되므로 조합설립인가를 신청할 수 있다"], answer: 0, expl: "도시개발조합 설립인가는 토지면적 3분의 2 이상과 토지소유자 총수 2분의 1 이상의 동의를 함께 갖추어야 한다. 사례는 사람 요건은 넘겼으나 면적 요건인 약 66.7퍼센트에 미달한다. 도시개발법은 사람보다 땅을 더 무겁게 본다는 점에서 사람 요건이 더 무거운 재개발과 반대다.", src: "2026-08-11 부동산공법 도정법 총칙~관리처분계획 (재도전)", conceptKey: "부동산공법 도시개발조합 동의요건", retryOf: "부동산공법 도시개발조합 동의요건" },
  { type: "일반", cat: "부동산공법", q: "🔁 자연취락지구 안에서 건축물을 건축하는 경우에 적용되는 건폐율의 최대한도로 옳은 것은?", opts: ["40퍼센트 이하", "50퍼센트 이하", "60퍼센트 이하", "70퍼센트 이하"], answer: 2, expl: "취락지구의 건폐율 최대한도는 60퍼센트 이하다. 취락지구는 이미 사람이 모여 사는 곳이라 개발을 억제하기보다 기존 생활을 유지할 수 있는 수준으로 열어 준 것이다. 농공단지 70퍼센트, 공업지역 안 산업단지 80퍼센트와 숫자를 섞어 내는 함정에 주의한다.", src: "2026-08-11 부동산공법 도정법 총칙~관리처분계획 (재도전)", conceptKey: "부동산공법 1-5", retryOf: "부동산공법 1-5" },
  { type: "계산", cat: "부동산공법", q: "🔁 건축물의 외벽에 접하여 설치된 노대의 크기가 가로 12미터, 세로 3미터이다. 이 노대에서 바닥면적에 산입되는 면적은? (노대가 접한 가장 긴 외벽의 길이는 12미터이며 다른 조건은 동일)", opts: ["12제곱미터", "18제곱미터", "24제곱미터", "36제곱미터"], answer: 1, calc: { expr: "12*3 - 12*1.5", expected: 18 }, expl: "노대 전체 면적 36제곱미터에서 가장 긴 외벽에 접한 길이 12미터에 1.5미터를 곱한 18제곱미터를 뺀 18제곱미터만 바닥면적에 산입한다. 외벽에서 1.5미터까지는 완충 공간으로 보아 빼 주고 그 너머만 실내로 취급하는 구조다. 전체 면적을 그대로 고르지 않도록 주의한다.", src: "2026-08-18 부동산공법 건축물의 구조 및 면적산정방법 (재도전)", conceptKey: "모의고사 2차 2-10", retryOf: "모의고사 2차 2-10" },
  { type: "일반", cat: "부동산공법", q: "건축법령상 시장·군수가 건축허가를 하기 전에 도지사의 승인을 받아야 하는 경우에 관한 설명으로 <b>옳지 않은</b> 것은?", opts: ["자연환경이나 수질 보호를 위하여 도지사가 지정·공고한 구역에 건축하는 3층 이상의 위락시설이 대상이다", "같은 구역에 건축하는 연면적의 합계가 1천제곱미터 이상인 공동주택도 대상이다", "주거환경이나 교육환경 보호를 위하여 지정·공고한 구역의 위락시설은 규모와 관계없이 대상이다", "숙박시설과 일반음식점은 사전승인 대상 용도에 포함되지 아니한다"], answer: 3, expl: "사전승인 대상 용도는 위락시설·숙박시설·공동주택·일반음식점·일반업무시설이므로 숙박시설과 일반음식점도 포함된다. 자연환경·수질 보호구역에서는 3층 이상 또는 연면적 1천제곱미터 이상이라는 규모 요건이 붙지만, 주거환경·교육환경 보호구역에서는 규모와 관계없이 승인 대상이다. 용도를 빼거나 규모 요건을 뒤바꾸는 것이 함정이다.", src: "2026-08-18 부동산공법 건축허가", conceptKey: "부동산공법 2-2 도지사 사전승인" },
  { type: "일반", cat: "부동산공법", q: "건축법령상 대지와 도로 및 건축선에 관한 설명으로 <b>옳지 않은</b> 것은?", opts: ["건축물의 지표 아래 부분도 건축선의 수직면을 넘어서는 아니 된다", "길이가 10미터 이상 35미터 미만인 막다른 도로는 너비가 3미터 이상이어야 한다", "연면적의 합계가 2천제곱미터 이상인 건축물의 대지는 너비 6미터 이상의 도로에 4미터 이상 접하여야 한다", "대지의 배수에 지장이 없으면 대지가 인접한 도로면보다 낮아도 된다"], answer: 0, expl: "건축선에 따른 건축제한은 지상 부분에 관한 것이므로 건축물의 지표 아래 부분은 건축선의 수직면을 넘을 수 있다. 도로의 통행과 채광을 확보하려는 규정이라 땅 밑까지 규율할 이유가 없기 때문이다. 축사나 작물재배사처럼 사람의 출입이 적은 건축물은 접도의무 강화 대상에서 빠진다는 점도 함께 정리한다.", src: "2026-08-18 부동산공법 대지와 도로", conceptKey: "부동산공법 3-2 도로와 건축선" },
  { type: "조합", cat: "부동산공법", q: "도시 및 주거환경정비법령상 조합 정관의 변경을 위하여 조합원 3분의 2 이상의 찬성이 필요한 사항을 모두 고른 것은?<br>ㄱ. 조합원의 자격에 관한 사항<br>ㄴ. 정비구역의 위치 및 면적<br>ㄷ. 시공자·설계자의 선정 및 계약서에 포함될 내용<br>ㄹ. 조합의 명칭 및 사무소의 소재지", opts: ["ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ"], answer: 2, expl: "조합원·정비구역·돈에 관한 본질적 사항이 3분의 2 가중정족수의 대상이다. 시공자와 설계자의 선정은 사업비를 좌우하는 결정이라 돈에 관한 사항으로 묶인다. 명칭이나 사무소 소재지처럼 사업의 실질을 바꾸지 않는 사항은 일반 정족수로 충분하다.", src: "2026-08-11 부동산공법 추진위원회와 조합", conceptKey: "부동산공법 1-5 정관변경 가중정족수" },
  { type: "조합", cat: "부동산공법", q: "건축법령상 건축물의 용도 분류로 옳은 것을 모두 고른 것은?<br>ㄱ. 공관 — 단독주택<br>ㄴ. 기숙사 — 공동주택<br>ㄷ. 도서관 — 제2종 근린생활시설<br>ㄹ. 물류터미널 — 창고시설", opts: ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄷ, ㄹ"], answer: 1, expl: "도서관은 교육연구시설이고 제2종 근린생활시설에 해당하는 것은 독서실이다. 공관은 단독주택, 기숙사는 공동주택으로 묶이며 물류터미널은 창고시설이다. 도서관과 독서실처럼 이름이 비슷한 짝을 맞바꾸는 것이 전형적인 함정이다.", src: "2026-08-18 부동산공법 용도별 건축물의 종류", conceptKey: "부동산공법 1-3 용도별 건축물 분류" },
  { type: "OX", cat: "부동산세법", q: "🔁 주택의 재산세 과세표준이 과세표준상한액보다 큰 경우에는 그 과세표준상한액을 과세표준으로 한다.", opts: ["O", "X"], answer: 0, expl: "O. 과세표준상한제는 주택에만 적용되는 장치로, 공시가격 급등이 곧바로 세부담 급증으로 이어지지 않도록 상한을 씌운 것이다. 토지와 건축물에는 이 상한 규정이 없으므로 나대지의 과세표준이 크게 올라도 상한이 적용되지 않는다. 주택과 토지를 바꿔 놓는 지문에 주의한다.", src: "2026-08-14 부동산세법 물납과 분할납부~지방세기본법 (재도전)", conceptKey: "부동산세법 3-3", retryOf: "부동산세법 3-3" },
  { type: "일반", cat: "부동산세법", q: "지방세 불복절차에서의 각하·기각 및 대리인 선임에 관한 설명으로 <b>옳지 않은</b> 것은?", opts: ["기각은 청구 내용을 살펴본 뒤 이유가 없다고 판단하여 청구를 받아들이지 않는 것이다", "이의신청기간이 지난 뒤에 제기된 청구는 기각이 아니라 각하한다", "보정기간에 필요한 보정을 하지 아니한 경우에도 각하한다", "청구금액이 2천만원 미만인 경우에도 배우자를 대리인으로 선임할 수는 없다"], answer: 3, expl: "청구금액이 2천만원 미만인 소액 사건에서는 배우자나 4촌 이내 혈족 등을 대리인으로 선임할 수 있다. 금액이 작은 사건까지 전문가 선임을 요구하면 권리구제의 문턱이 지나치게 높아지기 때문이다. 각하는 요건 미비로 내용 심리 자체를 하지 않는 것이고 기각은 내용을 본 뒤 거절하는 것이라는 구분이 함께 나온다.", src: "2026-08-14 부동산세법 조세불복", conceptKey: "부동산세법 1-7 각하와 기각" },
  { type: "일반", cat: "부동산세법", q: "지방세의 우선징수와 배당순위에 관한 설명으로 옳은 것은?", opts: ["재산세는 저당권 설정보다 뒤에 성립한 경우에는 그 저당권보다 후순위로 배당받게 된다", "재산세는 저당권 설정보다 뒤에 성립하였더라도 저당권에 우선하여 배당된다", "지방자치단체의 징수금은 지방세, 체납처분비, 가산세의 순서로 징수한다", "가산세는 가산세를 제외한 지방세보다 먼저 충당된다"], answer: 1, expl: "재산세는 보유 사실 자체에서 예측할 수 있는 당해세라서 성립 시기와 관계없이 저당권보다 앞서 배당된다. 저당권자는 등기부를 보고 세금 부담을 예상할 수 있으므로 불측의 손해가 아니라고 보기 때문이다. 징수 순위는 체납처분비·지방세·가산세 순으로, 체지방은 가산된다고 외운다.", src: "2026-08-14 부동산세법 당해세 우선", conceptKey: "부동산세법 1-6 당해세 우선과 징수순위" },
  { type: "일반", cat: "부동산세법", q: "지방세의 납세자와 징수방법에 관한 설명으로 옳은 것은?", opts: ["납세자란 납세의무자만을 말하고 특별징수의무자는 포함되지 아니한다", "제2차 납세의무자와 보증인은 납세의무자에 포함되지 아니한다", "특별징수는 징수 여건이 좋은 자로 하여금 대신 징수하게 하는 방식이다", "보통징수는 납세의무자가 스스로 과세표준과 세액을 신고하여 납부하는 방식이다"], answer: 2, expl: "보통징수는 세무공무원이 납세고지서를 발급하여 걷는 방식이고, 특별징수는 원천에서 걷기 좋은 자를 징수의무자로 세워 대신 걷게 하는 방식이다. 걷는 주체가 누구냐로 두 방식이 갈린다. 납세자에는 납세의무자와 특별징수의무자가 모두 들어가고, 납세의무자에는 연대납세의무자·제2차 납세의무자·보증인이 포함된다.", src: "2026-08-14 부동산세법 납세자와 징수의 기본 구조", conceptKey: "부동산세법 1-1 납세자와 징수방법" },
  { type: "일반", cat: "부동산세법", q: "지방세 및 국세의 납세의무 성립과 확정에 관한 설명으로 <b>옳지 않은</b> 것은?", opts: ["인지세는 과세문서를 작성하더라도 신고나 결정 절차를 거쳐야 비로소 확정된다", "농어촌특별세는 본세의 납세의무가 성립하는 때에 함께 성립한다", "소득세 중간예납은 중간예납기간이 끝나는 때에 납세의무가 성립한다", "소득세 예정신고납부는 과세표준이 되는 금액이 발생한 달의 말일에 납세의무가 성립한다"], answer: 0, expl: "인지세는 과세문서를 작성하는 때에 성립하면서 신고나 결정 같은 별도 절차 없이 그 즉시 확정되는 자동확정 세목이다. 문서 작성이라는 사실만으로 세액이 정해져 판단할 여지가 없기 때문이다. 성립과 확정을 한 문장에 섞어 절차를 끼워 넣는 지문이 함정이다.", src: "2026-08-14 부동산세법 납세의무의 성립과 확정", conceptKey: "부동산세법 1-3 인지세 자동확정" },
  { type: "조합", cat: "부동산세법", q: "부동산 관련 조세가 부과되는 과세 단계에 관한 설명으로 옳은 것을 모두 고른 것은?<br>ㄱ. 지방교육세는 취득단계와 보유단계에 부과된다<br>ㄴ. 농어촌특별세는 취득·보유·양도의 전 단계에 부과될 수 있다<br>ㄷ. 인지세는 보유단계에 부과된다<br>ㄹ. 지방소득세는 보유단계와 양도단계에 부과된다", opts: ["ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ"], answer: 3, expl: "인지세는 문서를 작성하는 취득단계와 양도단계에 걸리고 보유단계에는 걸리지 않는다. 문서 작성이라는 행위가 있어야 과세되는 구조여서 계속 보유만 하는 동안에는 과세 계기가 없기 때문이다. 단계를 묻는 문제는 국세인지 지방세인지부터 걸러 낸 뒤 단계를 따지는 순서로 푼다.", src: "2026-08-14 부동산세법 세목별 과세 단계", conceptKey: "부동산세법 1-2 세목별 과세단계" },
  { type: "OX", cat: "부동산공시법", q: "🔁 전유부분의 건물표시는 공유지연명부와 대지권등록부에 모두 등록한다.", opts: ["O", "X"], answer: 1, expl: "X. 전유부분의 건물표시는 대지권등록부에만 등록된다. 공유지연명부는 하나의 토지를 여러 사람이 공유할 때 그 지분 관계를 적는 장부여서 건물에 관한 표시를 담을 자리가 없다. 소유권 지분은 두 장부에 모두 표시된다는 점과 헷갈리지 않도록 한다.", src: "2026-08-15 부동산공시법 소유권보존등기~소유권이전등기 (재도전)", conceptKey: "부동산공시법 3", retryOf: "부동산공시법 3" },

  { type: "일반", cat: "부동산공시법", q: "미등기 부동산의 물권변동과 등기신청의무에 관한 설명으로 <b>옳지 않은</b> 것은?", opts: ["건물을 신축하여 소유권을 원시취득한 자에게는 소유권보존등기를 신청하여야 할 의무가 없다", "상속으로 부동산소유권을 취득한 자는 등기를 하여야 비로소 소유권을 취득한다", "매매로 부동산물권을 변동시키려면 등기하여야 그 효력이 생긴다", "상속으로 취득한 부동산이라도 등기하지 아니하면 이를 처분하지 못한다"], answer: 1, expl: "상속은 민법 제187조의 법률규정에 의한 취득이므로 등기 없이도 소유권을 취득한다. 사망이라는 사실이 발생하면 권리가 곧바로 승계되어 등기를 기다릴 수 없기 때문이다. 다만 등기하지 아니하면 처분하지 못한다는 단서가 붙어 있어 취득과 처분을 구분하여야 한다.", src: "2026-08-15 부동산공시법 신축과 매매의 보존등기 의무", conceptKey: "부동산공시법 1-4 민법 186조와 187조" },

/*__BUILD_PAYLOAD_START__*/
// ── 순수 함수 레이어: DOM 없이 채점 결과(payload v2)를 만든다. node로 단위테스트 가능.
function conceptFromSrc(src){
  return String(src||"").replace(/^\s*\d{4}-\d{2}-\d{2}\s*/,"").replace(/\s*\(재도전\)\s*$/,"").trim();
}
function buildPayload(questions, sel, quizDate, nowIso, schemaVersion){
  let score = 0; const results = [], wrong = [];
  questions.forEach((item, qi)=>{
    const isCorrect = sel[qi] === item.answer;
    if(isCorrect) score++;
    const ck = item.conceptKey || conceptFromSrc(item.src);
    const isRetry = !!item.retryOf || /\(재도전\)/.test(item.src||"") || String(item.q||"").indexOf("🔁") >= 0;
    const base = {
      id: quizDate + "-q" + (qi+1), cat: item.cat, type: item.type, q: item.q,
      options: item.opts, myAnswer: item.opts[sel[qi]], correct: item.opts[item.answer],
      expl: item.expl, src: item.src
    };
    const r = Object.assign({}, base, {
      conceptKey: ck,
      retryOf: isRetry ? (item.retryOf || ck) : null,
      correctAnswered: isCorrect
    });
    if(item.calc) r.calc = item.calc;
    results.push(r);
    if(!isCorrect) wrong.push(base);   // v1 하위호환 필드 (기존 수거 파이프라인용)
  });
  return { score: score, wrong: wrong, payload: {
    schemaVersion: schemaVersion, subject: "공인중개사", date: quizDate, quizId: quizDate,
    score: score, total: questions.length, wrongCount: wrong.length,
    results: results, wrong: wrong, generatedAt: nowIso
  }};
}
/*__BUILD_PAYLOAD_END__*/

const form = document.getElementById('quiz');
const selected = new Array(QUESTIONS.length).fill(null);
let graded = false;
let LAST_PAYLOAD = null;
let lastCat = null;

document.getElementById('total').textContent = ' / ' + QUESTIONS.length;

QUESTIONS.forEach((item, qi)=>{
  if(item.cat !== lastCat){
    const s = document.createElement('div');
    s.className = 'sec';
    s.textContent = '▍' + item.cat;
    form.appendChild(s);
    lastCat = item.cat;
  }
  const card = document.createElement('div');
  card.className = 'q';
  const isOX = item.type === 'OX';
  card.innerHTML = `
    <div class="qhead">
      <span class="qno">${qi+1}</span>
      <span class="qtype">${item.type}</span>
      <span class="qcat">${item.cat}</span>
    </div>
    <div class="qtext">${item.q}</div>
    <div class="opts ${isOX?'ox':''}" data-q="${qi}"></div>
    <div class="expl" id="expl-${qi}"></div>`;
  const optsEl = card.querySelector('.opts');
  item.opts.forEach((o, oi)=>{
    const el = document.createElement('div');
    el.className = 'opt';
    el.dataset.q = qi; el.dataset.o = oi;
    el.innerHTML = isOX
      ? `<span>${o}</span>`
      : `<span class="mk">${String.fromCharCode(65+oi)}</span><span>${o}</span>`;
    el.addEventListener('click', ()=>{
      if(graded) return;
      selected[qi] = oi;
      optsEl.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');
      updateProgress();
    });
    // 눈동자(👁) 소거 버튼 — 확실히 아닌 보기를 희미하게(다시 누르면 복구). 채점·선택·저장에 영향 없음.
    if(!isOX){
      const eye = document.createElement('button');
      eye.type = 'button';
      eye.className = 'eye';
      eye.textContent = '👁';
      eye.title = '확실히 아닌 보기 희미하게 (다시 누르면 복구)';
      eye.setAttribute('aria-label', '이 보기를 후보에서 제외');
      eye.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        if(graded) return;
        el.classList.toggle('ruled');
      });
      el.appendChild(eye);
    }
    optsEl.appendChild(el);
  });
  form.appendChild(card);
});

function updateProgress(){
  const done = selected.filter(s=>s!==null).length;
  document.getElementById('pcount').textContent = `${done} / ${QUESTIONS.length} 선택`;
  document.getElementById('pbar').style.width = (done/QUESTIONS.length*100)+'%';
  document.getElementById('submitBtn').disabled = done !== QUESTIONS.length;
}

const btn = document.getElementById('submitBtn');
btn.addEventListener('click', ()=>{ if(!graded){ grade(); } else { location.reload(); } });

document.getElementById('copyBtn').addEventListener('click', ()=>{
  if(!LAST_PAYLOAD) return;
  const txt = JSON.stringify(LAST_PAYLOAD, null, 2);
  const done = ()=>{ document.getElementById('dlnote').textContent = "📋 복사 완료 — velog-posts/공인중개사/claude_ox_오답/_inbox/에 붙여넣어 저장해도 된다"; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt, done));
  } else { fallbackCopy(txt, done); }
});
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  ta.remove();
}

function grade(){
  graded = true;
  const built = buildPayload(QUESTIONS, selected, QUIZ_DATE, new Date().toISOString(), SCHEMA_VERSION);
  LAST_PAYLOAD = built.payload;
  QUESTIONS.forEach((item, qi)=>{
    const opts = document.querySelectorAll(`.opt[data-q="${qi}"]`);
    opts.forEach((el, oi)=>{
      el.style.cursor='default';
      el.classList.remove('ruled');           // 채점 시 소거 표시 해제(정답이 희미하게 남지 않도록)
      const eye = el.querySelector('.eye');    // 눈동자 버튼 제거 — 채점 후엔 불필요
      if(eye) eye.remove();
      if(oi === item.answer) el.classList.add('correct');
      if(oi === selected[qi] && oi !== item.answer) el.classList.add('wrong');
    });
    const correct = selected[qi] === item.answer;
    const ex = document.getElementById('expl-'+qi);
    ex.innerHTML = `<span class="verdict" style="color:${correct?'var(--ok)':'var(--no)'}">${correct?'정답!':'오답'}</span>${item.expl}<span class="src">📄 출처: ${item.src}</span>`;
    ex.classList.add('show');
  });
  const r = document.getElementById('result');
  document.getElementById('score').textContent = built.score;
  document.getElementById('rmsg').textContent = msgFor(built.score);
  r.classList.add('show');
  btn.textContent = '🔄 다시 풀기';
  btn.classList.add('retry');
  document.getElementById('copyBtn').classList.add('show');

  // 결과 자동 다운로드 (월요일 수거·원장 갱신이 읽는 파일)
  downloadResult(built.payload);

  r.scrollIntoView({behavior:'smooth', block:'center'});
}

function downloadResult(payload){
  try{
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `공인중개사_오답_${QUIZ_DATE}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    document.getElementById('dlnote').textContent =
      payload.wrongCount>0 ? `💾 결과 저장됨(오답 ${payload.wrongCount}개) — 다운로드 폴더 확인` : "💾 만점 기록 저장됨";
  }catch(e){
    document.getElementById('dlnote').textContent = "⚠️ 자동 저장 실패 — 아래 '결과 JSON 복사'를 눌러 수동 저장";
  }
}

function msgFor(s){
  const t = QUESTIONS.length;
  const r = s/t;
  if(s===t)   return "만점. 오늘 등록증 발급해도 되겠는데요? 🏆";
  if(r>=0.8)  return "합격권. 틀린 거 해설만 한 번 더 보면 완벽합니다.";
  if(r>=0.6)  return "절반은 넘었어요. 오답 노트행 직행하는 개념들이 보이네요.";
  if(r>=0.4)  return "아직 흔들리는 개념이 있어요. 해설 정독하고 내일 재도전!";
  return "괜찮아요, 회독이 쌓이면 올라갑니다. 해설부터 차근차근.";
}
