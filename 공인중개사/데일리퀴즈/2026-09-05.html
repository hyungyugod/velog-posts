<!DOCTYPE html>
<!-- ═══════════════════════════════════════════════════════════════
  HG 무한복습체계 · 퀴즈 단일 템플릿 v4.0 (2026-09-02)
  - 종전 6벌(공인중개사 데일리/오답 · 법무사 1차 데일리/오답 · 법무사 2차 데일리/오답)을
    기능의 합집합으로 단일화한 정본. 6벌은 이 파일로 대체된다.
  - 채점·결과 저장(downloadResult)·payload 스키마는 이 파일에서만 수정한다.
  - 생성기(engine/render_quiz.py)가 치환하는 것: 이중 중괄호 토큰
    QUIZ_DATE(2곳)·TITLE·EYEBROW·H1·META_LINE·TAGS_HTML·ALERT_HTML·DESC_HTML·
    SUBJECT·RESULT_PREFIX·QUIZ_ID_SUFFIX·EXAM_DEFAULT·INBOX_NOTE·
    ACCENT·ACCENT2·WARM·COOL·ON_ACCENT·ACCENT_GRAD2·REVEAL_HOVER·T_MCQ·T_SA·RESULT_MSGS
    그리고 QUESTIONS 마커 사이의 문항 배열. 그 외 로직 수정 금지.
    (⚠ 이 주석에는 실제 토큰 표기를 쓰지 않는다 — 치환·잔존 검사가 주석에 걸리지 않게)
  - 결과 JSON 스키마 v2: results[](전 문항 정오 기록) + wrong[](v1 하위호환).
    results[] 필드: id·cat·type·q·options·myAnswer·correct·expl·src·conceptKey·
      correctAnswered·retryOf(+exam·monthlyOf·calc·selfGraded·keywords·fixTyped·
      missedKeys·errorCause·causeNote 조건부)
  - 문항 필드 계약: 공통 type·cat·q·expl·src·conceptKey (+exam·sub·retryOf·monthlyOf)
    객관식(일반|조합|판례|사례|개수|계산|OX): opts[] · answer(정답 인덱스)
    계산형: calc{expr,expected}  /  단답형: answer(모범답)·keywords[]·opts 없음
  - 합집합 기능: 계산형 calc · 보기별 O·X 마킹 · 단답 자가채점/교정 게이트/놓친 포인트 칩/기타 입력 ·
    모르겠음(무답) · 객관식 오답 원인 진단 게이트 · ㄱㄴㄷ O·X 마킹 · 목표시간 표시 · 미제출 경보 배너
  - exam 키는 EXAM_DEFAULT가 빈 문자열이 아닐 때만 payload에 실린다(공인중개사는 종전대로 없음).
  - v2(2026-09-02) ①: 보기 소거 눈동자(👁)를 보기별 O·X 토글(·→O→X)로 대체 — ㄱㄴㄷ 마킹과 같은
    시각 문법, 선택과 독립(전파 차단), 채점 후 잠금·표시 유지, payload·채점에 영향 없음.
  - v2 ②: 중간 제출(✂ 여기까지 제출) — 푼 것만 채점하고 미응답은 정답·해설을 열지 않는다. 부분 제출
    payload에만 partial·answeredCount·skippedCount가 실리고 results[]의 미응답 항목은 skipped 축약형.
  - v2 ③: 진행 저장·복원(localStorage 키 hgq:과목:퀴즈ID) — 답·마킹·진단·채점 상태를 저장하고
    재방문 시 복원 배너를 띄운다. 저장 불가 환경(file:// origin 등)에서는 조용히 건너뛴다.
═══════════════════════════════════════════════════════════════ -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 데일리 문제지 · 2026-09-05</title>
<style>
  :root{
    --bg:#0f1115; --card:#191c23; --card2:#20242d; --line:#2c313b;
    --txt:#e7e9ee; --sub:#9aa3b2;
    --accent:#ffd24a; --accent2:#7c9cff;
    /* 역할 고정색 — 시험별 accent/accent2 배치와 무관하게 항상 같은 자리에 같은 색이 온다 */
    --warm:#ffd24a; --cool:#7c9cff;
    --onaccent:#1a1a1a; --grad2:#ffb347; --revealhov:#26261a;
    --ok:#34d399; --no:#f87171; --okbg:#10261d; --nobg:#2a1414;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:'Pretendard','Apple SD Gothic Neo',system-ui,-apple-system,sans-serif;
    line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px}
  header{margin-bottom:24px}
  .eyebrow{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:.04em}
  h1{font-size:28px;margin:6px 0 4px;font-weight:800}
  .meta{color:var(--sub);font-size:14px}
  .tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
  .tag{background:var(--card2);border:1px solid var(--line);color:var(--sub);
    padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600}
  .alertbanner{background:#2a1414;border:1px solid var(--no);color:#ffb4b4;border-radius:12px;
    padding:12px 16px;margin:14px 0 0;font-size:13.5px;font-weight:700}
  .alertbanner:empty{display:none}
  .bar{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.88);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:12px 0;margin:18px 0 24px}
  .progress{height:8px;background:var(--card2);border-radius:999px;overflow:hidden}
  .progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));
    border-radius:999px;transition:width .35s ease}
  .pmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-bottom:7px}
  .sec{font-size:13px;font-weight:800;color:var(--cool);margin:26px 0 10px;letter-spacing:.02em;
    border-top:1px dashed var(--line);padding-top:18px}
  .sec:first-of-type{border-top:none;padding-top:0}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px 18px 16px;margin-bottom:14px}
  .q.saok{border-color:var(--ok)} .q.sano{border-color:var(--no)}
  .qhead{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .qno{background:var(--accent);color:var(--onaccent);font-weight:800;font-size:13px;
    width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto}
  .qtype{font-size:11.5px;font-weight:700;color:var(--accent2);border:1px solid var(--accent2);
    padding:1px 8px;border-radius:999px}
  .qtype.t2{color:var(--ok);border-color:var(--ok)}
  .qcat{font-size:12px;color:var(--sub);margin-left:auto}
  .qtext{font-size:16px;font-weight:600;margin:2px 0 14px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);
    border-radius:11px;cursor:pointer;background:var(--card2);transition:.15s;user-select:none}
  .opt:hover{border-color:var(--cool)}
  .opt.sel{border-color:var(--warm);background:#26261a}
  .opt .mk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;
    display:grid;place-items:center;font-size:12px;font-weight:800}
  .opt.sel .mk{border-color:var(--warm);background:var(--warm);color:#1a1a1a}
  /* 보기별 O·X 마킹(·→O→X) — ㄱㄴㄷ 지문 마킹과 같은 시각 문법. 순수 시각용, 채점·저장에 영향 없음 */
  .opt .optox{margin-left:auto;flex:0 0 auto;width:26px;height:26px;padding:0;border-radius:7px;
    display:grid;place-items:center;font:inherit;font-size:12.5px;font-weight:700;line-height:1;
    background:var(--card2);border:1px solid var(--line);color:var(--sub);
    opacity:.55;cursor:pointer;transition:border-color .1s,background .1s,color .1s,opacity .1s}
  .opt .optox:hover{opacity:1;border-color:var(--accent)}
  .opt .optox.o{opacity:1;border-color:var(--ok);background:var(--okbg);color:var(--ok)}
  .opt .optox.x{opacity:1;border-color:var(--no);background:var(--nobg);color:var(--no)}
  .opt.mk-o{border-color:var(--ok)}
  .opt.mk-x{opacity:.45;background:var(--card);border-color:var(--no)}
  .opt.mk-x span:not(.mk){text-decoration:line-through;text-decoration-color:var(--no)}
  .opt.sel.mk-x{opacity:.62}
  .ox{flex-direction:row;gap:10px}
  .ox .opt{flex:1;justify-content:center;font-size:18px;font-weight:800}
  .opt.correct{border-color:var(--ok);background:var(--okbg)}
  .opt.correct .mk{border-color:var(--ok);background:var(--ok);color:#06281c}
  .opt.wrong{border-color:var(--no);background:var(--nobg)}
  .opt.wrong .mk{border-color:var(--no);background:var(--no);color:#2a0d0d}
  /* 채점 후: 마킹은 그대로 두되 정답 보기만은 희미해지지 않게(정답이 가려지면 복습이 안 된다) */
  .opt.correct.mk-x{opacity:1;background:var(--okbg)}
  .opt.correct.mk-x span:not(.mk){text-decoration:none}
  /* ── 단답형 UI ── */
  .sa-input{width:100%;min-height:74px;resize:vertical;background:var(--card2);color:var(--txt);
    border:1px solid var(--line);border-radius:11px;padding:12px 13px;font-size:14.5px;
    font-family:inherit;line-height:1.6}
  .sa-input:focus{outline:none;border-color:var(--accent)}
  .sa-input:disabled{opacity:.7}
  .sa-reveal{margin-top:10px;padding:10px 16px;border-radius:10px;border:1px solid var(--accent);
    background:transparent;color:var(--accent);font-weight:800;font-size:13.5px;cursor:pointer}
  .sa-reveal:hover{background:var(--revealhov)}
  .sa-reveal:disabled{opacity:.35;cursor:default}
  .sa-answer{margin-top:12px;padding:13px 14px;border-radius:11px;background:var(--okbg);
    border:1px solid #1d4634;font-size:14px}
  .sa-answer[hidden]{display:none}
  .sa-modela{font-weight:700}
  .sa-modela b{color:var(--ok)}
  .sa-keys{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;
    font-size:12px;color:var(--sub)}
  .sa-keys .kw{background:var(--card2);border:1px solid var(--line);border-radius:999px;
    padding:2px 9px;font-size:12px;color:var(--txt);font-weight:600}
  .sa-grade{margin-top:12px;display:flex;gap:9px;align-items:center;font-size:13px;color:var(--sub)}
  .sa-grade button{flex:0 0 auto;padding:8px 15px;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:var(--txt);font-weight:800;font-size:13.5px;cursor:pointer;transition:.15s}
  .sa-grade button.on-ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
  .sa-grade button.on-no{border-color:var(--no);background:var(--nobg);color:var(--no)}
  /* ── 단답 오답 교정 입력 ── */
  .sa-fix{margin-top:11px;padding:12px 13px;border-radius:11px;
    background:var(--nobg);border:1px solid var(--no)}
  .sa-fix[hidden]{display:none}
  .sa-fixhead{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sa-fixhead b{color:var(--no)}
  .sa-meter{flex:1 1 90px;min-width:80px;height:6px;border-radius:99px;background:var(--card2);overflow:hidden}
  .sa-meter i{display:block;height:100%;width:0;background:var(--no);transition:width .12s linear}
  .sa-pct{font-variant-numeric:tabular-nums;font-weight:700;color:var(--no);min-width:40px;text-align:right}
  .sa-fixinput{width:100%;min-height:64px;margin-top:9px;resize:vertical;background:var(--card2);
    color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 12px;
    font:inherit;font-size:15px;line-height:1.6}
  .sa-fixinput:focus{outline:none;border-color:var(--no)}
  .sa-fixinput:disabled{opacity:.7}
  .sa-fixnote{margin-top:7px;font-size:12px;color:var(--sub)}
  .sa-fix.done{background:var(--okbg);border-color:var(--ok)}
  .sa-fix.done .sa-fixhead b,.sa-fix.done .sa-pct{color:var(--ok)}
  .sa-fix.done .sa-meter i{background:var(--ok)}
  .sa-fix.done .sa-fixinput:focus{border-color:var(--ok)}
  .sa-answer.veil .sa-modela{filter:blur(5px);cursor:pointer;user-select:none;transition:filter .15s}
  .sa-answer.veil .sa-modela:hover,.sa-answer.veil.peek .sa-modela{filter:none}
  .sa-misshead{font-size:13px;color:var(--sub)}
  .sa-misshead b{color:var(--no)}
  .sa-misschips{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
  .sa-chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;font-size:13px;color:var(--txt);cursor:pointer;user-select:none;
    transition:background .12s,border-color .12s,color .12s}
  .sa-chip:hover{border-color:var(--no)}
  .sa-chip.on{background:var(--no);border-color:var(--no);color:#1a0b0b;font-weight:700}
  .sa-fix.done .sa-chip.on{background:var(--ok);border-color:var(--ok);color:#06231a}
  .sa-chip.etc{border-style:dashed}
  .sa-etcwrap{margin-top:9px}
  .sa-etcwrap[hidden]{display:none}
  .sa-etcinput{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--no);
    border-radius:10px;padding:9px 12px;font:inherit;font-size:14px}
  .sa-etcinput:focus{outline:none;border-color:var(--accent)}
  .sa-etcinput:disabled{opacity:.7}
  .sa-fixbody{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
  .sa-fixbody[hidden]{display:none}
  /* ── 객관식 오답 원인 진단 ── */
  .mcq-diag{margin-top:11px;padding:12px 13px;border-radius:11px;
    background:var(--nobg);border:1px solid var(--no)}
  .mcq-diag .dhead{font-size:13px;color:var(--sub)}
  .mcq-diag .dhead b{color:var(--no)}
  .mcq-diag .dchips{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
  .mcq-diag .dmemo{width:100%;margin-top:9px;background:var(--card2);color:var(--txt);
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px}
  .mcq-diag .dmemo:focus{outline:none;border-color:var(--no)}
  .mcq-diag .dmemo:disabled{opacity:.7}
  .mcq-diag.done{background:var(--okbg);border-color:var(--ok)}
  .mcq-diag.done .dhead b{color:var(--ok)}
  .mcq-diag.done .sa-chip.on{background:var(--ok);border-color:var(--ok);color:#06231a}
  .copybtn:disabled{opacity:.4;cursor:default}
  /* ── 객관식 모르겠음(무답) 버튼 ── */
  .dk-btn{display:block;margin:8px 0 0 auto;padding:6px 13px;border-radius:999px;
    border:1px dashed var(--line);background:transparent;color:var(--sub);
    font:inherit;font-size:12.5px;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
  .dk-btn:hover{border-color:var(--no);color:var(--txt)}
  .dk-btn.on{border-style:solid;border-color:var(--no);background:var(--nobg);color:var(--no);font-weight:700}
  .dk-btn:disabled{opacity:.45;cursor:default}
  /* ── ㄱㄴㄷ 지문 O·X 마킹 — 채점 무관 시각 메모 ── */
  .ox-mark{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
    margin-right:6px;border-radius:6px;border:1px solid var(--line);background:var(--card2);
    color:var(--sub);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
    vertical-align:middle;padding:0;transition:border-color .1s,background .1s,color .1s}
  .ox-mark:hover{border-color:var(--accent)}
  .ox-mark.o{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
  .ox-mark.x{border-color:var(--no);background:var(--nobg);color:var(--no)}
  /* ── 진행 복원 배너 ── */
  .restorebar{display:block;background:var(--card2);border:1px solid var(--cool);border-radius:12px;
    padding:10px 14px;margin:14px 0 0;font-size:13px;color:var(--sub)}
  .restorebar[hidden]{display:none}
  .restorebar b{color:var(--cool)}
  .restorebar a{color:var(--warm);font-weight:700;cursor:pointer;text-decoration:underline}
  /* ── 중간제출 미응답 배지 ── */
  .q.skipped{border-style:dashed}
  .skipbadge{display:inline-block;margin:0 0 10px;padding:3px 11px;border-radius:999px;
    border:1px dashed var(--sub);color:var(--sub);font-size:12px;font-weight:700}
  .expl{margin-top:12px;padding:12px 14px;border-radius:11px;background:var(--card2);
    border-left:3px solid var(--cool);font-size:13.5px;color:#d4d9e2;display:none}
  .expl.show{display:block;animation:fade .3s ease}
  .expl .verdict{font-weight:800;margin-right:6px}
  .expl .src{display:block;margin-top:7px;color:var(--sub);font-size:12px}
  @keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .submit{width:100%;padding:16px;border:none;border-radius:14px;font-size:17px;font-weight:800;
    background:linear-gradient(90deg,var(--accent),var(--grad2));color:var(--onaccent);cursor:pointer;margin-top:10px}
  .submit:disabled{opacity:.45;cursor:not-allowed}
  .submit.retry{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .submit.partial{margin-top:9px;padding:12px;font-size:14.5px;background:var(--card2);
    color:var(--txt);border:1px dashed var(--line)}
  .submit.partial:hover:not(:disabled){border-color:var(--warm);color:var(--warm)}
  #result{display:none;text-align:center;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:28px 20px;margin-bottom:18px}
  #result.show{display:block;animation:fade .4s ease}
  .ring{font-size:46px;font-weight:900;margin:4px 0}
  .ring small{font-size:18px;color:var(--sub);font-weight:700}
  #rmsg{color:var(--sub);font-size:15px;margin-top:4px}
  #dlnote{font-size:12.5px;color:var(--warm);margin-top:12px}
  .copybtn{display:none;margin-top:12px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:var(--txt);font-weight:700;cursor:pointer;font-size:13px}
  .copybtn.show{display:inline-block}
  .foot{text-align:center;margin-top:30px;color:var(--sub);font-size:12.5px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">DAILY QUIZ · 공인중개사</div>
    <h1>오늘의 복습 문제지</h1>
    <div class="meta">2026년 9월 5일 (토) · 실전형 50문항(본편 40 + 한달전 복원 10) · 장기복습 20(⏪) · 한달전 10(🔄) · 단답 5(자가채점)</div>
    <div class="tags"><span class="tag">🔥 심화</span><span class="tag">📝 실전 4지선다</span><span class="tag">⏪ 장기복습 20</span><span class="tag">🔄 한달전 복원 10</span><span class="tag">🎯 정답분산</span><span class="tag">✍️ 단답 5</span><span class="tag">부동산학개론</span><span class="tag">민법</span><span class="tag">공인중개사법</span><span class="tag">부동산공법</span><span class="tag">부동산공시법</span><span class="tag">부동산세법</span></div>
    <div class="alertbanner"></div>
    <div class="restorebar" id="restoreBar" hidden></div>
  </header>

// ── 순수 함수 레이어: DOM 없이 채점 결과(payload v2)를 만든다. node로 단위테스트 가능.
// sel[qi]: 객관식 = 선택 인덱스(number) 또는 "DK"(무답) / 단답형 = {typed, revealed, self, fix, fixed, missed}
function conceptFromSrc(src){
  return String(src||"").replace(/^\s*\d{4}-\d{2}-\d{2}\s*/,"").replace(/\s*\(재도전\)\s*$/,"").trim();
}
// answered: 중간 제출용 마스크(문항별 true/false). 생략·전부 true면 종전 전체 제출과 100% 동일한 payload.
//           부분일 때만 최상위 partial·answeredCount·skippedCount가 붙고, 미응답 항목은 축약형으로만 실린다
//           (정답·해설·options를 넣지 않는다 — 다음 회차 재출제가 오염되지 않게).
function buildPayload(questions, sel, quizDate, nowIso, schemaVersion, answered){
  let score = 0; const results = [], wrong = [];
  const partial = Array.isArray(answered) && answered.indexOf(false) >= 0;
  let answeredCount = 0;
  questions.forEach((item, qi)=>{
    const isSA = item.type === "단답";
    const st = sel[qi];
    const ck = item.conceptKey || conceptFromSrc(item.src);
    const isRetry = !!item.retryOf || /\(재도전\)/.test(item.src||"") || String(item.q||"").indexOf("🔁") >= 0;
    if(partial && !answered[qi]){
      results.push({
        id: quizDate + "-q" + (qi+1), cat: item.cat, type: item.type, q: item.q,
        conceptKey: ck, retryOf: isRetry ? (item.retryOf || ck) : null,
        skipped: true, correctAnswered: null, myAnswer: null
      });
      return;
    }
    answeredCount++;
    const isCorrect = isSA ? !!(st && st.self === true) : (st === item.answer);
    if(isCorrect) score++;
    const base = isSA ? {
      id: quizDate + "-q" + (qi+1), cat: item.cat, type: item.type, q: item.q,
      myAnswer: (st && st.typed) || "", correct: item.answer,
      expl: item.expl, src: item.src
    } : {
      id: quizDate + "-q" + (qi+1), cat: item.cat, type: item.type, q: item.q,
      options: item.opts, myAnswer: (st === "DK" ? "모르겠음" : item.opts[st]), correct: item.opts[item.answer],
      expl: item.expl, src: item.src
    };
    const r = Object.assign({}, base, {
      conceptKey: ck,
      retryOf: isRetry ? (item.retryOf || ck) : null,
      correctAnswered: isCorrect
    });
    // exam 키는 시험 기본값이 비어 있지 않을 때만 실린다(공인중개사는 종전대로 키 없음)
    const examVal = item.exam || EXAM_DEFAULT;
    if(examVal) r.exam = examVal;
    if(isSA){ r.selfGraded = true; r.keywords = item.keywords || [];
      if(st && st.self === false){
        if(st.fix){ r.fixTyped = st.fix; base.fixTyped = st.fix; }
        if(st.missed && st.missed.length){ r.missedKeys = st.missed.slice(); base.missedKeys = st.missed.slice(); }
      } }
    if(item.calc) r.calc = item.calc;
    if(item.monthlyOf) r.monthlyOf = item.monthlyOf;
    results.push(r);
    if(!isCorrect) wrong.push(base);   // v1 하위호환 필드 (기존 수거 파이프라인용)
  });
  const payload = {
    schemaVersion: schemaVersion, subject: SUBJECT, date: quizDate, quizId: quizDate + QUIZ_ID_SUFFIX,
    score: score, total: partial ? answeredCount : questions.length, wrongCount: wrong.length,
    results: results, wrong: wrong, generatedAt: nowIso
  };
  if(partial){
    payload.partial = true;
    payload.answeredCount = answeredCount;
    payload.skippedCount = questions.length - answeredCount;
  }
  return { score: score, wrong: wrong, payload: payload };
}
/*__BUILD_PAYLOAD_END__*/

// ── 단답 오답 진단·교정 ──────────────────────────────────────────
// "❌ 틀렸다" → ① 채점 포인트 중 놓친 것 선택(1개 이상 필수 · 없으면 '기타'에 직접 입력)
//              → ② 모범답을 가린 채 재인출 타이핑.
// ①은 다음 오답퀴즈의 출제 조준점이 되고(payload missedKeys → 원장), ②는 회독을 인출로 바꾼다.
// 근거: 오답 뒤 정답을 눈으로만 읽으면 다음 회차에 같은 자리가 그대로 빈다.
const SA_FIX_PASS = 0.55;          // 통과 일치도(0~1). 낮추면 관대해진다
// 모범답 가림은 상시 적용 — 보고 베끼면 전사(轉寫)지 인출이 아니다.
// 막히면 모범답에 마우스를 올리거나(데스크톱) 탭해서(터치) 잠깐 열어볼 수 있다.
function saNorm(s){
  return String(s == null ? '' : s)
    .replace(/<[^>]*>/g, ' ')
    .replace(/&[a-z]+;/gi, ' ')
    .replace(/[\s.,·․、，。()（）\[\]「」『』"'`~\-–—_:;!?\/\\]/g, '')
    .toLowerCase();
}
function saSim(a, b){   // 문자 2-gram Dice 계수 — 오탈자·어순 흔들림에 관대
  a = saNorm(a); b = saNorm(b);
  if(!a || !b) return 0;
  if(a.length < 2 || b.length < 2) return a === b ? 1 : 0;
  const gram = s => { const m = new Map();
    for(let i=0;i<s.length-1;i++){ const k = s.slice(i,i+2); m.set(k, (m.get(k)||0)+1); }
    return m; };
  const ga = gram(a), gb = gram(b);
  let inter = 0, na = 0, nb = 0;
  ga.forEach(v => na += v); gb.forEach(v => nb += v);
  ga.forEach((v,k) => { inter += Math.min(v, gb.get(k) || 0); });
  return 2*inter/(na+nb);
}

// ── 객관식 오답 원인 진단 ─────────────────────────────────────────
// 채점 후 틀린 객관식마다 원인 1개를 골라야(메모는 선택) 결과 JSON이 저장된다.
// 원인은 원장에 누적되어 Anki 편입(실수 전용 개념 제외)·재출제 각도(혼동→판별식 등)를 정한다.
// 근거: 해설을 눈으로 읽고 넘어간 오답은 원인 미상으로 남아 같은 방식으로 또 틀린다.
const MCQ_CAUSES = [
  ['개념부재', '몰랐다 — 개념 자체를'],
  ['혼동',     '헷갈렸다 — 다른 보기·개념과'],
  ['함정',     '함정 — 발문·지문에 걸림'],
  ['실수',     '실수 — 알았는데 잘못 체크·계산']
];
const mcqDiag = {};        // qi → {cause, note}
let diagPending = [];      // 진단 대기 중인 틀린 객관식 qi 목록
let DIAG_SAVED = false;
function diagDone(){ return diagPending.every(qi => mcqDiag[qi] && mcqDiag[qi].cause); }
function attachCauses(payload){
  diagPending.forEach(qi => {
    const d = mcqDiag[qi];
    if(!d || !d.cause) return;
    const res = payload.results && payload.results[qi];
    if(res){ res.errorCause = d.cause; if(d.note) res.causeNote = d.note; }
  });
  (payload.wrong || []).forEach(w => {
    const qi = parseInt(String(w.id || '').split('-q').pop(), 10) - 1;
    const d = mcqDiag[qi];
    if(d && d.cause){ w.errorCause = d.cause; if(d.note) w.causeNote = d.note; }
  });
  return payload;
}
function diagUpdate(){
  const bd = document.getElementById('diagSave');
  if(!bd) return;
  const left = diagPending.filter(qi => !(mcqDiag[qi] && mcqDiag[qi].cause)).length;
  bd.disabled = left > 0;
  bd.textContent = left > 0 ? ('🩺 오답 진단 저장 — ' + left + '개 남음') : '🩺 오답 진단 저장 (준비 완료)';
}
function makeDiag(qi){
  const d = document.createElement('div');
  d.className = 'mcq-diag'; d.id = 'diag-' + qi;
  d.innerHTML = `
    <div class="dhead"><b>🩺 왜 틀렸나요?</b> — 1개 선택 · 원인에 따라 Anki 편입과 재출제 각도가 달라집니다</div>
    <div class="dchips">${MCQ_CAUSES.map((c,ci)=>`<span class="sa-chip" data-c="${ci}">${c[1]}</span>`).join('')}</div>
    <input type="text" class="dmemo" maxlength="80" placeholder="한 줄 메모 (선택) — 예: 임의적·필요적 감경을 반대로 알고 있었음">`;
  d.querySelectorAll('.sa-chip').forEach(ch => {
    ch.addEventListener('click', () => {
      if(DIAG_SAVED || d.classList.contains('done')) return;   // 저장된 라운드의 진단은 잠긴다
      d.querySelectorAll('.sa-chip').forEach(x => x.classList.remove('on'));
      ch.classList.add('on');
      mcqDiag[qi] = mcqDiag[qi] || {};
      mcqDiag[qi].cause = MCQ_CAUSES[+ch.dataset.c][0];
      diagUpdate();
      saveProgress();
    });
  });
  d.querySelector('.dmemo').addEventListener('input', (ev) => {
    if(DIAG_SAVED || d.classList.contains('done')) return;
    mcqDiag[qi] = mcqDiag[qi] || {};
    mcqDiag[qi].note = ev.target.value.trim().replace(/\s+/g, ' ');
    saveProgress();
  });
  return d;
}
// 저장된 진단(중간제출 후 재방문)을 잠긴 상태로 되살린다
function restoreDiagBox(qi){
  const d0 = mcqDiag[qi];
  if(!d0 || !d0.cause) return;
  if(document.getElementById('diag-' + qi)) return;
  const ex = document.getElementById('expl-' + qi);
  if(!ex) return;
  const d = makeDiag(qi);
  const ci = MCQ_CAUSES.findIndex(c => c[0] === d0.cause);
  if(ci >= 0){ const ch = d.querySelector('.sa-chip[data-c="' + ci + '"]'); if(ch) ch.classList.add('on'); }
  const memo = d.querySelector('.dmemo');
  if(memo){ memo.value = d0.note || ''; memo.disabled = true; }
  d.classList.add('done');
  d.querySelectorAll('.sa-chip').forEach(x => { x.style.cursor = 'default'; });
  ex.insertAdjacentElement('afterend', d);
}

const selected = QUESTIONS.map(q => q.type === '단답' ? {typed:'', revealed:false, self:null, fix:'', fixed:false, missed:[]} : null);

const RESTORERS = [];                                // 문항별 복원 함수(카드 생성 때 등록)

// ── 진행 저장·복원 ────────────────────────────────────────────────
// file://로 열리는 문제지라 브라우저에 따라 localStorage가 아예 없거나(origin 불투명) 예외를 던진다.
// 저장은 어디까지나 편의 기능이므로 실패는 조용히 삼키고 페이지는 그대로 동작해야 한다.
const QUIZ_ID = QUIZ_DATE + QUIZ_ID_SUFFIX;
const SAVE_KEY = 'hgq:' + SUBJECT + ':' + QUIZ_ID;
let SAVE_ON = false;                                 // 복원이 끝난 뒤에만 저장한다
function lsStore(){
  try{ return window.localStorage || null; }catch(e){ return null; }
}
function isAnswered(qi){
  const q = QUESTIONS[qi], s = selected[qi];
  if(q.type === '단답') return !!(s && (s.self === true || (s.self === false && s.fixed && s.missed.length > 0)));
  return s !== null;
}
function answeredCount(){ let n = 0; QUESTIONS.forEach((q, qi)=>{ if(isAnswered(qi)) n++; }); return n; }
function markStateOf(b){ return b.classList.contains('o') ? 'o' : (b.classList.contains('x') ? 'x' : ''); }
function snapshot(){
  const optMarks = {}, oxMarks = {};
  QUESTIONS.forEach((q, qi)=>{
    const card = document.getElementById('card-' + qi);
    if(!card) return;
    const om = [].slice.call(card.querySelectorAll('.optox')).map(markStateOf);
    if(om.some(v => v)) optMarks[qi] = om;
    const xm = [].slice.call(card.querySelectorAll('.ox-mark')).map(markStateOf);
    if(xm.some(v => v)) oxMarks[qi] = xm;
  });
  const gradedIdx = [];
  GRADED.forEach((g, i)=>{ if(g) gradedIdx.push(i); });
  return {
    v: 2, quizId: QUIZ_ID,
    sel: selected.map(s => (s && typeof s === 'object') ? {
      typed: s.typed, revealed: s.revealed, self: s.self,
      fix: s.fix, fixed: s.fixed, missed: (s.missed || []).slice()
    } : s),
    diag: mcqDiag, optMarks: optMarks, oxMarks: oxMarks,
    gradedIdx: gradedIdx, partialDone: PARTIAL_DONE, savedAt: new Date().toISOString()
  };
}
function isBlank(s){
  const noSel = s.sel.every(v => v === null || (v && typeof v === 'object' && !v.typed && !v.revealed && v.self === null));
  return noSel && !s.gradedIdx.length
    && !Object.keys(s.optMarks).length && !Object.keys(s.oxMarks).length && !Object.keys(s.diag).length;
}
function saveProgress(){
  if(!SAVE_ON) return;
  const ls = lsStore();
  if(!ls) return;
  try{
    const s = snapshot();
    if(isBlank(s)) ls.removeItem(SAVE_KEY);
    else ls.setItem(SAVE_KEY, JSON.stringify(s));
  }catch(e){}
}
function loadProgress(){
  const ls = lsStore();
  if(!ls) return null;
  try{
    const raw = ls.getItem(SAVE_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    return (s && Array.isArray(s.sel) && s.sel.length === QUESTIONS.length) ? s : null;
  }catch(e){ return null; }
}
function clearProgress(){
  const ls = lsStore();
  if(!ls) return;
  try{ ls.removeItem(SAVE_KEY); }catch(e){}
}
/*__PROGRESS_STORE_END__*/

          <span class="sa-meter"><i></i></span><span class="sa-pct">0%</span></div>
        <textarea class="sa-fixinput" placeholder="기억나는 대로 다시 쓰세요 — 막히면 위 모범답에 마우스를 올리거나 탭하면 잠깐 열립니다"></textarea>

// 보기 O·X 마킹 적용 — '' → 표시 없음 / 'o' → 초록 / 'x' → 빨강 + 희미하게(소거 승계)
function setOptMark(el, mk, state){
  mk.classList.remove('o','x');
  el.classList.remove('mk-o','mk-x');
  if(state === 'o'){ mk.classList.add('o'); el.classList.add('mk-o'); mk.textContent = 'O'; }
  else if(state === 'x'){ mk.classList.add('x'); el.classList.add('mk-x'); mk.textContent = 'X'; }
  else { mk.textContent = '·'; }
}

function updateProgress(){
  document.querySelectorAll('.dk-btn').forEach(b => { const k = +b.dataset.q; b.classList.toggle('on', selected[k] === 'DK'); });
  // 단답형은 '자가채점까지 끝난 것'만 완료로 센다(객관식은 선택 여부)
  const done = selected.filter((s,i)=> QUESTIONS[i].type==='단답' ? (s && (s.self===true || (s.self===false && s.fixed && s.missed.length>0))) : (s!==null)).length;
  document.getElementById('pcount').textContent = `${done} / ${QUESTIONS.length} 완료`;
  document.getElementById('pbar').style.width = (done/QUESTIONS.length*100)+'%';
  document.getElementById('submitBtn').disabled = done !== QUESTIONS.length;
  const pb = document.getElementById('partialBtn');
  // 중간 제출: 답한 게 1개 이상이고 아직 전 문항 완료가 아닐 때만
  if(pb) pb.disabled = graded || done < 1 || done === QUESTIONS.length;
  QUESTIONS.forEach((q, qi)=>{ if(!GRADED[qi] && isAnswered(qi)) unmarkSkipped(qi); });
  saveProgress();
}

// ── 모르겠음(무답) 버튼: 아예 모르면 찍지 말 것 — 찍어서 맞으면 구멍이 기록되지 않는다 ──
QUESTIONS.forEach((it, qi) => {
  if(it.type === '단답') return;
  const ow = document.querySelector('.opts[data-q="' + qi + '"]');
  if(!ow) return;
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'dk-btn'; b.dataset.q = qi;
  b.textContent = '🤷 모르겠음 — 찍지 않기';
  b.title = '무답 처리: 오답으로 집계되고 원인은 자동으로 [개념부재]가 됩니다';
  b.addEventListener('click', () => {
    if(graded || GRADED[qi]) return;
    selected[qi] = (selected[qi] === 'DK') ? null : 'DK';
    ow.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
    updateProgress();
  });
  ow.insertAdjacentElement('afterend', b);
  // ── ㄱㄴㄷ 지문 O·X 마킹: 시험지 여백 체크의 화면판 — 판정을 머리에 안 들고 있게 ──
  const qt = ow.closest('.q') && ow.closest('.q').querySelector('.qtext');
  if(qt && !qt.dataset.oxDone && /(^|<br\s*\/?>)\s*[ㄱㄴㄷㄹㅁㅂ]\.\s/.test(qt.innerHTML)){
    qt.innerHTML = qt.innerHTML.replace(/(^|<br\s*\/?>)(\s*)([ㄱㄴㄷㄹㅁㅂ])(\.\s*)/g,
      '$1$2<button type="button" class="ox-mark" title="지문 O·X 메모 — 채점과 무관한 체크용">·</button>$3$4');
    qt.dataset.oxDone = '1';
  }
});
function setOxMark(t, state){
  t.classList.remove('o','x');
  if(state === 'o'){ t.classList.add('o'); t.textContent = 'O'; }
  else if(state === 'x'){ t.classList.add('x'); t.textContent = 'X'; }
  else { t.textContent = '·'; }
}
form.addEventListener('click', (e) => {
  const t = e.target.closest('.ox-mark');
  if(!t) return;
  e.preventDefault();
  const card = t.closest('.q');
  const qi = card ? +String(card.id).split('-')[1] : -1;
  if(graded || GRADED[qi]) return;
  setOxMark(t, markStateOf(t) === '' ? 'o' : (markStateOf(t) === 'o' ? 'x' : ''));
  saveProgress();
});

const btn = document.getElementById('submitBtn');
btn.addEventListener('click', ()=>{ if(!graded){ grade(); } else { location.reload(); } });

// ── 중간 제출: 푼 것만 채점 · 미응답은 정답을 열지 않고 다음 퀴즈로 넘긴다 ──
const btnP = document.getElementById('partialBtn');
btnP.addEventListener('click', ()=>{
  if(graded || btnP.disabled) return;
  const n = answeredCount(), m = QUESTIONS.length - n;
  if(n < 1 || m < 1) return;
  const ok = window.confirm(n + '문항만 채점하고 나머지 ' + m
    + '문항은 미응답으로 남깁니다. 미응답은 정답이 공개되지 않고 다음 퀴즈에서 다시 나옵니다.');
  if(!ok) return;
  grade(true);
});

document.getElementById('copyBtn').addEventListener('click', ()=>{
  if(!LAST_PAYLOAD) return;
  const txt = JSON.stringify(LAST_PAYLOAD, null, 2);
  const done = ()=>{ document.getElementById('dlnote').textContent = "📋 복사 완료 — " + INBOX_NOTE + "에 붙여넣어 저장해도 된다"; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt, done));
  } else { fallbackCopy(txt, done); }
});
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  ta.remove();
}

// 문항 하나를 채점 상태로 확정한다(정답·해설 공개 + 잠금). 복원 때도 같은 함수를 태운다.
function applyGrade(qi){
  const item = QUESTIONS[qi];
  const ex = document.getElementById('expl-'+qi);
  if(item.type === '단답'){          // 단답형은 자가채점 결과로 확정
    const st = selected[qi];
    const okSA = !!(st && st.self === true);
    const cardSA = document.getElementById('card-'+qi);
    if(cardSA){
      cardSA.classList.add(okSA ? 'saok' : 'sano');
      cardSA.querySelectorAll('.sa-grade button').forEach(b=>{ b.style.cursor='default'; });
      cardSA.querySelectorAll('.sa-fixinput').forEach(t=>{ t.disabled = true; });
      cardSA.querySelectorAll('.sa-chip').forEach(c=>{ c.style.cursor = 'default'; });
      cardSA.querySelectorAll('.sa-etcinput').forEach(t=>{ t.disabled = true; });
      cardSA.querySelectorAll('.sa-answer').forEach(x=>x.classList.remove('veil'));
    }
    ex.innerHTML = `<span class="verdict" style="color:${okSA?'var(--ok)':'var(--no)'}">${okSA?'정답(자가채점)':'오답(자가채점)'}</span>${item.expl}<span class="src">📄 출처: ${item.src}</span>`;
    ex.classList.add('show');
    return;
  }
  const opts = document.querySelectorAll(`.opt[data-q="${qi}"]`);
  opts.forEach((el, oi)=>{
    el.style.cursor='default';
    el.querySelectorAll('.optox').forEach(m=>{ m.style.cursor='default'; });  // 마킹은 남기되 잠근다
    if(oi === item.answer) el.classList.add('correct');
    if(oi === selected[qi] && oi !== item.answer) el.classList.add('wrong');
  });
  const dk = document.querySelector('.dk-btn[data-q="' + qi + '"]');
  if(dk) dk.disabled = true;
  const correct = selected[qi] === item.answer;
  ex.innerHTML = `<span class="verdict" style="color:${correct?'var(--ok)':'var(--no)'}">${correct?'정답!':(selected[qi]==='DK'?'모르겠음(무답)':'오답')}</span>${item.expl}<span class="src">📄 출처: ${item.src}</span>`;
  ex.classList.add('show');
}
// 중간제출에서 빠진 문항 — 배지만 붙이고 정답·해설은 열지 않는다(재출제 오염 방지). 계속 풀 수 있다.
function markSkipped(qi){
  const card = document.getElementById('card-'+qi);
  if(!card || card.querySelector('.skipbadge')) return;
  card.classList.add('skipped');
  const b = document.createElement('div');
  b.className = 'skipbadge'; b.dataset.q = qi;
  b.textContent = '미응답(중간제출)';
  const head = card.querySelector('.qhead');
  if(head) head.insertAdjacentElement('afterend', b); else card.insertBefore(b, card.firstChild);
}
function unmarkSkipped(qi){
  const card = document.getElementById('card-'+qi);
  if(!card) return;
  card.classList.remove('skipped');
  const b = card.querySelector('.skipbadge');
  if(b) b.remove();
}

function grade(isPartial){
  const answered = QUESTIONS.map((q, qi)=> isAnswered(qi));
  if(isPartial){
    if(answered.every(Boolean) || !answered.some(Boolean)) return;
    PARTIAL_DONE = true;
  } else {
    graded = true;
  }
  const built = buildPayload(QUESTIONS, selected, QUIZ_DATE, new Date().toISOString(),
                             SCHEMA_VERSION, isPartial ? answered : null);
  LAST_PAYLOAD = built.payload;
  QUESTIONS.forEach((item, qi)=>{
    if(GRADED[qi]) return;                       // 이미 확정된 문항은 재채점하지 않는다(결과 고정)
    if(isPartial && !answered[qi]){ markSkipped(qi); return; }
    GRADED[qi] = true;
    unmarkSkipped(qi);
    applyGrade(qi);
  });
  const r = document.getElementById('result');
  document.getElementById('score').textContent = built.score;
  document.getElementById('total').textContent = ' / ' + built.payload.total;
  document.getElementById('rmsg').textContent = msgFor(built.score, built.payload.total)
    + (isPartial ? ` (중간 제출 — 미응답 ${built.payload.skippedCount}문항은 다음 퀴즈로)` : '');
  r.classList.add('show');
  if(!isPartial){
    btn.textContent = '🔄 다시 풀기';
    btn.classList.add('retry');
    document.querySelectorAll('.dk-btn').forEach(b => { b.disabled = true; });
  }
  updateProgress();
  const wrongMCQ = [];
  QUESTIONS.forEach((it, qi) => { if(it.type !== '단답' && GRADED[qi] && selected[qi] !== it.answer) wrongMCQ.push(qi); });
  // 모르겠음(무답)은 원인 자동 진단: 개념부재 — 본인이 이미 "모른다"고 선언한 것이라 다시 묻지 않는다
  wrongMCQ.forEach(qi => { if(selected[qi] === 'DK') mcqDiag[qi] = { cause: '개념부재' }; });
  const needDiag = wrongMCQ.filter(qi => selected[qi] !== 'DK' && !(mcqDiag[qi] && mcqDiag[qi].cause));
  DIAG_SAVED = false;
  const oldSave = document.getElementById('diagSave');
  if(oldSave) oldSave.remove();
  if(needDiag.length === 0){
    if(wrongMCQ.length > 0){ diagPending = wrongMCQ; attachCauses(built.payload); }
    document.getElementById('copyBtn').classList.add('show');
    // 결과 자동 다운로드 (수거·원장 갱신이 읽는 파일)
    downloadResult(built.payload);
    afterSave(isPartial);
  } else {
    // ── 오답 원인 진단 게이트: 원인을 다 골라야 저장된다 ──
    diagPending = wrongMCQ;
    needDiag.forEach(qi => {
      if(document.getElementById('diag-' + qi)) return;    // 앞 라운드에 이미 열린 진단은 그대로 둔다
      const ex = document.getElementById('expl-' + qi);
      if(ex) ex.insertAdjacentElement('afterend', makeDiag(qi));
    });
    const dn = document.getElementById('dlnote');
    dn.textContent = '⚠️ 아직 저장 전 — 틀린 문제(빨간 칸)마다 원인을 고르고 아래 버튼으로 저장하세요';
    const bd = document.createElement('button');
    bd.type = 'button'; bd.className = 'copybtn show'; bd.id = 'diagSave'; bd.disabled = true;
    bd.addEventListener('click', () => {
      if(DIAG_SAVED || !diagDone()) return;
      DIAG_SAVED = true;
      attachCauses(LAST_PAYLOAD);
      document.getElementById('copyBtn').classList.add('show');
      downloadResult(LAST_PAYLOAD);
      document.querySelectorAll('.mcq-diag').forEach(x => x.classList.add('done'));
      document.querySelectorAll('.mcq-diag .dmemo').forEach(x => { x.disabled = true; });
      document.querySelectorAll('.mcq-diag .sa-chip').forEach(x => { x.style.cursor = 'default'; });
      bd.textContent = '✅ 진단 저장됨'; bd.disabled = true;
      afterSave(isPartial);
    });
    dn.insertAdjacentElement('afterend', bd);
    diagUpdate();
  }

  r.scrollIntoView({behavior:'smooth', block:'center'});
}
// 저장(다운로드)이 끝난 시점 — 전체 제출이면 진행 저장분을 버리고, 중간 제출이면 이어서 풀 수 있게 남긴다
function afterSave(isPartial){
  if(isPartial){ saveProgress(); return; }
  clearProgress();
  SAVE_ON = false;
}

function downloadResult(payload){
  try{
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${RESULT_PREFIX}${QUIZ_DATE}${QUIZ_ID_SUFFIX}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    document.getElementById('dlnote').textContent =
      payload.wrongCount>0 ? `💾 결과 저장됨(오답 ${payload.wrongCount}개) — 다운로드 폴더 확인` : "💾 만점 기록 저장됨";
  }catch(e){
    document.getElementById('dlnote').textContent = "⚠️ 자동 저장 실패 — 아래 '결과 JSON 복사'를 눌러 수동 저장";
  }
}

function msgFor(s, tot){
  const t = tot || QUESTIONS.length;   // 중간 제출이면 '답한 문항 수'가 분모
  const r = s/t;
  if(s===t)   return RESULT_MSGS[0];
  if(r>=0.8)  return RESULT_MSGS[1];
  if(r>=0.6)  return RESULT_MSGS[2];
  if(r>=0.4)  return RESULT_MSGS[3];
  return RESULT_MSGS[4];
}

/*__RESTORE_START__*/
// ── 저장분 복원 — 답·마킹·진단·중간제출 채점 상태를 되살린다 ────────
function restoreProgress(){
  const st = loadProgress();
  if(!st) return 0;
  try{
    st.sel.forEach((s, qi)=>{
      if(s === null || s === undefined) return;
      if(RESTORERS[qi]) RESTORERS[qi](s);
    });
    Object.keys(st.optMarks || {}).forEach(qi=>{
      const card = document.getElementById('card-' + qi);
      if(!card) return;
      const btns = card.querySelectorAll('.optox');
      (st.optMarks[qi] || []).forEach((v, i)=>{ if(btns[i] && v) setOptMark(btns[i].closest('.opt'), btns[i], v); });
    });
    Object.keys(st.oxMarks || {}).forEach(qi=>{
      const card = document.getElementById('card-' + qi);
      if(!card) return;
      const btns = card.querySelectorAll('.ox-mark');
      (st.oxMarks[qi] || []).forEach((v, i)=>{ if(btns[i] && v) setOxMark(btns[i], v); });
    });
    Object.keys(st.diag || {}).forEach(qi=>{ mcqDiag[qi] = st.diag[qi]; });
    PARTIAL_DONE = !!st.partialDone;
    (st.gradedIdx || []).forEach(qi=>{
      if(!QUESTIONS[qi] || !isAnswered(qi)) return;
      GRADED[qi] = true;
      applyGrade(qi);
      if(QUESTIONS[qi].type !== '단답' && selected[qi] !== 'DK' && selected[qi] !== QUESTIONS[qi].answer) restoreDiagBox(qi);
    });
    if(PARTIAL_DONE) QUESTIONS.forEach((q, qi)=>{ if(!GRADED[qi] && !isAnswered(qi)) markSkipped(qi); });
  }catch(e){ return 0; }
  return answeredCount();
}
(function(){
  const n = restoreProgress();
  SAVE_ON = true;
  updateProgress();
  if(!n) return;
  const bar = document.getElementById('restoreBar');
  if(!bar) return;
  bar.innerHTML = '<b>↩ 이전 진행 복원됨</b> — 답 ' + n + '개 · <a id="restoreReset" href="javascript:void(0)">처음부터 다시</a>';
  bar.hidden = false;
  const a = document.getElementById('restoreReset');
  if(a) a.addEventListener('click', (ev)=>{
    ev.preventDefault();
    SAVE_ON = false;
    clearProgress();
    try{ location.reload(); }catch(e){}
  });
})();
/*__RESTORE_END__*/
</script>
