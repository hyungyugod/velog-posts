const QUIZ_DATE = "2026-07-27";
const QUESTIONS = [
/*__QUESTIONS_START__*/
  {"type":"일반","cat":"부동산학개론","q":"🔁 주택시장의 하향여과와 주거분리에 관한 설명으로 옳은 것은?","opts":["고소득층이 사용하던 주택이 저소득층에게 이전되어 사용되면 하향여과가 일어난 것이다.","하향여과가 일어나면 저소득층이 사용할 수 있는 주택의 양은 오히려 줄어든다.","고소득층 주거지역과 저소득층 주거지역의 경계에 있는 고소득층 주택은 정(+)의 외부효과를 받아 할증되어 거래된다.","주거분리는 정부가 소득계층별로 주택을 배분하는 정책을 시행할 때에만 나타나는 현상이다."],"answer":0,"expl":"하향여과는 상위계층이 쓰던 주택이 아래로 내려와 사용되는 흐름이다. 주택은 오래 남는 재화라 신규공급 대신 기존 재고가 계층 사이를 이동하며 배분되기 때문이다. 경계지역에서 할증되는 쪽은 저소득층 주택이고 고소득층 주택은 할인된다는 방향을 뒤집은 것이 함정이다.","src":"2026-07-22 부동산학개론 여과·주거분리 (재도전)","conceptKey":"부동산학개론 §2 여과·주거분리","retryOf":"부동산학개론 §2 여과·주거분리"},
  {"type":"계산","cat":"부동산학개론","q":"🔁 어느 지역 주택시장의 수요함수와 공급함수가 아래와 같을 때 균형가격은? (다른 조건은 동일)<br>· 수요함수: Qd = 400 − 2P<br>· 공급함수: Qs = 100 + 4P","opts":["40","45","50","60"],"answer":2,"expl":"400 − 2P = 100 + 4P에서 300 = 6P, 즉 P = 50이다. 거미집모형에서는 공급의 시차 때문에 이 균형에 곧바로 머무르지 않고 가격이 진동하는데, 수요곡선 기울기의 절댓값(1/2)이 공급곡선 기울기의 절댓값(1/4)보다 커서 발산형이 된다. 함수의 계수 2·4를 그대로 기울기로 읽으면 유형 판정이 뒤집힌다.","src":"2026-07-22 부동산학개론 거미집이론 (재도전)","conceptKey":"부동산학개론 §1 거미집이론","retryOf":"부동산학개론 §1 거미집이론","calc":{"expr":"(400-100)/(2+4)","expected":50}},
  {"type":"일반","cat":"부동산학개론","q":"부동산학개론상 투자수익률의 종류와 위험에 관한 설명으로 <b>옳지 않은</b> 것은?","opts":["요구수익률과 기대수익률은 모두 투자 이전에 판단되는 사전수익률이다.","실현수익률은 사후수익률이지만 기대수익률과 비교하여 투자 여부를 결정하는 기준이 된다.","부동산의 개별성에서 비롯되는 개별자산위험은 비체계적 위험에 해당한다.","경기변동이나 금리처럼 시장 전체에 걸리는 요인에서 오는 위험은 분산투자로 제거되지 않는다."],"answer":1,"expl":"실현수익률은 결과가 나온 뒤의 값이라 투자 시점의 판단 기준이 될 수 없다. 기대수익률과 요구수익률이 모두 사전 개념이어서 비교가 가능한 것이다. 사후 개념을 판단기준 자리에 끼워 넣어 사전·사후의 층위를 섞은 것이 함정이다.","src":"2026-07-22 부동산학개론 1-1 수익률과 위험","conceptKey":"부동산학개론 1-1 수익률·위험 분류"},
  {"type":"조합","cat":"부동산학개론","q":"부동산학개론상 정부의 시장개입 방식 중 직접개입에 해당하는 것을 모두 고른 것은?<br>ㄱ. 토지비축(토지은행)제도<br>ㄴ. 공영개발사업<br>ㄷ. 부동산가격공시제도<br>ㄹ. 토지의 선매","opts":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ"],"answer":3,"expl":"정부가 스스로 토지를 사고팔거나 개발주체가 되는 토지비축·공영개발·선매가 직접개입이다. 정부가 거래당사자로 시장에 들어가기 때문이다. 가격공시제도(ㄷ)는 정보를 제공해 참여자의 판단에만 영향을 주므로 간접개입이라는 점이 함정이다.","src":"2026-07-22 부동산학개론 1-2 정책론","conceptKey":"부동산학개론 1-2 직접·간접개입 구분"},
  {"type":"사례","cat":"부동산학개론","q":"갑은 A오피스텔 투자를 검토하고 있다. 갑이 요구하는 수익률은 연 8%이고 시장분석 결과 예상되는 수익률은 연 10%였으며, 1년 뒤 실제로 달성된 수익률은 연 6%였다. 이에 관한 설명으로 옳은 것은? (다른 조건은 동일)","opts":["투자 시점에는 기대수익률 10%가 요구수익률 8%보다 높으므로 갑은 투자를 선택하게 된다.","투자 여부의 판단은 실현수익률 6%와 요구수익률 8%를 비교하여 이루어진다.","요구수익률 8%는 투자가 종료된 뒤에야 확정되는 사후수익률에 해당한다.","실현수익률이 요구수익률에 미치지 못하였으므로 갑의 사전적 투자결정 자체가 잘못된 것이 된다."],"answer":0,"expl":"투자 판단은 사전 개념인 기대수익률과 요구수익률의 대소로만 이루어진다. 실현수익률은 사후에 확정되어 판단 시점에는 존재하지 않기 때문이다. 결과가 나빴다는 사정으로 사전 판단의 옳고 그름을 되짚는 것이 대표적 함정이다.","src":"2026-07-22 부동산학개론 1-1 수익률과 위험","conceptKey":"부동산학개론 1-1 사전·사후수익률 적용"},
  {"type":"OX","cat":"부동산학개론","q":"부동산학개론상 약성 효율적 시장에서는 과거의 가격 추세를 분석하는 기술적 분석만으로도 초과이윤을 얻을 수 있다. (O/X)","opts":["O","X"],"answer":1,"expl":"X. 약성 효율적 시장에서는 과거 정보가 이미 가격에 반영되어 있어 기술적 분석으로는 초과이윤을 얻을 수 없다. 반영이 끝난 정보에는 더 이상 남은 이득이 없기 때문이다. 이 시장에서 초과이윤이 가능한 것은 현재 공표된 정보나 미공개 정보를 이용하는 경우다.","src":"2026-07-22 부동산학개론 1-3 시장론","conceptKey":"부동산학개론 1-3 약성 효율적 시장"},
  {"type":"일반","cat":"부동산공시법","q":"🔁 토지소유자의 신청에 따라 지적공부의 등록사항을 정정하는 경우 그 절차와 첨부서류에 관한 설명으로 옳은 것은?","opts":["인접 토지의 경계가 변경되는 정정이라도 지적측량성과도만 제출하면 충분하고 인접 토지소유자의 승낙서를 별도로 받을 필요는 없다.","정정으로 인접 토지의 경계가 변경되면 인접 토지소유자의 승낙서만 인정되고 확정판결서 정본으로는 이를 갈음할 수 없다.","인접 토지의 경계가 변경되면 인접 토지소유자의 승낙서 또는 확정판결서 정본을 첨부하여야 한다.","등록사항의 정정은 토지소유자만 신청할 수 있고 지적소관청이 직권으로 정정할 수는 없다."],"answer":2,"expl":"경계가 실제로 움직이는 정정은 옆 땅 주인의 권리에 직접 영향을 주므로 승낙서나 이를 대신할 확정판결서 정본이 필요하다. 공부 정리를 이유로 남의 권리를 침해할 수 없기 때문이다. 승낙서 외의 길을 막거나 직권정정 자체를 부정하는 것이 함정이다.","src":"2026-07-23 부동산공시법 등록사항정정 (재도전)","conceptKey":"부동산공시법 §1 등록사항정정","retryOf":"부동산공시법 §1 등록사항정정"},
  {"type":"일반","cat":"부동산공시법","q":"공간정보관리법령상 지적공부의 복구와 지적전산자료의 이용에 관한 설명으로 <b>옳지 않은</b> 것은?","opts":["지적공부가 멸실된 경우 그 회복등록은 토지소유자가 신청하여 직접 하여야 한다.","멸실된 지적공부의 복구는 지적소관청이 하여야 한다.","시·군·구 단위의 지적전산자료를 이용하려는 자는 원칙적으로 관계 중앙행정기관의 심사를 거쳐야 한다.","시·군·구 단위의 지적전산자료는 지적소관청에 신청하여야 한다."],"answer":0,"expl":"지적공부의 복구는 국가가 관리하는 공적 장부를 되살리는 일이라 지적소관청이 한다. 공부의 진정성을 사인의 신청에 맡길 수 없기 때문이다. 소유자 신청으로 움직이는 토지이동 절차와 복구를 같은 층위로 묶는 것이 함정이다.","src":"2026-07-23 부동산공시법 1-1 지적공부","conceptKey":"부동산공시법 1-1 지적공부 복구·전산자료"},
  {"type":"일반","cat":"부동산공시법","q":"공간정보관리법령상 부동산종합공부에 관한 설명으로 <b>옳지 않은</b> 것은?","opts":["부동산종합공부의 토지의 이용 및 규제에 관한 사항은 토지이용계획확인서의 내용을 그대로 옮겨 등록한 것이다.","토지소유자가 부동산종합공부의 등록사항에 잘못이 있음을 발견하면 지적소관청에 그 정정을 신청할 수 있다.","지적소관청이 등록사항의 불일치를 발견하면 그 등록사항을 관리하는 기관의 장에게 통지하고 정정을 요청하여야 한다.","토지소유자가 등록사항의 잘못을 발견한 경우에는 그 등록사항을 관리하는 기관의 장에게 직접 정정을 신청하여야 한다."],"answer":3,"expl":"소유자에게는 지적소관청이라는 단일 창구만 열려 있다. 여러 기관의 자료를 모아 만든 공부라 개인이 관리기관을 일일이 찾아다니게 할 수 없기 때문이다. 관리기관에 통지하고 정정을 요청하는 일은 지적소관청의 몫이라는 주체 분기가 함정이다.","src":"2026-07-23 부동산공시법 1-2 부동산종합공부","conceptKey":"부동산공시법 1-2 부동산종합공부 정정"},
  {"type":"일반","cat":"부동산공시법","q":"공간정보관리법령상 지목의 판단에 관한 설명으로 옳은 것은?","opts":["습지와 황무지는 이용가치가 낮으므로 그 지목을 잡종지로 한다.","건축물이 없더라도 택지조성공사가 준공된 토지의 지목은 대(垈)로 한다.","노상주차장으로 사용되고 있는 토지의 지목은 주차장으로 한다.","실내수영장과 체육도장으로 사용되고 있는 토지의 지목은 체육용지로 한다."],"answer":1,"expl":"택지조성이 끝난 땅은 곧 건물이 들어설 자리이므로 건물이 아직 없어도 대로 본다. 지목은 현재 모습만이 아니라 확정된 이용 목적을 따라가기 때문이다. 암석지·자갈땅·모래땅·습지·황무지가 잡종지가 아니라 임야라는 점이 대표적 함정이다.","src":"2026-07-18 부동산공시법 1-4 지목 판단","conceptKey":"부동산공시법 1-4 지목 판단"},
  {"type":"조합","cat":"부동산공시법","q":"공간정보관리법령상 등기가 되어 있어도 합병신청을 할 수 있는 등기를 모두 고른 것은?<br>ㄱ. 등기원인 및 그 연월일과 접수번호가 같은 저당권의 등기<br>ㄴ. 합병하려는 토지 전부에 대한 신탁등기<br>ㄷ. 등기원인 및 그 연월일과 접수번호가 같은 가압류등기<br>ㄹ. 소유권·지상권·전세권의 등기","opts":["ㄱ, ㄴ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":2,"expl":"합병이 가능한 것은 소유·용익관계 등기와 저당권·신탁등기다. 필지가 하나로 합쳐져도 권리관계를 공부에 그대로 표시할 수 있기 때문이다. 가압류는 등기원인과 접수번호가 같아도 합병할 수 없다는 점이 함정이다.","src":"2026-07-23 부동산공시법 1-5 합병","conceptKey":"부동산공시법 1-5 합병 가능 등기"},
  {"type":"조합","cat":"부동산공시법","q":"공간정보관리법령상 경계점좌표등록부를 갖춰 두는 지역에 관한 내용으로 옳은 것을 모두 고른 것은?<br>ㄱ. 면적측정은 좌표면적계산법으로 한다<br>ㄴ. 토지를 측량하려는 경우에는 경위의측량방법에 의한다<br>ㄷ. 경계점좌표등록부는 한 필지 단위로 작성한다<br>ㄹ. 면적측정은 전자면적측정기에 의한 방법으로만 한다","opts":["ㄱ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ"],"answer":3,"expl":"좌표로 경계를 관리하는 지역이므로 면적은 좌표면적계산법으로, 측량은 경위의측량방법으로 한다. 좌표를 얻어야 하는 지역이라 도해측량으로는 정밀도를 맞출 수 없기 때문이다. 도해지역에서 쓰는 전자면적측정기를 끼워 넣은 것이 함정이다.","src":"2026-07-23 부동산공시법 1-6 지적측량 방법","conceptKey":"부동산공시법 1-6 경계점좌표등록부 지역 측량"},
  {"type":"OX","cat":"부동산공시법","q":"공간정보관리법령상 지상경계점등록부에는 지적기준점의 위치에 관한 사항을 등록하지 아니한다. (O/X)","opts":["O","X"],"answer":0,"expl":"O. 지상경계점등록부의 주인공은 경계점이므로 위치를 정밀하게 기록하는 대상도 경계점뿐이다. 경계 확인을 위한 장부라 기준점 관리 정보는 다른 공부의 몫이기 때문이다. 지적기준점 위치처럼 지적공부 쪽 항목을 끌어와 섞는 것이 함정이다.","src":"2026-07-18 부동산공시법 1-6 지상경계점등록부","conceptKey":"부동산공시법 1-6 지상경계점등록부 등록사항"},
  {"type":"일반","cat":"부동산세법","q":"지방세법령상 취득세의 납세의무자에 관한 설명으로 <b>옳지 않은</b> 것은?","opts":["임차인이 건물에 승강기를 설치한 경우 그 취득세는 주체구조부취득자인 임대인이 납부할 의무를 진다.","채권자가 채무자의 미등기 부동산을 대위등기한 경우 그 취득세의 납세의무자는 대위등기를 한 채권자이다.","상속인이 유증을 받은 경우에는 상속으로 보아 취득세 납세의무를 진다.","법인의 감자로 지분비율이 높아져 과점주주가 된 경우에는 취득세를 부과하지 아니한다."],"answer":1,"expl":"대위등기를 해도 부동산의 주인은 채무자이므로 납세의무자는 채무자다. 취득세는 등기를 누가 했는지가 아니라 누가 취득했는지로 걸리기 때문이다. 채권자가 대신 납부할 수 있다는 절차와 납세의무자 자체를 혼동하는 것이 함정이다.","src":"2026-07-19 부동산세법 2 납세의무자","conceptKey":"부동산세법 2 납세의무자 특례"},
  {"type":"일반","cat":"부동산세법","q":"지방세법령상 취득의 시기에 관한 설명으로 옳은 것은?","opts":["토지의 지목변경에 따른 취득시기는 언제나 공부상 지목이 변경된 날로 한다.","경계의 확정으로 지적공부상 면적이 증가한 경우 그 증가된 부분은 확정일에 새로 취득한 것으로 본다.","점유로 인한 취득의 경우 취득세와 양도소득세 모두 점유를 개시한 날을 취득시기로 본다.","토지의 지목변경에 따른 취득시기는 사실상 변경된 날과 공부상 변경된 날 중 빠른 날로 한다."],"answer":3,"expl":"지목변경은 사실상 변경일과 공부상 변경일 중 빠른 날을 취득시기로 잡는다. 실질과 형식 중 먼저 도달한 시점에 담세력이 생겼다고 보기 때문이다. 둘 중 하나로 고정하거나 경계확정 증가분을 새로운 취득으로 보아 종전 토지 취득일 원칙을 뒤집는 것이 함정이다.","src":"2026-07-25 부동산세법 1-4 취득시기","conceptKey":"부동산세법 1-4 취득시기 판정"},
  {"type":"일반","cat":"부동산세법","q":"지방세법령상 취득세의 비과세와 세율 특례에 관한 설명으로 <b>옳지 않은</b> 것은?","opts":["신탁으로 인한 재산권의 취득은 주택조합이나 명의신탁이 개입된 경우에도 언제나 비과세한다.","국가가 부동산을 취득하는 경우에는 취득세를 부과하지 아니한다.","가액의 증가가 없는 건축물의 이전이라도 취득세를 부과한다.","지적공부상 지목이 묘지인 토지는 취득세를 부과하되 그 등기에 대한 등록면허세는 비과세한다."],"answer":0,"expl":"신탁 비과세는 형식만 옮겨가는 이전을 배려한 것이라, 조합이나 명의신탁이 끼어 실질적 이익이 오가면 과세로 뒤집힌다. 비과세를 조세회피 통로로 쓰지 못하게 막으려는 취지다. 언제나라는 말로 예외를 지운 것이 함정이다.","src":"2026-07-19 부동산세법 5 비과세","conceptKey":"부동산세법 5 비과세·세율특례"},
  {"type":"일반","cat":"부동산세법","q":"지방세법령상 취득세 및 등록면허세의 납세절차에 관한 설명으로 <b>옳지 않은</b> 것은?","opts":["법정신고기한까지 과세표준 신고서를 제출하지 아니한 자는 기한 후 신고서를 제출할 수 있다.","등록면허세는 신고의무를 이행하지 아니하였더라도 등록하기 전까지 납부하면 무신고가산세를 부과하지 아니한다.","토지의 지목변경은 과세물건을 신고하지 아니하고 매각한 경우의 가산세 대상에 그대로 포함된다.","등기·등록관서의 장은 등록면허세의 미납부액이나 납부부족액을 다음 달 10일까지 통보하여야 한다."],"answer":2,"expl":"지목변경은 신고하지 않고 매각한 경우의 중가산세에서 원래 제외되는 물건이다. 등기·등록이 따르지 않아 매각 과정에서 과세자료가 드러나는 구조가 아니기 때문이다. 제외 대상을 포함으로 뒤집어 놓은 것이 함정이다.","src":"2026-07-25 부동산세법 1-5 취득세 납세절차","conceptKey":"부동산세법 1-5 납세절차·가산세"},
  {"type":"조합","cat":"부동산세법","q":"지방세법령상 취득세의 세율 및 중과세에 관한 내용으로 옳은 것을 모두 고른 것은?<br>ㄱ. 회원제 골프장은 승계취득하는 경우에도 중과세한다<br>ㄴ. 휴면법인을 인수하는 것도 대도시에서의 법인 설립에 포함하여 중과세한다<br>ㄷ. 건축이나 개수로 건축물의 면적이 증가한 부분은 신축·재축이 아니어도 원시취득으로 본다<br>ㄹ. 주택을 신축한 자가 그 부속토지를 나중에 취득하면 주택에 대한 세율을 적용한다","opts":["ㄱ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":1,"expl":"ㄹ은 주택 세율이 아니라 부속토지에 대한 세율을 적용한다. 주택에 대한 세율은 건물과 부속토지를 함께 취득하는 경우를 전제로 하기 때문이다. 승계취득 골프장 중과·휴면법인 인수·면적 증가분 원시취득은 모두 회피 통로를 막는 규정이다.","src":"2026-07-25 부동산세법 1-1·1-2 원시취득·중과세","conceptKey":"부동산세법 1-2 중과세·원시취득 범위"},
  {"type":"계산","cat":"부동산세법","q":"지방세법령상 갑이 A시와 B시에 걸쳐 있는 하나의 토지를 20억원에 취득하였다. 아래 조건에서 A시에 납부할 취득세의 과세표준은? (다른 조건은 동일)<br>· A시 소재 부분의 시가표준액: 6억원<br>· B시 소재 부분의 시가표준액: 4억원","opts":["8억원","10억원","11억원","12억원"],"answer":3,"expl":"취득 당시의 가액 20억원을 소재지별 시가표준액 비율 6대 4로 나누므로 A시분은 20억원 × 0.6 = 12억원이다. 하나의 물건이 여러 지자체에 걸치면 각 지자체가 자기 몫만 과세해야 하기 때문이다. 절반으로 나누거나 면적 비율로 나누면 틀린다.","src":"2026-07-25 부동산세법 1-4 과세표준","conceptKey":"부동산세법 1-4 시군구 걸친 물건 안분","calc":{"expr":"2000000000*6/(6+4)","expected":1200000000}},
  {"type":"OX","cat":"부동산세법","q":"지방세법령상 취득세의 과세표준을 계산할 때 부가가치세는 과세표준에 포함하지 아니한다. (O/X)","opts":["O","X"],"answer":0,"expl":"O. 부가가치세는 거래에 얹힌 별도의 세금이라 취득가액의 일부로 보지 않는다. 세금 위에 다시 세금을 매기는 결과를 피하려는 취지다. 취득에 든 돈이라는 이유로 부가가치세까지 끌어와 과세표준을 부풀리면 틀린다.","src":"2026-07-19 부동산세법 8 과세표준","conceptKey":"부동산세법 8 과세표준 원칙"},
  {"type":"일반","cat":"민법","q":"민법상 강박에 의한 의사표시에 관한 설명으로 <b>옳지 않은</b> 것은? (다툼이 있으면 판례에 따름)","opts":["강박으로 의사결정의 자유가 완전히 박탈된 상태에서 한 의사표시는 무효이다.","의사결정의 자유가 완전히 박탈되지 아니한 정도의 강박에 의한 의사표시는 취소할 수 있다.","강박행위의 주체가 국가 공권력이고 그 내용이 기본권을 침해하는 정도라면 그 의사표시는 곧바로 무효가 된다.","강박을 이유로 한 의사표시의 취소는 선의의 제3자에게 대항하지 못한다."],"answer":2,"expl":"공권력에 의한 강박이라도 선택의 여지가 남아 있다면 자유가 완전히 박탈된 것이 아니어서 무효가 아니라 취소사유에 그친다. 무효는 의사 자체가 없다고 볼 극단적 경우에만 인정되기 때문이다. 강박 주체의 위압적 성격만 보고 무효로 밀어 올리는 것이 함정이다.","src":"2026-07-20 민법 1-1 사기·강박","conceptKey":"민법 1-1 강박의 무효·취소 경계"},
  {"type":"일반","cat":"민법","q":"민법상 제3자의 사기·강박에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","opts":["상대방이 제3자의 사기 사실을 알지 못하였으나 알 수 있었던 경우에도 표의자는 그 의사표시를 취소할 수 없다.","상대방의 피용자가 사기를 행한 경우 그 피용자는 제3자에 해당한다.","상대방의 대리인이 사기를 행한 경우 그 대리인은 제3자에 해당한다.","제3자의 사기를 이유로 한 취소는 선의의 제3자에게도 대항할 수 있다."],"answer":1,"expl":"피용자는 상대방 본인이 아니므로 제3자로 취급되어 상대방의 선의·무과실이 따로 문제된다. 반면 대리인은 상대방과 한 몸으로 다루어지는 당사자다. 상대방에게는 선의에 더해 무과실까지 요구되므로 알 수 있었던 경우에는 취소할 수 있다는 점이 함정이다.","src":"2026-07-20 민법 1-1 제3자의 사기·강박","conceptKey":"민법 1-1 제3자 사기의 범위"},
  {"type":"일반","cat":"민법","q":"민법상 대리권의 소멸과 복대리에 관한 설명으로 <b>옳지 않은</b> 것은?","opts":["대리인에 대한 한정후견개시의 심판은 임의대리권과 법정대리권의 공통된 소멸사유이다.","대리인에 대한 성년후견개시의 심판은 대리권의 소멸사유이다.","복대리인은 대리인이 자기의 이름으로 선임하지만 본인을 대리한다.","임의대리인은 본인의 승낙이 있거나 부득이한 사유가 있는 때에만 복대리인을 선임할 수 있다."],"answer":0,"expl":"대리권 소멸사유로 규정된 것은 성년후견의 개시이고 한정후견은 여기에 들어가지 않는다. 판단능력이 지속적으로 결여된 경우에만 대리를 계속 맡길 수 없다고 보기 때문이다. 후견의 유형만 바꿔 넣어 소멸사유를 넓히는 것이 대표적 함정이다.","src":"2026-07-20 민법 1-3 대리권의 범위와 소멸","conceptKey":"민법 1-3 대리권 소멸사유"},
  {"type":"조합","cat":"민법","q":"민법상 표현대리에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)<br>ㄱ. 표현대리가 성립하여도 그 행위의 성질은 여전히 무권대리이다<br>ㄴ. 유권대리를 주장한 가운데 표현대리의 주장이 포함되어 있는 것은 아니다<br>ㄷ. 표현대리가 성립하면 본인의 책임은 상대방의 과실에 따라 과실상계로 감경된다<br>ㄹ. 대리인이 선임한 복대리인의 행위에 대해서도 표현대리가 성립할 수 있다","opts":["ㄱ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ"],"answer":3,"expl":"표현대리는 무권대리인 채로 상대방에게 선택권을 주는 제도라 과실상계 법리가 끼어들지 않는다. 본인의 책임을 인정할지 말지를 상대방이 고르는 구조여서 책임을 비율로 나눌 자리가 없기 때문이다. 과실상계를 끌어들인 ㄷ이 함정이다.","src":"2026-07-20 민법 1-6 표현대리","conceptKey":"민법 1-6 표현대리의 본질"},
  {"type":"사례","cat":"민법","q":"을은 대리권 없이 아버지 갑을 대리하여 갑 소유의 X토지를 병에게 매도하였다. 그 후 갑이 추인도 거절도 하지 아니한 채 사망하여 을이 갑을 단독으로 상속하였다. 이에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","opts":["을은 상속인의 지위에서 추인을 거절할 수 있고 이는 신의칙에 반하지 아니한다.","상속으로 본인의 지위와 무권대리인의 지위가 합쳐지므로 매매계약은 처음부터 무효가 된다.","을이 상속인의 지위에서 추인을 거절하는 것은 신의칙상 허용되지 아니한다.","병이 을에게 대리권이 없음을 알았더라도 을은 민법 제135조의 무권대리인의 책임을 진다."],"answer":2,"expl":"스스로 계약의 효력을 만들려 했던 자가 본인 자리에 올라선 뒤 이를 뒤집는 것은 앞선 행동과 모순되어 신의칙상 허용되지 않는다. 상대방의 신뢰를 자기 손으로 만들어 놓았기 때문이다. 상대방이 악의라면 무권대리인의 책임은 면제된다는 점도 함께 봐야 한다.","src":"2026-07-20 민법 1-5 무권대리","conceptKey":"민법 1-5 무권대리인의 본인 상속"},
  {"type":"사례","cat":"민법","q":"갑은 을의 기망에 넘어가 을이 내민 서류에 서명하였다. 갑은 자신이 서명하려던 문서에 서명한다고 믿었으나 실제로는 내용이 전혀 다른 문서였다. 이에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","opts":["갑은 사기를 이유로 취소할 수는 없고 착오를 이유로 취소할 수 있을 뿐이다.","갑은 사기를 이유로만 취소할 수 있고 착오취소는 문제되지 아니한다.","갑은 사기와 착오 중 어느 것으로도 취소할 수 없고 계약의 무효를 주장하여야 한다.","을에게 갑의 재산을 침해하려는 고의가 없었다면 갑은 착오를 이유로도 취소할 수 없다."],"answer":0,"expl":"의사표시의 내용 자체를 다르게 하려던 것이 아니라 서명할 문서를 잘못 안 것이므로 표시상의 착오이지 사기취소의 문제가 아니다. 기망이 있었더라도 그 결과가 착오의 형태로 나타났기 때문이다. 기망이 있으면 곧 사기취소라고 반사적으로 답하는 것이 함정이다.","src":"2026-07-20 민법 1-1 사기취소와 착오취소","conceptKey":"민법 1-1 기망에 의한 표시상 착오"},
  {"type":"일반","cat":"부동산공법","q":"🔁 국토의 계획 및 이용에 관한 법률상 개발행위허가를 제한할 수 있는 지역에 관한 설명으로 옳은 것은?","opts":["개발행위허가의 제한은 도시·군관리계획이 이미 결정된 지역에 대해서만 할 수 있다.","녹지지역이나 계획관리지역으로서 조수류 등이 집단으로 서식하고 있는 지역은 개발행위허가를 제한할 수 있다.","개발행위허가의 제한기간은 어떠한 경우에도 연장할 수 없다.","개발행위허가를 제한하려는 자는 중앙도시계획위원회나 지방도시계획위원회의 심의를 거치지 아니한다."],"answer":1,"expl":"생태적 보전가치가 큰 녹지지역·계획관리지역은 난개발이 한 번 일어나면 되돌릴 수 없어 제한 대상으로 열거되어 있다. 제한은 도시계획위원회 심의를 거쳐야 하고 일정한 지역은 연장도 가능하므로 절차와 기간이 모두 통제된다는 점을 함께 봐야 한다.","src":"2026-07-21 부동산공법 개발행위허가 제한 (재도전)","conceptKey":"부동산공법 개발행위허가 제한","retryOf":"부동산공법 개발행위허가 제한"},
  {"type":"일반","cat":"부동산공법","q":"국토의 계획 및 이용에 관한 법률상 용도구역에 관한 설명으로 <b>옳지 않은</b> 것은?","opts":["시가화조정구역에서 도시·군계획사업은 허가를 받지 아니하고 시행할 수 있다.","도시혁신구역으로 지정된 지역은 건축법에 따른 특별건축구역으로 지정된 것으로 본다.","도시·군계획시설의 준공 후 10년이 지난 경우 그 토지의 전부 또는 일부를 입체복합구역으로 지정할 수 있다.","용도구역 중 국방상 또는 보안상 필요를 이유로 지정할 수 있는 것은 시가화조정구역이다."],"answer":3,"expl":"보안과 국방을 지정사유로 삼는 용도구역은 개발제한구역이다. 도시의 무질서한 확산 방지와 함께 보안상 필요가 명문으로 붙어 있기 때문이다. 시가화조정구역은 단계적 개발 유보가 목적이라 보안이라는 말이 나오면 틀린 지문이 된다.","src":"2026-07-21 부동산공법 1-5 용도구역","conceptKey":"부동산공법 1-5 용도구역 지정사유"},
  {"type":"일반","cat":"부동산공법","q":"국토의 계획 및 이용에 관한 법률상 도시·군계획시설사업의 시행에 관한 설명으로 <b>옳지 않은</b> 것은?","opts":["단계별 집행계획은 도시·군관리계획의 입안권자가 수립한다.","실시계획을 고시한 경우에는 공익사업을 위한 토지 등의 취득 및 보상에 관한 법률에 따른 사업인정 및 그 고시가 있었던 것으로 본다.","도시·군관리계획 결정의 고시가 있으면 그때부터 사업시행자는 사업구역의 토지를 수용할 수 있다.","사업시행자는 사업시행지구 밖의 토지를 수용할 수는 없으나 일시사용할 수는 있다."],"answer":2,"expl":"수용권이 열리는 스위치는 도시·군관리계획 결정고시가 아니라 실시계획 고시다. 실시계획 고시에 사업인정 의제 효과가 붙어 있기 때문이다. 결정고시 단계에서는 사업의 구체적 내용이 아직 확정되지 않아 수용을 정당화할 수 없다는 점이 함정이다.","src":"2026-07-21 부동산공법 1-7 도시·군계획시설사업","conceptKey":"부동산공법 1-7 실시계획·수용"},
  {"type":"일반","cat":"부동산공법","q":"국토의 계획 및 이용에 관한 법률상 용도지구와 그 규제에 관한 설명으로 옳은 것은?","opts":["조례로 용도지구를 세분할 수 있는 것은 경관지구, 중요시설물보호지구, 특정용도제한지구이다.","개발진흥지구 중 주민이 도시·군관리계획의 입안을 제안할 수 있는 것은 주거개발진흥지구와 관광·휴양개발진흥지구이다.","집단취락지구에서의 건축제한은 국토의 계획 및 이용에 관한 법률 시행령이 직접 정한다.","고도지구에서의 건축물 높이 규제는 지구단위계획으로 정한다."],"answer":0,"expl":"조례 세분이 열려 있는 지구는 경관·중요시설물보호·특정용도제한지구뿐이다. 지역 사정에 따라 규제 강도를 달리할 여지가 큰 지구만 지방에 재량을 준 것이다. 산업유통개발진흥지구만 주민 제안이 가능하고 집단취락지구는 개발제한구역법의 규제를 받는다는 점이 함정이다.","src":"2026-07-21 부동산공법 1-4 용도지구","conceptKey":"부동산공법 1-4 용도지구 세분·규제"},
  {"type":"조합","cat":"부동산공법","q":"🔁 국토의 계획 및 이용에 관한 법률상 공간재구조화계획으로 그 지정을 결정할 수 있는 용도구역을 모두 고른 것은?<br>ㄱ. 도시혁신구역<br>ㄴ. 복합용도구역<br>ㄷ. 도시·군계획시설입체복합구역<br>ㄹ. 시가화조정구역","opts":["ㄱ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":1,"expl":"기존 용도지역 체계를 흔들어 토지의 쓰임을 다시 짜는 세 구역만 공간재구조화계획으로 결정한다. 도시공간을 구조적으로 재편하는 계획이라는 성격 때문이다. 개발을 일정 기간 유보하는 데 그치는 시가화조정구역은 도시·군관리계획으로 결정한다는 점이 함정이다.","src":"2026-07-21 부동산공법 공간재구조화계획 (재도전)","conceptKey":"부동산공법 공간재구조화계획","retryOf":"부동산공법 공간재구조화계획"},
  {"type":"계산","cat":"부동산공법","q":"국토의 계획 및 이용에 관한 법률상 공동구 설치비용의 일부를 공동구 점용예정자가 부담하기로 하였다. 아래 조건에서 그 점용예정자가 공동구 설치공사 착수 전까지 납부하여야 하는 최소 금액은? (다른 조건은 동일)<br>· 공동구 설치비용 총액: 30억원<br>· 점용예정자의 부담액: 3억원","opts":["3천만원","5천만원","7천 5백만원","1억원"],"answer":3,"expl":"점용예정자는 부담액의 3분의 1 이상을 공사 착수 전까지 내야 하므로 3억원 ÷ 3 = 1억원이다. 공사에 들어가기 전에 재원을 확보해 두려는 취지다. 총 설치비용 30억원을 기준으로 나누면 10억원이 되어 부담액과 총액을 혼동한 답이 된다.","src":"2026-07-21 부동산공법 1-6 공동구","conceptKey":"부동산공법 1-6 공동구 비용 부담","calc":{"expr":"300000000/3","expected":100000000}},
  {"type":"OX","cat":"부동산공법","q":"도로법령상 접도구역은 도시지역 안의 도로에 대해서만 지정할 수 있다. (O/X)","opts":["O","X"],"answer":1,"expl":"X. 접도구역은 도시지역 밖에 지정하고 도시지역 안에서는 건축선 규제로 같은 목적을 달성한다. 도시지역은 이미 도로와 대지의 관계가 건축선으로 촘촘히 통제되고 있기 때문이다. 도로 구조의 파손 방지·미관 훼손 방지·교통 위험 방지가 접도구역의 법문상 목적이다.","src":"2026-07-21 부동산공법 1-3 접도구역","conceptKey":"부동산공법 1-3 접도구역 적용범위"},
  {"type":"일반","cat":"공인중개사법","q":"🔁 공인중개사법령상 업무보증의 설정과 반환에 관한 설명으로 <b>옳지 않은</b> 것은?","opts":["업무보증의 설정은 중개사무소 개설등록의 기준에 해당하므로 보증을 설정하지 아니하면 등록 자체가 거부된다.","분사무소 설치신고를 할 때에는 업무보증 설정을 증명하는 서류를 제출하여야 한다.","3개월을 초과하여 휴업한 중개업의 재개신고를 받은 등록관청은 반환이 보류된 보증을 지체 없이 반환하여야 한다.","휴업한 중개업의 재개신고는 전자문서에 의한 방법으로도 할 수 있다."],"answer":0,"expl":"보증 설정은 등록기준이 아니라 등록을 마친 뒤 업무를 개시하기 전에 갖추어야 할 사항이다. 등록 단계에서 요구하면 아직 영업도 시작하지 않은 자에게 비용을 먼저 지우게 되기 때문이다. 다만 분사무소 설치신고에서는 제출서류로 요구된다는 대비가 함정이다.","src":"2026-07-24 공인중개사법 1-3 업무보증 (재도전)","conceptKey":"공인중개사법 §1 중개보수·업무보증","retryOf":"공인중개사법 §1 중개보수·업무보증"},
  {"type":"일반","cat":"공인중개사법","q":"공인중개사법령상 중개사무소의 명칭과 표시·광고에 관한 설명으로 <b>옳지 않은</b> 것은?","opts":["개업공인중개사가 중개사무소의 옥외광고물을 반드시 설치하여야 하는 것은 아니다.","옥외광고물을 설치하는 경우에는 개업공인중개사의 성명을 표기하여야 한다.","중개대상물의 표시·광고를 하면서 중개사무소의 소재지를 빠뜨린 경우에는 업무정지처분을 받는다.","부칙상 개업공인중개사도 사무소의 명칭에 부동산중개라는 문자를 사용할 수 있다."],"answer":2,"expl":"표시·광고에 중개사무소의 명칭·소재지·연락처·성명·등록번호를 하나라도 빠뜨리면 100만원 이하의 과태료 대상이지 업무정지 사유가 아니다. 광고 표기 누락은 소비자 식별을 방해하는 정도의 위반으로 다루기 때문이다. 제재의 종류를 한 단계 올려 놓은 것이 함정이다.","src":"2026-07-24 공인중개사법 1-2 표시·광고","conceptKey":"공인중개사법 1-2 표시·광고 명시의무"},
  {"type":"일반","cat":"공인중개사법","q":"공인중개사법령상 고용인과 인장등록에 관한 설명으로 옳은 것은?","opts":["중개보조원은 고용신고를 먼저 하고 그 후에 직무교육을 받아야 한다.","중개보조원이 자신의 신분을 고지하지 아니한 경우에는 그 중개보조원만 과태료 부과대상이 된다.","소속공인중개사가 금지행위를 위반한 경우 등록관청은 개업공인중개사의 등록을 반드시 취소하여야 한다.","법인인 개업공인중개사의 인장등록은 상업등기규칙에 따른 인감증명서의 제출로 갈음한다."],"answer":3,"expl":"법인은 이미 등기소에 인감을 신고해 두었으므로 인감증명서 제출로 인장등록을 대신한다. 같은 인장을 두 번 등록시킬 실익이 없기 때문이다. 고용은 교육을 마친 뒤에 신고하는 순서이고 고지의무 위반은 개업공인중개사도 함께 과태료 대상이라는 점이 함정이다.","src":"2026-07-24 공인중개사법 1-5 고용인·인장","conceptKey":"공인중개사법 1-5 고용인·인장등록"},
  {"type":"일반","cat":"공인중개사법","q":"공인중개사법령상 중개계약에 관한 설명으로 <b>옳지 않은</b> 것은?","opts":["전속중개계약의 유효기간은 원칙적으로 3개월로 하며 그 계약서는 3년간 보존하여야 한다.","일반중개계약서를 작성한 개업공인중개사는 그 계약서를 3년간 보존하여야 한다.","전속중개계약을 체결한 개업공인중개사는 체결일부터 7일 이내에 부동산거래정보망 또는 일간신문에 중개대상물에 관한 정보를 공개하여야 한다.","유효기간·중개보수·손해배상책임은 일반중개계약서와 전속중개계약서에 공통으로 들어가는 사항이다."],"answer":1,"expl":"보존의무가 붙는 것은 전속중개계약서뿐이고 일반중개계약서에는 그런 의무가 없다. 전속은 의뢰인의 선택권을 묶어두는 대가로 개업공인중개사에게 공개·보존 의무를 지우는 구조이기 때문이다. 두 계약서의 의무를 같은 무게로 묶는 것이 함정이다.","src":"2026-07-24 공인중개사법 1-7 중개계약","conceptKey":"공인중개사법 1-7 일반·전속중개계약"},
  {"type":"조합","cat":"공인중개사법","q":"부동산 거래신고 등에 관한 법령상 외국인등의 부동산 취득 특례에 관한 내용으로 옳은 것을 모두 고른 것은?<br>ㄱ. 특별자치시장은 신고내용을 매 분기 종료일부터 1개월 이내에 국토교통부장관에게 직접 제출하여야 한다<br>ㄴ. 군사시설 보호구역 안의 토지를 취득하려는 외국인은 계약 체결 전에 허가를 받아야 한다<br>ㄷ. 외국인이 토지취득의 허가를 받은 경우에도 토지거래허가는 별도로 받아야 한다<br>ㄹ. 야생생물 특별보호구역 안의 토지는 허가대상에서 제외된다","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ"],"answer":0,"expl":"신고내용은 분기 단위로 국토교통부장관에게 올라가고, 군사시설 보호구역의 토지는 계약 전 허가 대상이다. 안보·문화·생태 가치가 걸린 땅만 걸러내는 구조이기 때문이다. 외국인 토지취득허가를 받으면 토지거래허가는 면제되고 야생생물 보호구역도 허가대상이라는 점이 함정이다.","src":"2026-07-22 공인중개사법 1-1 외국인 특례","conceptKey":"공인중개사법 1-1 외국인 취득 특례"},
  {"type":"사례","cat":"공인중개사법","q":"갑은 토지거래허가구역 안의 토지를 허가를 받지 아니하고 을에게 매도하는 계약을 체결하였다. 이에 관한 설명으로 옳은 것은? (다른 조건은 동일)","opts":["갑에게는 그 토지 취득가액의 100분의 10 이하에 해당하는 과태료가 부과된다.","허가를 받지 아니한 계약도 일단 유효하고 다만 이행강제금만 문제된다.","갑은 2년 이하의 징역 또는 개별공시지가 기준 토지가격의 30% 이하의 벌금에 처해질 수 있다.","부정한 방법으로 허가를 받은 경우에는 그 허가가 취소될 뿐 별도의 형사처벌 대상이 되지는 아니한다."],"answer":2,"expl":"무허가 계약이나 부정한 방법으로 받은 허가는 형사처벌 대상으로, 2년 이하의 징역 또는 계약 당시 개별공시지가에 따른 토지가격의 30% 이하 벌금에 처한다. 허가제의 실효성을 형벌로 담보하려는 것이다. 거짓 거래신고에 붙는 취득가액 10% 과태료와 섞는 것이 함정이다.","src":"2026-07-22 공인중개사법 1-4 과태료·벌칙","conceptKey":"공인중개사법 1-4 무허가 계약 벌칙"},
  {"type":"OX","cat":"공인중개사법","q":"장사 등에 관한 법령상 분묘의 설치기간은 30년이며 그 기간이 지난 분묘의 연고자는 1회에 한하여 30년의 연장을 신청할 수 있다. (O/X)","opts":["O","X"],"answer":0,"expl":"O. 원칙 30년에 1회 30년 연장이 가능해 최장 60년이 된다. 묘지의 무한정 존치를 막으면서도 유족의 사정을 한 번은 배려하려는 절충이다. 연장 횟수를 제한 없이 두거나 기간을 15년으로 줄여 놓는 변형이 자주 나온다.","src":"2026-07-22 공인중개사법 1-7 장사 등에 관한 법률","conceptKey":"공인중개사법 1-7 분묘 설치기간"}
/*__QUESTIONS_END__*/
];

/*__BUILD_PAYLOAD_START__*/
// ── 순수 함수 레이어: DOM 없이 채점 결과(payload v2)를 만든다. node로 단위테스트 가능.
function conceptFromSrc(src){
  return String(src||"").replace(/^\s*\d{4}-\d{2}-\d{2}\s*/,"").replace(/\s*\(재도전\)\s*$/,"").trim();
}
function buildPayload(questions, sel, quizDate, nowIso, schemaVersion){
  let score = 0; const results = [], wrong = [];
  questions.forEach((item, qi)=>{
    const isCorrect = sel[qi] === item.answer;
    if(isCorrect) score++;
    const ck = item.conceptKey || conceptFromSrc(item.src);
    const isRetry = !!item.retryOf || /\(재도전\)/.test(item.src||"") || String(item.q||"").indexOf("🔁") >= 0;
    const base = {
      id: quizDate + "-q" + (qi+1), cat: item.cat, type: item.type, q: item.q,
      options: item.opts, myAnswer: item.opts[sel[qi]], correct: item.opts[item.answer],
      expl: item.expl, src: item.src
    };
    const r = Object.assign({}, base, {
      conceptKey: ck,
      retryOf: isRetry ? (item.retryOf || ck) : null,
      correctAnswered: isCorrect
    });
    if(item.calc) r.calc = item.calc;
    results.push(r);
    if(!isCorrect) wrong.push(base);   // v1 하위호환 필드 (기존 수거 파이프라인용)
  });
  return { score: score, wrong: wrong, payload: {
    schemaVersion: schemaVersion, subject: "공인중개사", date: quizDate, quizId: quizDate,
    score: score, total: questions.length, wrongCount: wrong.length,
    results: results, wrong: wrong, generatedAt: nowIso
  }};
}
/*__BUILD_PAYLOAD_END__*/

const form = document.getElementById('quiz');
const selected = new Array(QUESTIONS.length).fill(null);
let graded = false;
let LAST_PAYLOAD = null;
let lastCat = null;

document.getElementById('total').textContent = ' / ' + QUESTIONS.length;

QUESTIONS.forEach((item, qi)=>{
  if(item.cat !== lastCat){
    const s = document.createElement('div');
    s.className = 'sec';
    s.textContent = '▍' + item.cat;
    form.appendChild(s);
    lastCat = item.cat;
  }
  const card = document.createElement('div');
  card.className = 'q';
  const isOX = item.type === 'OX';
  card.innerHTML = `
    <div class="qhead">
      <span class="qno">${qi+1}</span>
      <span class="qtype">${item.type}</span>
      <span class="qcat">${item.cat}</span>
    </div>
    <div class="qtext">${item.q}</div>
    <div class="opts ${isOX?'ox':''}" data-q="${qi}"></div>
    <div class="expl" id="expl-${qi}"></div>`;
  const optsEl = card.querySelector('.opts');
  item.opts.forEach((o, oi)=>{
    const el = document.createElement('div');
    el.className = 'opt';
    el.dataset.q = qi; el.dataset.o = oi;
    el.innerHTML = isOX
      ? `<span>${o}</span>`
      : `<span class="mk">${String.fromCharCode(65+oi)}</span><span>${o}</span>`;
    el.addEventListener('click', ()=>{
      if(graded) return;
      selected[qi] = oi;
      optsEl.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');
      updateProgress();
    });
    // 눈동자(👁) 소거 버튼 — 확실히 아닌 보기를 희미하게(다시 누르면 복구). 채점·선택·저장에 영향 없음.
    if(!isOX){
      const eye = document.createElement('button');
      eye.type = 'button';
      eye.className = 'eye';
      eye.textContent = '👁';
      eye.title = '확실히 아닌 보기 희미하게 (다시 누르면 복구)';
      eye.setAttribute('aria-label', '이 보기를 후보에서 제외');
      eye.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        if(graded) return;
        el.classList.toggle('ruled');
      });
      el.appendChild(eye);
    }
    optsEl.appendChild(el);
  });
  form.appendChild(card);
});

function updateProgress(){
  const done = selected.filter(s=>s!==null).length;
  document.getElementById('pcount').textContent = `${done} / ${QUESTIONS.length} 선택`;
  document.getElementById('pbar').style.width = (done/QUESTIONS.length*100)+'%';
  document.getElementById('submitBtn').disabled = done !== QUESTIONS.length;
}

const btn = document.getElementById('submitBtn');
btn.addEventListener('click', ()=>{ if(!graded){ grade(); } else { location.reload(); } });

document.getElementById('copyBtn').addEventListener('click', ()=>{
  if(!LAST_PAYLOAD) return;
  const txt = JSON.stringify(LAST_PAYLOAD, null, 2);
  const done = ()=>{ document.getElementById('dlnote').textContent = "📋 복사 완료 — velog-posts/공인중개사/claude_ox_오답/_inbox/에 붙여넣어 저장해도 된다"; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt, done));
  } else { fallbackCopy(txt, done); }
});
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  ta.remove();
}

function grade(){
  graded = true;
  const built = buildPayload(QUESTIONS, selected, QUIZ_DATE, new Date().toISOString(), SCHEMA_VERSION);
  LAST_PAYLOAD = built.payload;
  QUESTIONS.forEach((item, qi)=>{
    const opts = document.querySelectorAll(`.opt[data-q="${qi}"]`);
    opts.forEach((el, oi)=>{
      el.style.cursor='default';
      el.classList.remove('ruled');           // 채점 시 소거 표시 해제(정답이 희미하게 남지 않도록)
      const eye = el.querySelector('.eye');    // 눈동자 버튼 제거 — 채점 후엔 불필요
      if(eye) eye.remove();
      if(oi === item.answer) el.classList.add('correct');
      if(oi === selected[qi] && oi !== item.answer) el.classList.add('wrong');
    });
    const correct = selected[qi] === item.answer;
    const ex = document.getElementById('expl-'+qi);
    ex.innerHTML = `<span class="verdict" style="color:${correct?'var(--ok)':'var(--no)'}">${correct?'정답!':'오답'}</span>${item.expl}<span class="src">📄 출처: ${item.src}</span>`;
    ex.classList.add('show');
  });
  const r = document.getElementById('result');
  document.getElementById('score').textContent = built.score;
  document.getElementById('rmsg').textContent = msgFor(built.score);
  r.classList.add('show');
  btn.textContent = '🔄 다시 풀기';
  btn.classList.add('retry');
  document.getElementById('copyBtn').classList.add('show');

  // 결과 자동 다운로드 (월요일 수거·원장 갱신이 읽는 파일)
  downloadResult(built.payload);

  r.scrollIntoView({behavior:'smooth', block:'center'});
}

function downloadResult(payload){
  try{
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `공인중개사_오답_${QUIZ_DATE}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    document.getElementById('dlnote').textContent =
      payload.wrongCount>0 ? `💾 결과 저장됨(오답 ${payload.wrongCount}개) — 다운로드 폴더 확인` : "💾 만점 기록 저장됨";
  }catch(e){
    document.getElementById('dlnote').textContent = "⚠️ 자동 저장 실패 — 아래 '결과 JSON 복사'를 눌러 수동 저장";
  }
}

function msgFor(s){
  const t = QUESTIONS.length;
  const r = s/t;
  if(s===t)   return "만점. 오늘 등록증 발급해도 되겠는데요? 🏆";
  if(r>=0.8)  return "합격권. 틀린 거 해설만 한 번 더 보면 완벽합니다.";
  if(r>=0.6)  return "절반은 넘었어요. 오답 노트행 직행하는 개념들이 보이네요.";
  if(r>=0.4)  return "아직 흔들리는 개념이 있어요. 해설 정독하고 내일 재도전!";
  return "괜찮아요, 회독이 쌓이면 올라갑니다. 해설부터 차근차근.";
}
