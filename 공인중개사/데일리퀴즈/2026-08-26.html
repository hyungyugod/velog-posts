  {"type": "일반", "cat": "부동산공법", "q": "⏪ 국토의 계획 및 이용에 관한 법령상 용도지역의 세분과 그 정의에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["준주거지역은 주거기능을 위주로 이를 지원하는 공업기능을 보완하기 위하여 지정한다", "일반주거지역은 편리한 주거환경을 조성하기 위하여 지정한다", "전용주거지역은 양호한 주거환경을 보호하기 위하여 지정한다", "일반공업지역은 환경을 저해하지 아니하는 공업의 배치를 위하여 지정한다"], "answer": 0, "expl": "[정답 근거] 준주거지역은 주거기능 위주로 상업기능과 업무기능을 보완하는 지역이지 공업기능을 채우는 곳이 아니다. [메커니즘] 주거지 옆에 공장을 붙이면 지역을 나눈 취지 자체가 무너지기 때문이다. [함정] 전용은 양호, 일반은 편리라는 정의 키워드 한 단어가 그대로 지문이 된다.", "src": "2026-07-14 부동산공법 6-1 용도지역의 세분 (장기복습·43일전)", "conceptKey": "부동산공법 6-1 용도지역 정의 키워드"},
  {"type": "일반", "cat": "공인중개사법", "q": "부동산 거래신고 등에 관한 법령상 신고 및 등기와 관련된 기간의 기산일에 관한 설명으로 옳은 것은?", "opts": ["부동산 거래신고는 잔금지급일부터 30일 이내에 하여야 한다", "주택 임대차 계약의 신고는 계약체결일부터 60일 이내에 하여야 한다", "부동산 거래신고는 계약체결일부터 30일 이내에 하여야 한다", "소유권이전등기 신청기간은 계약체결일부터 기산한다"], "answer": 2, "expl": "[정답 근거] 부동산 거래신고의 기산일은 계약체결일이고 기간은 30일이다. [메커니즘] 신고제도의 목적이 실제 거래가격의 축적이어서 대금 흐름이 아니라 계약이 성립한 시점을 기준으로 잡는다. [함정] 잔금지급일이 기산일인 것은 소유권이전등기 신청기간이므로 두 제도를 맞바꿔 놓는 지문이 자주 나온다.", "src": "2026-08-19 공인중개사법 1-1 신고기간과 기산일", "conceptKey": "공인중개사법 1-1 거래신고 기산일"},
  {"type": "일반", "cat": "공인중개사법", "q": "부동산 거래신고 등에 관한 법령상 과태료의 부과 대상에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["부동산 거래신고를 하지 아니한 자는 500만원 이하의 과태료 부과 대상이다", "거래당사자로서 공동신고를 거부한 자는 신고를 하지 아니한 자에 포함된다", "계약을 체결하지 아니하였음에도 거짓으로 부동산 거래신고를 한 자는 자진신고에 따른 감경 대상이 아니다", "신고의무자가 아닌 자가 거짓 신고를 한 경우에는 3천만원 이하의 과태료를 부과한다"], "answer": 3, "expl": "[정답 근거] 신고의무자가 아닌 자가 거짓 신고를 하면 취득가액의 100분의 10 이하가 부과되고 3천만원 이하는 계약도 없이 거짓 신고한 경우다. [메커니즘] 안 한 자, 거짓으로 한 자, 계약도 없이 거짓 신고한 자를 위반의 무게에 따라 세 층으로 나눈 구조다. [함정] 세 구간의 금액을 서로 옮겨 붙이는 방식으로 출제된다.", "src": "2026-08-19 공인중개사법 1-3 과태료 체계", "conceptKey": "공인중개사법 1-3 과태료 구간 귀속"},
  {"type": "일반", "cat": "공인중개사법", "q": "부동산 거래신고 등에 관한 법령상 거래신고의 대상 여부에 관한 설명으로 옳은 것은?", "opts": ["「도시 및 주거환경정비법」에 따른 공급계약은 거래신고의 대상이 된다", "「건축법」에 따른 부동산의 공급계약은 거래신고의 대상이 된다", "부동산 거래신고는 매수인의 주소지를 관할하는 시장·군수·구청장에게 하여야 한다", "부동산의 교환계약도 매매계약과 마찬가지로 거래신고의 대상이 된다"], "answer": 0, "expl": "[정답 근거] 신고 대상 법률에는 「도시 및 주거환경정비법」이 들어가고, 분양 관련은 「건축법」이 아니라 「건축물의 분양에 관한 법률」이다. [메커니즘] 실거래가격을 축적하려는 제도라 매매와 공급계약처럼 대가가 특정되는 거래만 잡는다. [함정] 교환은 매매가 아니어서 신고 대상이 아니고, 신고관청은 매수인 주소지가 아니라 부동산 소재지 관할이다.", "src": "2026-08-19 공인중개사법 1-1 신고 대상과 신고관청", "conceptKey": "공인중개사법 1-1 신고 대상 법률"},
  {"type": "일반", "cat": "공인중개사법", "q": "외국인등이 국내의 토지를 취득하는 경우의 허가와 신고에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["외국인등이 야생생물 특별보호구역 안의 토지를 취득하는 계약을 체결하려면 계약체결 전에 신고관청의 허가를 받아야 한다", "외국인등이 토지취득의 허가를 받은 경우에도 토지거래계약 허가에 관한 규정이 함께 적용된다", "토지취득의 허가를 받지 아니하고 체결한 토지취득계약은 그 효력이 발생하지 아니한다", "부동산등의 취득신고를 하는 경우 교환계약서는 첨부서류로 인정되지 아니한다"], "answer": 1, "expl": "[정답 근거] 외국인등이 토지취득의 허가를 받으면 토지거래허가에 관한 규정은 적용되지 아니한다. [메커니즘] 같은 토지에 두 개의 허가를 겹쳐 요구하면 중복 규제가 되므로 하나로 흡수한다. [함정] 군사·천연·문화·생태·야생생물 구역은 사전허가 대상이고, 허가 없이 맺은 계약은 무효라는 점과 묶어서 외운다.", "src": "2026-08-19 공인중개사법 1-4 외국인등의 부동산 취득 특례", "conceptKey": "공인중개사법 1-4 취득허가와 토지거래허가"},
  {"type": "조합", "cat": "공인중개사법", "q": "부동산 거래신고 등에 관한 법령상 토지거래계약 허가구역의 지정에 관한 설명으로 옳은 것을 모두 고른 것은?<br>ㄱ. 허가구역은 대상자·용도·지목을 특정하여 지정할 수 있다<br>ㄴ. 국토교통부장관이 허가구역의 지정을 공고할 때에는 용도지역, 지형도, 허가면제 대상 토지면적을 포함하여야 한다<br>ㄷ. 허가구역의 지정 사실을 관할 등기소의 장에게 통지하는 것은 시·도지사이다<br>ㄹ. 허가구역을 재지정하려면 의견 청취를 거친 후 심의를 하여야 한다", "opts": ["ㄱ, ㄴ", "ㄱ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ"], "answer": 3, "expl": "[정답 근거] 지정의 특정 가능성, 국토교통부장관 공고의 포함사항, 재지정의 의견 청취 후 심의가 모두 맞다. [메커니즘] 지정·해제·축소는 심의만 거치지만 재지정은 규제가 연장되는 것이라 의견 청취가 한 단계 더 붙는다. [함정] 등기소에 통지하는 주체는 시·도지사가 아니라 시장·군수·구청장이다.", "src": "2026-08-19 공인중개사법 1-5 토지거래허가구역", "conceptKey": "공인중개사법 1-5 허가구역 지정 절차"},
  {"type": "사례", "cat": "공인중개사법", "q": "갑은 을 소유의 주택을 보증금 6,000만원, 월차임 30만원으로 임차하는 계약을 체결하였다. 부동산 거래신고 등에 관한 법령상 이 계약의 신고에 관한 설명으로 옳은 것은?", "opts": ["보증금이 기준금액에 해당하므로 계약체결일부터 30일 이내에 신고하여야 한다", "갑이 전입신고를 마치더라도 임대차 계약의 신고는 따로 하여야 한다", "보증금과 월차임이 모두 기준금액을 초과하지 아니하므로 신고의무가 없다", "보증금과 차임의 증감 없이 임대차 기간만 변경한 경우에도 변경신고를 하여야 한다"], "answer": 2, "expl": "[정답 근거] 보증금 6,000만원과 월차임 30만원은 기준금액을 초과하여야 신고 대상이 되므로 딱 맞는 금액은 대상이 아니다. [메커니즘] 소액 임대차까지 신고 부담을 지우지 않으려고 문턱을 초과 요건으로 설계했다. [함정] 전입신고를 하면 임대차 신고를 한 것으로 보고, 기간만 바꾸면 변경신고 의무가 없다는 점도 함께 나온다.", "src": "2026-08-19 공인중개사법 1-2 주택 임대차 계약 신고", "conceptKey": "공인중개사법 1-2 임대차 신고 기준금액"},
  {"type": "OX", "cat": "공인중개사법", "q": "허가받은 목적대로 토지를 이용하지 아니한 자에 대한 이행강제금은 최초의 이행명령이 있었던 날을 기준으로 매년 1회씩 부과할 수 있다.", "opts": ["O", "X"], "answer": 0, "expl": "O. 반복 부과의 기산점은 새로 내린 이행명령이 아니라 최초의 이행명령이 있었던 날이다. 명령을 다시 낼 때마다 기산점이 뒤로 밀리면 제재가 무한정 늦춰져 이행을 강제하는 효과가 사라지기 때문이다. 이행명령은 3개월 이내에 문서로 하고, 조사는 매년 1회 이상이라는 숫자와 함께 묶어 둔다.", "src": "2026-08-19 공인중개사법 1-6 이행명령과 이행강제금", "conceptKey": "공인중개사법 1-6 이행강제금 반복 부과"},
  {"type": "일반", "cat": "부동산공시법", "q": "부동산등기법령상 용익권 등기에서 반드시 기록하여야 하는 사항에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["지상권설정등기에는 그 목적과 범위를 기록하여야 한다", "지역권설정등기에는 그 목적과 승역지의 범위를 기록하여야 한다", "전세권설정등기에는 전세금과 범위를 기록하여야 한다", "임차권설정등기에는 차임을 기록하지 아니하여도 된다"], "answer": 3, "expl": "[정답 근거] 임대차는 차임의 지급을 약정하는 계약이므로 임차권등기에는 차임이 필요적 기록사항이다. [메커니즘] 권리의 정의 안에 조건으로 들어 있는 요소가 그대로 등기의 필수 기재로 이어진다. [함정] 지상권·지역권은 정의에 목적이 들어 있어 목적을, 전세권·임차권은 돈이 들어 있어 돈을 적는다는 축으로 나눈다.", "src": "2026-08-20 부동산공시법 1-1 용익권 등기의 필수 기록사항", "conceptKey": "부동산공시법 1-1 용익권 필요적 기록 판별"},
  {"type": "일반", "cat": "부동산공시법", "q": "부동산등기법령상 소유권 외의 권리를 이전하는 등기에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["임차권등기명령에 따라 마쳐진 주택임차권등기도 부기등기의 방법으로 이전할 수 있다", "부기등기로 하는 것은 종전 권리의 순위를 그대로 이어받게 하기 위함이다", "소유권이 아닌 권리를 이전하는 등기는 부기등기의 방법으로 한다", "법정갱신된 전세권을 이전하려면 존속기간에 관한 변경등기를 먼저 하여야 한다"], "answer": 0, "expl": "[정답 근거] 임차권등기명령에 의한 주택임차권등기는 대항력과 우선변제권을 보전하려는 등기여서 이전할 수 없다. [메커니즘] 유통을 예정한 권리등기가 아니라 이미 확보한 지위를 붙잡아 두는 장치이기 때문이다. [함정] 소유권 외의 권리 이전은 부기등기라는 원칙만 붙잡으면 예외를 놓친다.", "src": "2026-08-20 부동산공시법 1-2 부기등기 원칙과 처분", "conceptKey": "부동산공시법 1-2 소유권 외 권리 이전 형식"},
  {"type": "조합", "cat": "부동산공시법", "q": "부동산등기법령상 변경등기와 경정등기·말소등기의 구별에 관한 설명으로 옳은 것을 모두 고른 것은?<br>ㄱ. 부동산의 표시가 변경되어 변경등기를 신청할 때에는 대장 등본을 첨부하여야 한다<br>ㄴ. 권리의 종류를 잘못 기록한 등기는 전부불일치로 보아 말소등기의 대상이 된다<br>ㄷ. 등기명의인 표시변경등기는 등기명의인이 단독으로 신청하는 것이 원칙이다<br>ㄹ. 권리의 객체를 잘못 기록한 등기는 동일성이 유지되므로 경정등기로 바로잡을 수 있다", "opts": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 1, "expl": "[정답 근거] 표시변경에는 대장이 따라붙고, 권리의 종류를 틀리면 전부불일치가 되며, 명의인 표시변경은 단독신청이 원칙이다. [메커니즘] 경정등기는 동일성이 유지되는 범위에서만 허용되므로 종류·주체·객체가 어긋나면 다른 등기가 되어 버린다. [함정] 객체를 잘못 적은 것도 전부불일치여서 경정이 아니라 말소로 간다.", "src": "2026-08-20 부동산공시법 1-3 변경·경정·말소의 갈림길", "conceptKey": "부동산공시법 1-3 전부불일치 판정"},
  {"type": "일반", "cat": "부동산공시법", "q": "등기절차에서 사해행위와 등기의무자의 판단에 관한 설명으로 옳은 것은?", "opts": ["사해행위는 채무자가 채권자를 해함을 알면서 책임재산을 감소시키는 법률행위를 말한다", "사해행위를 취소할 수 있는 채권자의 권리를 채권자대위권이라고 한다", "절차법상 등기의무자에 해당하는지는 실체법상의 권리의무를 기준으로 판단한다", "저당권설정은 소유권이 그대로 남으므로 사해행위가 될 수 없다"], "answer": 0, "expl": "[정답 근거] 사해행위는 강제집행의 대상인 책임재산을 줄여 채권자를 해하는 법률행위를 가리킨다. [메커니즘] 담보로 잡을 재산이 줄면 채권 회수가 어려워지므로 매매·증여뿐 아니라 저당권설정도 포함된다. [함정] 이를 취소하는 권리는 채권자취소권이고, 절차법상 등기의무자는 등기기록상 형식으로 판단한다.", "src": "2026-08-20 부동산공시법 1-4 개념 보충", "conceptKey": "부동산공시법 1-4 사해행위와 형식적 판단"},
  {"type": "일반", "cat": "부동산공시법", "q": "⏪ 부동산등기법령상 등기신청의 구조에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["근저당권의 채권최고액을 감액하는 변경등기도 공동으로 신청하여야 한다", "가등기명의인은 단독으로 그 가등기의 말소등기를 신청할 수 있다", "민법상 조합은 근저당권설정등기의 등기권리자가 될 수 있다", "채권자대위권에 의한 등기신청에서 대위채권자는 자기의 이름으로 채무자의 등기신청권을 행사한다"], "answer": 2, "expl": "[정답 근거] 민법상 조합은 그 자체로 권리·의무의 주체가 되지 못하여 등기권리자나 등기의무자가 될 수 없다. [메커니즘] 법인격이 없는 조합에 등기명의를 주면 등기부가 누구의 권리인지 특정하지 못하게 된다. [함정] 채무자 지위도 마찬가지로 가질 수 없다는 점까지 함께 나온다.", "src": "2026-05-29 부동산공시법 5 등기신청 구조 (장기복습·89일전)", "conceptKey": "부동산공시법 5 신청구조와 당사자능력"},
  {"type": "OX", "cat": "부동산공시법", "q": "등기관이 토지의 소유권에 관한 등기명의인표시변경등기를 하였을 때에는 지체 없이 그 사실을 지적소관청에 통지하여야 한다.", "opts": ["O", "X"], "answer": 0, "expl": "O. 소유권의 등기명의인 표시가 바뀌면 등기관은 지체 없이 지적소관청에 통지한다. 등기부와 대장의 소유자 표시가 어긋나면 두 장부의 공시가 서로 다른 사실을 말하게 되므로 장부 사이를 맞추는 동기화 장치가 필요하기 때문이다. 통지처를 관할 세무서장이나 시·도지사로 바꿔 놓는 것이 전형적인 변형이다.", "src": "2026-08-20 부동산공시법 1-3 소유권변경사실의 통지", "conceptKey": "부동산공시법 1-3 지적소관청 통지"},
  {"type": "일반", "cat": "부동산세법", "q": "소득세법령상 부동산 관련 소득이 사업소득과 양도소득 중 어느 것으로 구분되는지에 관한 설명으로 옳은 것은?", "opts": ["주택을 신축하여 계속·반복적으로 분양한 소득은 양도소득으로 분류과세된다", "부동산매매업자가 판매할 목적으로 취득한 부동산을 양도한 소득은 사업소득으로 과세된다", "부동산 임대업에서 발생하는 임대료 수입은 양도소득에 해당한다", "재고자산의 판매로 볼 수 있는 부동산의 양도라도 등기된 자산이면 양도소득으로 본다"], "answer": 1, "expl": "[정답 근거] 판매를 목적으로 보유한 부동산은 재고자산이므로 그 양도는 사업소득으로 잡는다. [메커니즘] 팔아서 남긴 차익인지 팔려고 만든 물건인지가 세목을 가르는 기준이다. [함정] 지어서 파는 행위는 건설업·부동산매매업으로 사업소득이 되고, 임대료 수입은 애초에 사업소득이다.", "src": "2026-08-20 부동산세법 1-1 양도소득이냐 사업소득이냐", "conceptKey": "부동산세법 1-1 재고자산과 소득 구분"},
  {"type": "일반", "cat": "부동산세법", "q": "소득세법령상 부동산 임대업이 포함된 사업소득의 구분경리에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["사업소득에 부동산 임대업에서 발생한 소득이 있으면 그 소득별로 구분하여 회계처리하여야 한다", "구분경리를 요구하는 것은 결손금의 통산 범위가 왜곡되는 것을 막기 위해서이다", "부동산 임대업에서 발생한 소득은 사업소득에 속한다", "부동산 임대업의 결손금은 다른 사업소득과 제한 없이 통산되므로 구분경리는 임의사항이다"], "answer": 3, "expl": "[정답 근거] 임대업 소득이 섞여 있으면 소득별로 구분하여 회계처리하여야 하고 임의로 생략할 수 없다. [메커니즘] 임대업과 다른 사업의 손익을 뒤섞으면 결손금 통산 범위가 흐려져 과세소득이 왜곡되기 때문이다. [함정] 임대료 수입이 사업소득이라는 결론과 구분경리 의무를 별개로 다뤄야 한다.", "src": "2026-08-20 부동산세법 1-1 부동산 임대업의 구분경리", "conceptKey": "부동산세법 1-1 구분경리 의무"},
  {"type": "일반", "cat": "부동산세법", "q": "소득세법령상 자산의 이전이 양도에 해당하는지에 관한 설명으로 옳은 것은?", "opts": ["「지적재조사에 관한 특별법」에 따라 지급받는 조정금에 대해서는 양도소득세를 과세하지 아니한다", "지적재조사에 따른 조정금은 토지의 유상이전 대가이므로 양도소득세 과세대상이다", "부동산의 교환은 무상이전이므로 언제나 양도에 해당하지 아니한다", "소유권이 사실상 유상으로 이전되었더라도 등기가 되지 아니하면 양도로 보지 아니한다"], "answer": 0, "expl": "[정답 근거] 지적재조사 조정금은 그동안 어긋나 있던 경계를 바로잡으며 정산하는 돈이어서 양도소득세를 과세하지 않는다. [메커니즘] 소유권이 옮겨 가도 새로 이득을 실현한 것이 아니면 양도로 보지 않는다는 축이다. [함정] 교환은 원칙적으로 유상이전이라 양도에 해당하고, 미등기라도 사실상 유상이전이면 양도다.", "src": "2026-08-20 부동산세법 1-2 양도로 보지 않는 경우", "conceptKey": "부동산세법 1-2 양도 판정 기준"},
  {"type": "조합", "cat": "부동산세법", "q": "소득세법령상 1세대 1주택의 양도에서 보유기간 또는 거주기간의 제한을 받지 아니하는 경우를 모두 고른 것은?<br>ㄱ. 1년 이상 계속하여 국외거주를 필요로 하는 근무상 형편으로 세대 전원이 출국하여 출국일부터 2년 이내에 양도하는 경우<br>ㄴ. 취학의 형편으로 다른 시·군으로 세대 전원이 이사하면서 1년 이상 거주한 주택을 양도하는 경우<br>ㄷ. 1년 이상의 치료나 요양이 필요한 질병으로 다른 시·군으로 이사하면서 1년 이상 거주한 주택을 양도하는 경우<br>ㄹ. 다른 시·도의 주택을 투자 목적으로 추가 취득하기 위하여 종전 주택을 양도하는 경우", "opts": ["ㄱ, ㄴ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 2, "expl": "[정답 근거] 국외 이주와 다른 시·군으로의 취학·근무·질병 요양은 열거된 예외이고 투자 목적 이사는 들어가지 않는다. [메커니즘] 본인이 통제할 수 없는 사정으로 집을 비워야 하는 경우에만 보유·거주요건을 풀어 주는 구조다. [함정] 출국은 2년 이내 양도, 시·군 이사는 1년 이상 거주로 조건의 성격이 서로 다르다.", "src": "2026-08-20 부동산세법 1-3 보유·거주기간 제한을 받지 않는 경우", "conceptKey": "부동산세법 1-3 보유거주 예외 열거"},
  {"type": "일반", "cat": "부동산세법", "q": "부동산 조세에서 세율이 적용되는 구조에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["차등비례세율은 세율 자체는 고정되어 있으나 과세대상의 종류·용도에 따라 서로 다른 세율을 적용한다", "초과누진세율은 과세표준을 여러 구간으로 나누고 구간을 넘는 부분에만 더 높은 세율을 적용한다", "차등비례세율에서는 같은 종류의 과세대상이면 과세표준이 커져도 세율이 달라지지 아니한다", "초과누진세율에서는 과세표준이 상위 구간에 도달하면 과세표준 전체에 그 구간의 세율을 적용한다"], "answer": 3, "expl": "[정답 근거] 초과누진은 구간을 넘는 부분에만 높은 세율을 얹는 구조여서 전체에 한꺼번에 적용하지 않는다. [메커니즘] 전체에 적용하면 구간 경계에서 세부담이 급격히 튀어 형평이 깨지기 때문이다. [함정] 세율이 여러 개인 것과 세율이 올라가는 것은 완전히 다른 구조라는 점이 갈림길이다.", "src": "2026-08-20 부동산세법 1-4 세율 용어 정리", "conceptKey": "부동산세법 1-4 누진과 비례의 구조"},
  {"type": "OX", "cat": "부동산세법", "q": "부동산 임대업에 사용하던 건물을 양도하여 발생한 소득은 사업소득으로 과세되므로 양도소득세의 과세대상이 되지 아니한다.", "opts": ["O", "X"], "answer": 1, "expl": "X. 임대업에 쓰던 건물은 재고자산이 아니라 고정자산이므로 이를 팔면 원칙적으로 양도소득세 과세대상이다. 임대에서 나오는 임대료가 사업소득일 뿐, 그 부동산 자체의 처분이익까지 사업소득이 되는 것은 아니다. 재고자산 양도로 사업소득이 되는 쪽은 건설업과 부동산매매업이다.", "src": "2026-08-20 부동산세법 1-1 사업을 위한 양도", "conceptKey": "부동산세법 1-1 임대업 자산 양도"},
  {"type": "일반", "cat": "민법", "q": "민법상 계약 해제에 따른 원상회복에서 지급하는 이자의 성질에 관한 설명으로 옳은 것은?", "opts": ["해제로 반환할 매매대금에 붙는 이자는 이행지체를 이유로 하는 지연손해금이다", "해제로 반환할 매매대금에 붙는 이자는 부당이득반환의 성질을 가지는 법정이자이다", "매수인의 이행제공이 없으면 매도인은 반환할 대금의 이자를 지급할 의무가 없다", "합의해제의 경우에도 반환할 금전에 당연히 이자를 붙여야 한다"], "answer": 1, "expl": "[정답 근거] 해제로 돌려줄 대금에 붙는 이자는 원상회복의 일환으로 부당이득반환의 성질을 가지는 법정이자다. [메커니즘] 지연이자는 이행지체를 전제로 하므로 동시이행 상태에서는 붙지 않지만 법정이자는 그와 무관하게 붙는다. [함정] 이자를 지급할 의무가 있다는 말이 항변권을 포기하고 먼저 이행하라는 뜻은 아니고, 합의해제는 약정이 없으면 이자가 없다.", "src": "2026-08-24 민법 1-2 법정이자와 지연이자", "conceptKey": "민법 1-2 해제 시 이자의 성질"},
  {"type": "일반", "cat": "민법", "q": "민법상 매매의 예약과 환매에 관한 설명으로 <b>옳지 않은</b> 것은?", "opts": ["환매권 행사로 인한 소유권이전등기청구권은 환매기간 안에 행사하여야 한다", "예약완결권의 행사기간은 제척기간이고 약정이 없으면 10년으로 한다", "부동산의 환매기간은 5년을 넘지 못하고 정하지 아니하면 5년으로 한다", "환매권은 등기하여야 제3자에게 그 권리의 취득을 주장할 수 있다"], "answer": 0, "expl": "[정답 근거] 환매권을 행사한 뒤 생기는 소유권이전등기청구권은 별개의 채권이어서 10년 안에 행사하면 되고 환매기간과 관계가 없다. [메커니즘] 환매기간은 환매권을 행사할 수 있는 기간이고 행사 후의 이행청구권은 그때 새로 발생하는 권리이기 때문이다. [함정] 형성권인 예약완결권의 10년과 환매기간 5년의 숫자를 서로 바꿔 놓는 변형이 잦다.", "src": "2026-08-24 민법 1-4 매매의 예약과 1-6 환매", "conceptKey": "민법 1-6 환매기간과 등기청구권"},
  {"type": "사례", "cat": "민법", "q": "갑은 자기 소유 X토지를 을에게 매도하면서 계약금을 받았고, 중도금 지급기일은 아직 도래하지 아니하였다. 민법상 이에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)", "opts": ["기한의 이익은 원칙적으로 매도인에게 있으므로 을은 이행기 전에 중도금을 지급할 수 없다", "을이 토지거래계약의 허가를 신청한 것은 이행의 착수에 해당한다", "기한의 이익이 매수인에게 있다고 보는 것이 원칙이므로 을은 이행기 전에도 이행에 착수할 수 있다", "을이 갑을 상대로 소유권이전등기청구의 소를 제기한 것은 이행의 착수에 해당한다"], "answer": 2, "expl": "[정답 근거] 기한의 이익은 일반적으로 매수인에게 있는 것으로 보므로 매수인은 이행기 전에도 이행에 착수할 수 있다. [메커니즘] 기한의 이익을 가진 쪽은 그 이익을 스스로 포기하고 먼저 이행해도 상대방에게 불이익이 없기 때문이다. [함정] 매도인에게도 기한의 이익이 있는 사정이 있으면 이행기 전 착수가 막히고, 허가 신청이나 소 제기는 착수로 보지 않는다.", "src": "2026-08-24 민법 1-3 해약금 해제와 이행의 착수", "conceptKey": "민법 1-3 이행착수 시기"},
  {"type": "일반", "cat": "민법", "q": "⏪ 민법 제109조의 착오에서 증명책임의 분배에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)", "opts": ["표의자에게 중대한 과실이 있다는 점은 취소를 주장하는 표의자가 증명하여야 한다", "표의자에게 중대한 과실이 있다는 점은 법률행위의 효력을 주장하는 상대방이 증명하여야 한다", "법률에 관한 착오는 그 성질상 중요 부분의 착오가 될 수 없다", "착오를 이유로 취소한 표의자는 상대방이 입은 손해를 배상할 책임을 진다"], "answer": 1, "expl": "[정답 근거] 중대한 과실은 취소를 막는 사유이므로 효력을 주장하려는 상대방이 증명한다. [메커니즘] 자기에게 유리한 장애사유를 주장하는 쪽이 그 사유를 대야 한다는 배분 원리가 그대로 적용된다. [함정] 표의자는 착오의 존재와 그것이 의사표시에 결정적이었다는 점을 대고, 법률에 관한 착오도 중요 부분이면 취소할 수 있다.", "src": "2026-07-13 민법 6 착오 (장기복습·44일전)", "conceptKey": "민법 6 착오 증명책임"},
  {"type": "조합", "cat": "민법", "q": "⏪ 민법 제108조 제2항의 제3자에 해당하는 자를 모두 고른 것은? (다툼이 있으면 판례에 따름)<br>ㄱ. 가장매수인으로부터 그 목적물에 저당권을 설정받은 자<br>ㄴ. 가장양수한 채권을 추심하기 위하여 양수한 자<br>ㄷ. 가장매매의 매수인에 대한 파산선고로 선임된 파산관재인<br>ㄹ. 가장매수인으로부터 목적물을 다시 매수하여 등기를 마친 자", "opts": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄱ, ㄴ, ㄷ, ㄹ", "ㄱ, ㄷ, ㄹ"], "answer": 3, "expl": "[정답 근거] 가짜 외형을 믿고 새로운 법률상 이해관계를 맺은 저당권자, 파산관재인, 전득자는 제3자다. [메커니즘] 보호의 기준은 허위의 외형 위에 독자적인 이해관계를 새로 쌓았는지 여부다. [함정] 추심을 위하여 채권을 양수한 자는 남의 돈을 대신 받아 주는 지위에 그쳐 제3자가 아니다.", "src": "2026-07-13 민법 5 제108조 제2항의 제3자 (장기복습·44일전)", "conceptKey": "민법 5 통정허위표시 제3자 범위"},
  {"type": "일반", "cat": "민법", "q": "⏪ 민법상 점유자와 회복자의 관계에 관한 설명으로 <b>옳지 않은</b> 것은? (다툼이 있으면 판례에 따름)", "opts": ["선의의 점유자는 점유물에서 생긴 과실을 취득하므로 이를 반환할 의무가 없다", "선의의 점유자라도 본권에 관한 소에서 패소한 때에는 그 소가 제기된 때부터 악의의 점유자로 본다", "점유자가 과실을 취득한 경우에도 통상의 필요비의 상환을 청구할 수 있다", "악의의 점유자는 수취한 과실을 반환하고 지연이자까지 지급하여야 한다"], "answer": 2, "expl": "[정답 근거] 과실을 수취한 점유자는 그 과실로 통상의 관리비용을 충당한 것으로 보아 필요비를 청구하지 못한다. [메커니즘] 과실을 가져가는 이익과 목적물 유지비용을 서로 상쇄시켜 정산을 단순화한 것이다. [함정] 유익비는 가액의 증가가 현존하면 회복자의 선택에 따라 상환을 청구할 수 있어 필요비와 처리가 다르다.", "src": "2026-02-15 민법 1-1 점유자와 회복자의 관계 (장기복습·192일전)", "conceptKey": "민법 1-1 과실수취와 비용상환"},
  {"type": "사례", "cat": "민법", "q": "⏪ 갑과 을이 X토지를 공유하던 중 갑이 을의 동의 없이 X토지 전부를 병에게 매도하고 병 명의로 소유권이전등기를 마쳤다. 민법상 이에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)", "opts": ["을은 자기 지분에 관한 부분에 한하여 병 명의 등기의 말소를 청구할 수 있다", "갑의 처분은 공유물의 관리행위이므로 을의 동의가 없어도 전부 유효하다", "공유자 사이에 분할협의가 성립한 뒤에도 일부 공유자가 협조하지 아니하면 다시 재판상 분할을 청구할 수 있다", "을은 병 명의 등기의 전부에 대하여 말소를 청구할 수 있다"], "answer": 0, "expl": "[정답 근거] 갑의 처분은 자기 지분 범위에서는 유효하므로 을은 자기 몫에 해당하는 부분만 말소를 구할 수 있다. [메커니즘] 지분은 각자가 자유롭게 처분할 수 있어 타인의 지분까지 넘긴 부분만 효력이 없다. [함정] 제3자 명의 등기가 전부 무효인 경우라야 보존행위로 전부 말소를 구할 수 있고, 분할협의가 끝나면 이행소송으로 가야 한다.", "src": "2026-02-15 민법 1-4 공유물의 처분과 분할 (장기복습·192일전)", "conceptKey": "민법 1-4 지분 처분과 말소 범위"},
  {"type": "일반", "cat": "부동산학개론", "q": "부동산 가격공시제도에서 각 가격이 과세의 기준이 되는지에 관한 설명으로 옳은 것은?", "opts": ["표준주택가격은 개별단독주택가격과 마찬가지로 과세 산정의 기준이 된다", "표준주택가격은 개별단독주택가격 산정의 기준이 될 뿐 과세의 기준이 되지는 아니한다", "개별단독주택가격은 표준주택가격 산정의 기준을 제공하는 데 그친다", "공동주택가격은 어떠한 경우에도 과세 산정의 기준이 될 수 없다"], "answer": 1, "expl": "[정답 근거] 표준주택가격은 개별단독주택가격을 매기기 위한 기준을 제공하는 데 목적이 있어 과세와 직접 연결되지 않는다. [메커니즘] 표본을 정해 놓고 그 표본을 잣대로 개별 주택을 재는 구조라 과세 대상은 개별가격 쪽이다. [함정] 표준과 개별의 역할을 맞바꾸거나 공동주택가격의 활용을 아예 부정하는 지문이 나온다.", "src": "2026-08-21 부동산학개론 3-1 표준과 개별", "conceptKey": "부동산학개론 3-1 과세 기준 주체"},
  {"type": "조합", "cat": "부동산학개론", "q": "부동산 가격공시제도상 분할·합병에 따른 추가 공시와 조사·산정의 의뢰에 관한 설명으로 옳은 것을 모두 고른 것은?<br>ㄱ. 개별공시지가는 공시기준일 이후 분할·합병이 있으면 대통령령으로 정하는 날 또는 7월 1일을 기준으로 추가로 결정·공시한다<br>ㄴ. 개별주택가격은 같은 경우에 대통령령으로 정하는 날 또는 6월 1일을 기준으로 추가로 결정·공시한다<br>ㄷ. 표준지공시지가의 조사·평가는 한국부동산원에 의뢰한다<br>ㄹ. 표준주택가격의 조사·산정은 한국부동산원에 의뢰한다", "opts": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 2, "expl": "[정답 근거] 지가는 7월 1일, 주택은 6월 1일이 추가 공시의 기준일이고 표준주택은 한국부동산원이 조사·산정한다. [메커니즘] 토지와 주택은 조사 주기와 담당 기관이 따로 설계되어 있어 한 달 차이와 기관 차이가 함께 생긴다. [함정] 표준지공시지가는 한국부동산원이 아니라 감정평가법인등에 의뢰한다.", "src": "2026-08-21 부동산학개론 3-2 분할·합병 시 추가 공시", "conceptKey": "부동산학개론 3-2 추가 공시일과 의뢰처"},
  {"type": "OX", "cat": "부동산학개론", "q": "임대료를 시장 균형 수준보다 낮게 규제하면 장기적으로 공급이 늘어나 초과수요가 줄어든다.", "opts": ["O", "X"], "answer": 1, "expl": "X. 임대료를 낮게 묶으면 임대사업의 수익성이 떨어져 장기적으로 공급이 줄어든다. 그 가격에서의 수요량은 그대로이거나 오히려 늘어나므로 수요량에서 공급량을 뺀 초과수요는 도리어 커진다. 초과수요가 크다는 것은 사람들이 원하는 만큼 공급이 따라오지 못한다는 뜻이다.", "src": "2026-08-21 부동산학개론 4-1 초과수요", "conceptKey": "부동산학개론 4-1 임대료 규제와 초과수요"},
  {"type": "계산", "cat": "부동산학개론", "q": "⏪ 어느 부동산의 가능총소득이 1억원, 공실 및 대손이 1,000만원, 영업경비가 2,700만원, 부채서비스액이 1,800만원이다. 이 부동산의 채무불이행률은? (다른 조건은 동일)", "opts": ["50퍼센트", "30퍼센트", "62.5퍼센트", "60퍼센트"], "answer": 0, "expl": "[정답 근거] 유효총소득은 1억 − 1,000만 = 9,000만원이고 (2,700만 + 1,800만) ÷ 9,000만 × 100 = 50퍼센트다. [메커니즘] 영업경비와 부채서비스액을 합한 고정 지출이 유효총소득의 몇 퍼센트를 잠식하는지를 재는 지표다. [함정] 분모를 가능총소득으로 잡거나 영업경비를 빼먹으면 값이 달라진다.", "src": "2026-05-28 부동산학개론 1-5 부동산 투자 수익성 분석 (장기복습·90일전)", "conceptKey": "부동산학개론 1-5 채무불이행률", "calc": {"expr": "(2700 + 1800) / (10000 - 1000) * 100", "expected": 50}},
  {"type": "계산", "cat": "부동산학개론", "q": "⏪ 갑은 매년 말 원리금 2,400만원을 상환하는 조건으로 대출을 받았고, 그 조건의 연간 저당상수는 0.12이다. 갑이 받은 총 대출금액은? (다른 조건은 동일)", "opts": ["1억 6,000만원", "2억원", "2억 4,000만원", "2억 8,800만원"], "answer": 1, "expl": "[정답 근거] 총 대출금액은 원리금상환액을 저당상수로 나누어 2,400만 ÷ 0.12 = 2억원이다. [메커니즘] 저당상수는 대출원금 1원당 매기 갚아야 할 원리금을 뜻하므로 나누면 원금이 복원된다. [함정] 저당상수는 연금의 현재가치 계수의 역수여서 곱하면 원금이 아니라 상환액이 나온다.", "src": "2026-05-28 부동산학개론 1-6 금융 계수 관계 (장기복습·90일전)", "conceptKey": "부동산학개론 1-6 저당상수 역산", "calc": {"expr": "2400 / 0.12", "expected": 20000}},
  {"type": "조합", "cat": "부동산학개론", "q": "⏪ 부동산학개론상 토지 관련 용어의 연결로 옳은 것을 모두 고른 것은?<br>ㄱ. 빈지 — 바닷가에 접하여 있는 토지<br>ㄴ. 법지 — 경사면 등 활용실익은 적으나 법률상 소유권이 인정되는 토지<br>ㄷ. 포락지 — 물에 의하여 침식되어 무너져 내린 토지<br>ㄹ. 소지 — 도로가 없어 공로에 통하지 못하는 토지", "opts": ["ㄱ, ㄴ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 2, "expl": "[정답 근거] 빈지는 바닷가 토지, 법지는 소유권만 남는 경사지, 포락지는 물에 무너져 내린 땅이다. [메커니즘] 토지 용어는 무엇 때문에 그 상태가 되었는지를 한 단어로 압축한 것이라 원인만 잡으면 구분된다. [함정] 소지는 개발되기 전 자연 상태 그대로의 땅이고, 도로가 없어 갇힌 땅은 맹지다.", "src": "2026-02-16 부동산학개론 1-1 토지용어 (장기복습·191일전)", "conceptKey": "부동산학개론 1-1 토지용어 판별"},
  {"type": "일반", "cat": "부동산학개론", "q": "⏪ 부동산학개론상 토지의 자연적 특성과 그 파생 효과의 연결로 <b>옳지 않은</b> 것은?", "opts": ["부동성 — 부동산활동이 지역적으로 국지화되고 외부효과가 나타나는 근거가 된다", "부증성 — 토지의 집약적 이용과 최유효이용의 근거가 된다", "영속성 — 물리적 감가상각을 부정하고 수익환원법이 적용되는 근거가 된다", "개별성 — 대체 가능성을 높여 유사 부동산 사이의 완전경쟁을 가능하게 한다"], "answer": 3, "expl": "[정답 근거] 개별성은 대체성과 유사성을 부정하는 특성이므로 완전경쟁이 아니라 불완전경쟁의 근거가 된다. [메커니즘] 똑같은 토지가 없으니 하나하나가 독립된 시장처럼 작동하여 가격 결정력이 생긴다. [함정] 부동성은 지역화와 외부효과, 부증성은 최유효이용, 영속성은 감가 부정과 수익환원법으로 각각 갈래가 다르다.", "src": "2026-02-16 부동산학개론 2-1 부동산의 특성 (장기복습·191일전)", "conceptKey": "부동산학개론 2-1 자연적 특성 파생효과"},

// ── 순수 함수 레이어: DOM 없이 채점 결과(payload v2)를 만든다. node로 단위테스트 가능.
function conceptFromSrc(src){
  return String(src||"").replace(/^\s*\d{4}-\d{2}-\d{2}\s*/,"").replace(/\s*\(재도전\)\s*$/,"").trim();
}
function buildPayload(questions, sel, quizDate, nowIso, schemaVersion){
  let score = 0; const results = [], wrong = [];
  questions.forEach((item, qi)=>{
    const isCorrect = sel[qi] === item.answer;
    if(isCorrect) score++;
    const ck = item.conceptKey || conceptFromSrc(item.src);
    const isRetry = !!item.retryOf || /\(재도전\)/.test(item.src||"") || String(item.q||"").indexOf("🔁") >= 0;
    const base = {
      id: quizDate + "-q" + (qi+1), cat: item.cat, type: item.type, q: item.q,
      options: item.opts, myAnswer: item.opts[sel[qi]], correct: item.opts[item.answer],
      expl: item.expl, src: item.src
    };
    const r = Object.assign({}, base, {
      conceptKey: ck,
      retryOf: isRetry ? (item.retryOf || ck) : null,
      correctAnswered: isCorrect
    });
    if(item.calc) r.calc = item.calc;
    results.push(r);
    if(!isCorrect) wrong.push(base);   // v1 하위호환 필드 (기존 수거 파이프라인용)
  });
  return { score: score, wrong: wrong, payload: {
    schemaVersion: schemaVersion, subject: "공인중개사", date: quizDate, quizId: quizDate,
    score: score, total: questions.length, wrongCount: wrong.length,
    results: results, wrong: wrong, generatedAt: nowIso
  }};
}
/*__BUILD_PAYLOAD_END__*/

    <div class="expl" id="expl-${qi}"></div>`;
  const optsEl = card.querySelector('.opts');
  item.opts.forEach((o, oi)=>{
    const el = document.createElement('div');
    el.className = 'opt';
    el.dataset.q = qi; el.dataset.o = oi;
    el.innerHTML = isOX
      ? `<span>${o}</span>`
      : `<span class="mk">${String.fromCharCode(65+oi)}</span><span>${o}</span>`;
    el.addEventListener('click', ()=>{
      if(graded) return;
      selected[qi] = oi;
      optsEl.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');
      updateProgress();
    });
    // 눈동자(👁) 소거 버튼 — 확실히 아닌 보기를 희미하게(다시 누르면 복구). 채점·선택·저장에 영향 없음.
    if(!isOX){
      const eye = document.createElement('button');
      eye.type = 'button';
      eye.className = 'eye';
      eye.textContent = '👁';
      eye.title = '확실히 아닌 보기 희미하게 (다시 누르면 복구)';
      eye.setAttribute('aria-label', '이 보기를 후보에서 제외');
      eye.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        if(graded) return;
        el.classList.toggle('ruled');
      });
      el.appendChild(eye);
    }
    optsEl.appendChild(el);
  });
  form.appendChild(card);
});

function updateProgress(){
  const done = selected.filter(s=>s!==null).length;
  document.getElementById('pcount').textContent = `${done} / ${QUESTIONS.length} 선택`;
  document.getElementById('pbar').style.width = (done/QUESTIONS.length*100)+'%';
  document.getElementById('submitBtn').disabled = done !== QUESTIONS.length;
}

const btn = document.getElementById('submitBtn');
btn.addEventListener('click', ()=>{ if(!graded){ grade(); } else { location.reload(); } });

document.getElementById('copyBtn').addEventListener('click', ()=>{
  if(!LAST_PAYLOAD) return;
  const txt = JSON.stringify(LAST_PAYLOAD, null, 2);
  const done = ()=>{ document.getElementById('dlnote').textContent = "📋 복사 완료 — velog-posts/공인중개사/claude_ox_오답/_inbox/에 붙여넣어 저장해도 된다"; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt, done));
  } else { fallbackCopy(txt, done); }
});
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  ta.remove();
}

function grade(){
  graded = true;
  const built = buildPayload(QUESTIONS, selected, QUIZ_DATE, new Date().toISOString(), SCHEMA_VERSION);
  LAST_PAYLOAD = built.payload;
  QUESTIONS.forEach((item, qi)=>{
    const opts = document.querySelectorAll(`.opt[data-q="${qi}"]`);
    opts.forEach((el, oi)=>{
      el.style.cursor='default';
      el.classList.remove('ruled');           // 채점 시 소거 표시 해제(정답이 희미하게 남지 않도록)
      const eye = el.querySelector('.eye');    // 눈동자 버튼 제거 — 채점 후엔 불필요
      if(eye) eye.remove();
      if(oi === item.answer) el.classList.add('correct');
      if(oi === selected[qi] && oi !== item.answer) el.classList.add('wrong');
    });
    const correct = selected[qi] === item.answer;
    const ex = document.getElementById('expl-'+qi);
    ex.innerHTML = `<span class="verdict" style="color:${correct?'var(--ok)':'var(--no)'}">${correct?'정답!':'오답'}</span>${item.expl}<span class="src">📄 출처: ${item.src}</span>`;
    ex.classList.add('show');
  });
  const r = document.getElementById('result');
  document.getElementById('score').textContent = built.score;
  document.getElementById('rmsg').textContent = msgFor(built.score);
  r.classList.add('show');
  btn.textContent = '🔄 다시 풀기';
  btn.classList.add('retry');
  document.getElementById('copyBtn').classList.add('show');

  // 결과 자동 다운로드 (월요일 수거·원장 갱신이 읽는 파일)
  downloadResult(built.payload);

  r.scrollIntoView({behavior:'smooth', block:'center'});
}

function downloadResult(payload){
  try{
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `공인중개사_오답_${QUIZ_DATE}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    document.getElementById('dlnote').textContent =
      payload.wrongCount>0 ? `💾 결과 저장됨(오답 ${payload.wrongCount}개) — 다운로드 폴더 확인` : "💾 만점 기록 저장됨";
  }catch(e){
    document.getElementById('dlnote').textContent = "⚠️ 자동 저장 실패 — 아래 '결과 JSON 복사'를 눌러 수동 저장";
  }
}

function msgFor(s){
  const t = QUESTIONS.length;
  const r = s/t;
  if(s===t)   return "만점. 오늘 등록증 발급해도 되겠는데요? 🏆";
  if(r>=0.8)  return "합격권. 틀린 거 해설만 한 번 더 보면 완벽합니다.";
  if(r>=0.6)  return "절반은 넘었어요. 오답 노트행 직행하는 개념들이 보이네요.";
  if(r>=0.4)  return "아직 흔들리는 개념이 있어요. 해설 정독하고 내일 재도전!";
  return "괜찮아요, 회독이 쌓이면 올라갑니다. 해설부터 차근차근.";
}
</script>
