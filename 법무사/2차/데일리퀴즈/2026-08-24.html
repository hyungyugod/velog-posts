  - 채점·결과 저장(downloadResult)·스키마는 이 파일에서만 수정한다.
  - 생성 스킬이 교체하는 것: 이중 중괄호 토큰 4종 QUIZ_DATE·META_LINE·TAGS_HTML·ALERT_HTML
    (⚠ 이 주석에는 실제 토큰 표기를 쓰지 않는다 — 치환·잔존 검사가 주석에 걸리지 않게)
    그리고 QUESTIONS 마커 사이의 문항 배열. 그 외 로직 수정 금지.
  - 결과 JSON 스키마 v2(법무사 확장): results[] 각 원소에 exam 포함,
    단답형은 selfGraded:true + keywords + myAnswer(타이핑 원문). wrong[]은 v1 하위호환.
  - 문항 필드 계약(법무사 v1):
    공통: type · exam · cat · q · expl · src · conceptKey (+재도전 retryOf, 한달전 monthlyOf)
    객관식(일반|조합|판례|사례|OX): opts[] · answer(정답 인덱스)
    단답형(단답): answer(모범답 문자열) · keywords[](자가채점 필수 키워드 2~4개) · opts 없음
  - 2026-09-01 v2: ❌ 틀렸다 → ① 채점 포인트 중 놓친 것 다중선택(1개 이상 필수, payload missedKeys
    → 오답원장 → 다음 오답퀴즈의 조준점) → ② 모범답을 가린 채 재인출 타이핑(가림은 상시, hover·탭으로 훔쳐보기).
  - 2026-09-01 추가: 단답 자가채점에서 ❌ 틀렸다를 고르면 교정 입력칸이 열리고,

    payload results[]에 fixTyped(교정 타이핑 원문) 선택 필드 추가 — 원장은 미사용 필드라 무영향.

  - 2026-09-01 v5: 객관식 🤷 모르겠음(무답) 버튼 — 아예 모르면 찍지 않고 무답 처리.

    이유: 찍어서 맞으면 그 구멍은 원장에 기록조차 안 된다 — 무답이 정직한 데이터다.
  - 2026-09-01 v6: ㄱㄴㄷ 지문 앞에 O·X 마킹 토글(·→O→X) — 채점·payload 무관 시각 메모.

// ── 순수 함수 레이어: DOM 없이 채점 결과(payload v2·법무사)를 만든다. node로 단위테스트 가능.
// sel[qi]: 객관식 = 선택 인덱스(number) / 단답형 = {typed, revealed, self}
function conceptFromSrc(src){
  return String(src||"").replace(/^\s*\d{4}-\d{2}-\d{2}\s*/,"").replace(/\s*\(재도전\)\s*$/,"").trim();
}
function buildPayload(questions, sel, quizDate, nowIso, schemaVersion){
  let score = 0; const results = [], wrong = [];
  questions.forEach((item, qi)=>{
    const isSA = item.type === "단답";
    const st = sel[qi];
    const isCorrect = isSA ? !!(st && st.self === true) : (st === item.answer);
    if(isCorrect) score++;
    const ck = item.conceptKey || conceptFromSrc(item.src);
    const isRetry = !!item.retryOf || /\(재도전\)/.test(item.src||"") || String(item.q||"").indexOf("🔁") >= 0;
    const base = isSA ? {
      id: quizDate + "-q" + (qi+1), cat: item.cat, type: item.type, q: item.q,
      myAnswer: (st && st.typed) || "", correct: item.answer,
      expl: item.expl, src: item.src
    } : {
      id: quizDate + "-q" + (qi+1), cat: item.cat, type: item.type, q: item.q,
      options: item.opts, myAnswer: (st === "DK" ? "모르겠음" : item.opts[st]), correct: item.opts[item.answer],
      expl: item.expl, src: item.src
    };
    const r = Object.assign({}, base, {
      conceptKey: ck,
      exam: item.exam || (isSA ? "2차" : "1차"),
      retryOf: isRetry ? (item.retryOf || ck) : null,
      correctAnswered: isCorrect
    });
    if(isSA){ r.selfGraded = true; r.keywords = item.keywords || [];
      if(st && st.self === false){
        if(st.fix){ r.fixTyped = st.fix; base.fixTyped = st.fix; }
        if(st.missed && st.missed.length){ r.missedKeys = st.missed.slice(); base.missedKeys = st.missed.slice(); }
      } }
    if(item.monthlyOf) r.monthlyOf = item.monthlyOf;
    results.push(r);
    if(!isCorrect) wrong.push(base);   // v1 하위호환 필드 (수거 파이프라인용)
  });
  return { score: score, wrong: wrong, payload: {
    schemaVersion: schemaVersion, subject: "법무사", date: quizDate, quizId: quizDate,
    score: score, total: questions.length, wrongCount: wrong.length,
    results: results, wrong: wrong, generatedAt: nowIso
  }};
}
/*__BUILD_PAYLOAD_END__*/

// ── 단답 오답 진단·교정 (2026-09-01 v2) ──────────────────────────
// "❌ 틀렸다" → ① 채점 포인트 중 놓친 것 선택(1개 이상 필수 · 없으면 '기타'에 직접 입력)
//              → ② 모범답을 가린 채 재인출 타이핑.
// ①은 다음 오답퀴즈의 출제 조준점이 되고(payload missedKeys → 원장), ②는 회독을 인출로 바꾼다.
// 근거: 오답 뒤 정답을 눈으로만 읽으면 다음 회차에 같은 자리가 그대로 빈다.
const SA_FIX_PASS = 0.55;          // 통과 일치도(0~1). 낮추면 관대해진다
// 모범답 가림은 상시 적용(2026-09-01, 스위치 폐지) — 보고 베끼면 전사(轉寫)지 인출이 아니다.
// 막히면 모범답에 마우스를 올리거나(데스크톱) 탭해서(터치) 잠깐 열어볼 수 있다.
function saNorm(s){
  return String(s == null ? '' : s)
    .replace(/<[^>]*>/g, ' ')
    .replace(/&[a-z]+;/gi, ' ')
    .replace(/[\s.,·․、，。()（）\[\]「」『』"'`~\-–—_:;!?\/\\]/g, '')
    .toLowerCase();
}
function saSim(a, b){   // 문자 2-gram Dice 계수 — 오탈자·어순 흔들림에 관대
  a = saNorm(a); b = saNorm(b);
  if(!a || !b) return 0;
  if(a.length < 2 || b.length < 2) return a === b ? 1 : 0;
  const gram = s => { const m = new Map();
    for(let i=0;i<s.length-1;i++){ const k = s.slice(i,i+2); m.set(k, (m.get(k)||0)+1); }
    return m; };
  const ga = gram(a), gb = gram(b);
  let inter = 0, na = 0, nb = 0;
  ga.forEach(v => na += v); gb.forEach(v => nb += v);
  ga.forEach((v,k) => { inter += Math.min(v, gb.get(k) || 0); });
  return 2*inter/(na+nb);
}
/*__SA_FIX_END__*/

// ── 객관식 오답 원인 진단 (2026-09-01) ─────────────────────────────
// 채점 후 틀린 객관식마다 원인 1개를 골라야(메모는 선택) 결과 JSON이 저장된다.
// 원인은 원장에 누적되어 Anki 편입(실수 전용 개념 제외)·재출제 각도(혼동→판별식 등)를 정한다.
// 근거: 해설을 눈으로 읽고 넘어간 오답은 원인 미상으로 남아 같은 방식으로 또 틀린다.
const MCQ_CAUSES = [
  ['개념부재', '몰랐다 — 개념 자체를'],
  ['혼동',     '헷갈렸다 — 다른 보기·개념과'],
  ['함정',     '함정 — 발문·지문에 걸림'],
  ['실수',     '실수 — 알았는데 잘못 체크·계산']
];
const mcqDiag = {};        // qi → {cause, note}
let diagPending = [];      // 진단 대기 중인 틀린 객관식 qi 목록
let DIAG_SAVED = false;
function diagDone(){ return diagPending.every(qi => mcqDiag[qi] && mcqDiag[qi].cause); }
function attachCauses(payload){
  diagPending.forEach(qi => {
    const d = mcqDiag[qi];
    if(!d || !d.cause) return;
    const res = payload.results && payload.results[qi];
    if(res){ res.errorCause = d.cause; if(d.note) res.causeNote = d.note; }
  });
  (payload.wrong || []).forEach(w => {
    const qi = parseInt(String(w.id || '').split('-q').pop(), 10) - 1;
    const d = mcqDiag[qi];
    if(d && d.cause){ w.errorCause = d.cause; if(d.note) w.causeNote = d.note; }
  });
  return payload;
}
function diagUpdate(){
  const bd = document.getElementById('diagSave');
  if(!bd) return;
  const left = diagPending.filter(qi => !(mcqDiag[qi] && mcqDiag[qi].cause)).length;
  bd.disabled = left > 0;
  bd.textContent = left > 0 ? ('🩺 오답 진단 저장 — ' + left + '개 남음') : '🩺 오답 진단 저장 (준비 완료)';
}
function makeDiag(qi){
  const d = document.createElement('div');
  d.className = 'mcq-diag'; d.id = 'diag-' + qi;
  d.innerHTML = `
    <div class="dhead"><b>🩺 왜 틀렸나요?</b> — 1개 선택 · 원인에 따라 Anki 편입과 재출제 각도가 달라집니다</div>
    <div class="dchips">${MCQ_CAUSES.map((c,ci)=>`<span class="sa-chip" data-c="${ci}">${c[1]}</span>`).join('')}</div>
    <input type="text" class="dmemo" maxlength="80" placeholder="한 줄 메모 (선택) — 예: 임의적·필요적 감경을 반대로 알고 있었음">`;
  d.querySelectorAll('.sa-chip').forEach(ch => {
    ch.addEventListener('click', () => {
      if(DIAG_SAVED) return;
      d.querySelectorAll('.sa-chip').forEach(x => x.classList.remove('on'));
      ch.classList.add('on');
      mcqDiag[qi] = mcqDiag[qi] || {};
      mcqDiag[qi].cause = MCQ_CAUSES[+ch.dataset.c][0];
      diagUpdate();
    });
  });
  d.querySelector('.dmemo').addEventListener('input', (ev) => {
    if(DIAG_SAVED) return;
    mcqDiag[qi] = mcqDiag[qi] || {};
    mcqDiag[qi].note = ev.target.value.trim().replace(/\s+/g, ' ');
  });
  return d;
}
/*__MCQ_DIAG_END__*/

    const s = document.createElement('div');
    s.className = 'sec';
    s.textContent = '▍' + item.cat + (item.exam === '2차' ? ' · 2차 단답' : '');
    form.appendChild(s);
    lastCat = item.cat;
  }
  const card = document.createElement('div');
  card.className = 'q';
  card.id = 'card-' + qi;
  const isOX = item.type === 'OX';
  card.innerHTML = `
    <div class="qhead">
      <span class="qno">${qi+1}</span>
      <span class="qtype ${isSA?'t2':''}">${item.type}${item.exam==='2차'?' · 2차':''}</span>
      <span class="qcat">${item.cat}</span>
    </div>
    <div class="qtext">${item.q}</div>`;

  if(isSA){
    // ── 단답형: 타이핑 인출 → 정답 공개 → 자가채점 ──
    const ta = document.createElement('textarea');
    ta.className = 'sa-input';
    ta.placeholder = '답을 먼저 쓰세요 (쓰기 전에 정답을 열면 인출이 아니라 인풋이 됩니다)';
    card.appendChild(ta);
    const btnR = document.createElement('button');
    btnR.type = 'button'; btnR.className = 'sa-reveal';
    btnR.textContent = '✍️ 정답·해설 확인';
    card.appendChild(btnR);
    const box = document.createElement('div');
    box.className = 'sa-answer'; box.hidden = true;
    const kws = (item.keywords||[]).map(k=>`<span class="kw">${k}</span>`).join('');
    box.innerHTML = `
      <div class="sa-modela"><b>📌 모범답</b> — ${item.answer}</div>
      ${kws?`<div class="sa-keys">채점 포인트:${kws}</div>`:''}
      <div class="sa-grade"><span>스스로 채점 →</span>
        <button type="button" data-g="ok">⭕ 맞았다</button>
        <button type="button" data-g="no">❌ 틀렸다</button>
      </div>`;
    card.appendChild(box);
    // ── 오답 교정 입력칸 (2026-09-01) — "틀렸다"일 때만 열린다 ──
    const fix = document.createElement('div');
    fix.className = 'sa-fix'; fix.hidden = true;
    const MISS_OPTS = (item.keywords || []).concat(['결론·방향 자체']);
    const FIXNOTE = `일치도 ${Math.round(SA_FIX_PASS*100)}% 이상이면 자동 통과 (오탈자·어순은 봐줍니다 / 붙여넣기는 막혀 있습니다)`;
    fix.innerHTML = `
      <div class="sa-misshead"><b>① 뭘 놓쳤나요?</b> — 해당되는 것 전부 (1개 이상 · 다음 오답퀴즈가 여길 조준합니다)</div>
      <div class="sa-misschips">${MISS_OPTS.map((k,ki)=>`<span class="sa-chip" data-k="${ki}">${k}</span>`).join('')}<span class="sa-chip etc" data-etc="1">＋ 기타(직접 입력)</span></div>
      <div class="sa-etcwrap" hidden><input type="text" class="sa-etcinput" maxlength="60"
        placeholder="채점 포인트에 없던 것 — 짧게 (예: 예외 사유를 빠뜨림 / 주체를 반대로 씀)"></div>
      <div class="sa-fixbody" hidden>
        <div class="sa-fixhead"><b>② 교정 입력</b> — 모범답은 가려집니다. 기억으로 다시 쓰세요
          <span class="sa-meter"><i></i></span><span class="sa-pct">0%</span></div>
        <textarea class="sa-fixinput" placeholder="기억나는 대로 다시 쓰세요 — 막히면 위 모범답에 마우스를 올리거나 탭하면 잠깐 열립니다"></textarea>
        <div class="sa-fixnote">${FIXNOTE}</div>
      </div>`;
    card.appendChild(fix);
    const fixBody = fix.querySelector('.sa-fixbody');
    const etcChip = fix.querySelector('.sa-chip.etc');
    const etcWrap = fix.querySelector('.sa-etcwrap');
    const etcInput= fix.querySelector('.sa-etcinput');
    const fixTa   = fix.querySelector('.sa-fixinput');
    const fixBar  = fix.querySelector('.sa-meter i');
    const fixPct  = fix.querySelector('.sa-pct');
    const fixNote = fix.querySelector('.sa-fixnote');
    const modela  = box.querySelector('.sa-modela');
    function fixCheck(){
      const sim  = saSim(fixTa.value, item.answer);
      const pass = sim >= SA_FIX_PASS;
      fixBar.style.width = Math.min(100, Math.round(sim / SA_FIX_PASS * 100)) + '%';
      fixPct.textContent = pass ? '통과 ✓' : Math.round(sim*100) + '%';
      fix.classList.toggle('done', pass);
      selected[qi].fix = fixTa.value;
      selected[qi].fixed = pass;
      if(pass) box.classList.remove('veil','peek');   // 재현했으면 모범답을 열어 대조
      updateProgress();
    }
    function missSync(){
      const on = [].slice.call(fix.querySelectorAll('.sa-chip.on'))
        .filter(c=>!c.dataset.etc).map(c=>MISS_OPTS[+c.dataset.k]);
      const etcOn = etcChip.classList.contains('on');
      etcWrap.hidden = !etcOn;
      const etcTxt = etcOn ? etcInput.value.trim().replace(/\s+/g,' ') : '';
      if(etcTxt) on.push('기타: ' + etcTxt);   // 빈 기타는 선택으로 치지 않는다 — 적어야 조준점이 된다
      selected[qi].missed = on;
      fixBody.hidden = (on.length === 0);
      fixCheck();
    }
    fix.querySelectorAll('.sa-chip').forEach(c=>{
      c.addEventListener('click', ()=>{
        if(graded || selected[qi].self !== false) return;
        c.classList.toggle('on');
        missSync();
        if(c.dataset.etc && c.classList.contains('on')){ setTimeout(()=>etcInput.focus(), 0); return; }
        if(!fixBody.hidden) setTimeout(()=>fixTa.focus(), 0);
      });
    });
    etcInput.addEventListener('input', missSync);
    etcInput.addEventListener('keydown', (ev)=>{ if(ev.key === 'Enter'){ ev.preventDefault(); if(!fixBody.hidden) fixTa.focus(); } });
    if(modela) modela.addEventListener('click', ()=>{   // 터치 기기용 훔쳐보기(hover 대체)
      if(box.classList.contains('veil')) box.classList.toggle('peek');
    });
    fixTa.addEventListener('input', fixCheck);
    fixTa.addEventListener('paste', (ev)=>{
      ev.preventDefault();
      fixNote.textContent = '⚠️ 붙여넣기는 막혀 있습니다 — 손으로 쳐야 남습니다';
      setTimeout(()=>{ fixNote.textContent = FIXNOTE; }, 2200);
    });
    const ex = document.createElement('div');
    ex.className = 'expl'; ex.id = 'expl-'+qi;
    card.appendChild(ex);

    btnR.addEventListener('click', ()=>{
      if(graded || selected[qi].revealed) return;
      selected[qi].typed = ta.value;
      selected[qi].revealed = true;
      ta.disabled = true; btnR.disabled = true;
      box.hidden = false;
      ex.innerHTML = `${item.expl}<span class="src">📄 출처: ${item.src}</span>`;
      ex.classList.add('show');
    });
    box.querySelectorAll('.sa-grade button').forEach(b=>{
      b.addEventListener('click', ()=>{
        if(graded || !selected[qi].revealed) return;
        selected[qi].self = (b.dataset.g === 'ok');
        box.querySelectorAll('.sa-grade button').forEach(x=>x.classList.remove('on-ok','on-no'));
        b.classList.add(b.dataset.g === 'ok' ? 'on-ok' : 'on-no');
        const isWrong = (selected[qi].self === false);
        fix.hidden = !isWrong;
        if(isWrong){
          box.classList.add('veil'); box.classList.remove('peek');
          missSync();
        } else {
          selected[qi].fix = ''; selected[qi].fixed = false; selected[qi].missed = [];
          fix.querySelectorAll('.sa-chip').forEach(c=>c.classList.remove('on'));
          etcInput.value = ''; etcWrap.hidden = true;
          fix.classList.remove('done'); fixBody.hidden = true;
          box.classList.remove('veil','peek');
        }
        updateProgress();
      });
    });
  } else {
    // ── 객관식: 정본 v2.1 로직 그대로 ──
    const optsWrap = document.createElement('div');
    optsWrap.className = 'opts ' + (isOX?'ox':'');
    optsWrap.dataset.q = qi;
    card.appendChild(optsWrap);
    const ex = document.createElement('div');
    ex.className = 'expl'; ex.id = 'expl-'+qi;
    card.appendChild(ex);
    item.opts.forEach((o, oi)=>{
      const el = document.createElement('div');
      el.className = 'opt';
      el.dataset.q = qi; el.dataset.o = oi;
      el.innerHTML = isOX
        ? `<span>${o}</span>`
        : `<span class="mk">${String.fromCharCode(65+oi)}</span><span>${o}</span>`;
      el.addEventListener('click', ()=>{
        if(graded) return;
        selected[qi] = oi;
        optsWrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
        el.classList.add('sel');
        updateProgress();
      });
      if(!isOX){
        const eye = document.createElement('button');
        eye.type = 'button';
        eye.className = 'eye';
        eye.textContent = '👁';
        eye.title = '확실히 아닌 보기 희미하게 (다시 누르면 복구)';
        eye.setAttribute('aria-label', '이 보기를 후보에서 제외');
        eye.addEventListener('click', (ev)=>{
          ev.stopPropagation();
          if(graded) return;
          el.classList.toggle('ruled');
        });
        el.appendChild(eye);
      }
      optsWrap.appendChild(el);
    });
  }
  form.appendChild(card);
});

function updateProgress(){
  document.querySelectorAll('.dk-btn').forEach(b => { const k = +b.dataset.q; b.classList.toggle('on', selected[k] === 'DK'); });
  const done = selected.filter((s,i)=> QUESTIONS[i].type==='단답' ? (s && (s.self===true || (s.self===false && s.fixed && s.missed.length>0))) : (s!==null)).length;
  document.getElementById('pcount').textContent = `${done} / ${QUESTIONS.length} 완료`;
  document.getElementById('pbar').style.width = (done/QUESTIONS.length*100)+'%';
  document.getElementById('submitBtn').disabled = done !== QUESTIONS.length;
}
updateProgress();

// ── 모르겠음(무답) 버튼 (2026-09-01): 아예 모르면 찍지 말 것 — 찍어서 맞으면 구멍이 기록되지 않는다 ──
QUESTIONS.forEach((it, qi) => {
  if(it.type === '단답') return;
  const ow = document.querySelector('.opts[data-q="' + qi + '"]');
  if(!ow) return;
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'dk-btn'; b.dataset.q = qi;
  b.textContent = '🤷 모르겠음 — 찍지 않기';
  b.title = '무답 처리: 오답으로 집계되고 원인은 자동으로 [개념부재]가 됩니다';
  b.addEventListener('click', () => {
    if(graded) return;
    selected[qi] = (selected[qi] === 'DK') ? null : 'DK';
    ow.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
    updateProgress();
  });
  ow.insertAdjacentElement('afterend', b);
  // ── ㄱㄴㄷ 지문 O·X 마킹 (2026-09-01): 시험지 여백 체크의 화면판 — 판정을 머리에 안 들고 있게 ──
  const qt = ow.closest('.q') && ow.closest('.q').querySelector('.qtext');
  if(qt && !qt.dataset.oxDone && /(^|<br\s*\/?>)\s*[ㄱㄴㄷㄹㅁㅂ]\.\s/.test(qt.innerHTML)){
    qt.innerHTML = qt.innerHTML.replace(/(^|<br\s*\/?>)(\s*)([ㄱㄴㄷㄹㅁㅂ])(\.\s*)/g,
      '$1$2<button type="button" class="ox-mark" title="지문 O·X 메모 — 채점과 무관한 체크용">·</button>$3$4');
    qt.dataset.oxDone = '1';
  }
});
form.addEventListener('click', (e) => {
  const t = e.target.closest('.ox-mark');
  if(!t) return;
  e.preventDefault();
  if(graded) return;
  if(t.classList.contains('o')){ t.classList.remove('o'); t.classList.add('x'); t.textContent = 'X'; }
  else if(t.classList.contains('x')){ t.classList.remove('x'); t.textContent = '·'; }
  else { t.classList.add('o'); t.textContent = 'O'; }
});

const btn = document.getElementById('submitBtn');
btn.addEventListener('click', ()=>{ if(!graded){ grade(); } else { location.reload(); } });

document.getElementById('copyBtn').addEventListener('click', ()=>{
  if(!LAST_PAYLOAD) return;
  const txt = JSON.stringify(LAST_PAYLOAD, null, 2);
  const done = ()=>{ document.getElementById('dlnote').textContent = "📋 복사 완료 — velog-posts/법무사/claude_ox_오답/_inbox/에 붙여넣어 저장해도 된다"; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt, done));
  } else { fallbackCopy(txt, done); }
});
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  ta.remove();
}

function grade(){
  graded = true;
  const built = buildPayload(QUESTIONS, selected, QUIZ_DATE, new Date().toISOString(), SCHEMA_VERSION);
  LAST_PAYLOAD = built.payload;
  QUESTIONS.forEach((item, qi)=>{
    const ex = document.getElementById('expl-'+qi);
    if(item.type === '단답'){
      const correct = selected[qi].self === true;
      const card = document.getElementById('card-'+qi);
      card.classList.add(correct ? 'saok' : 'sano');
      card.querySelectorAll('.sa-grade button').forEach(b=>{ b.style.cursor='default'; });
      card.querySelectorAll('.sa-fixinput').forEach(t=>{ t.disabled = true; });
      card.querySelectorAll('.sa-chip').forEach(c=>{ c.style.cursor = 'default'; });
      card.querySelectorAll('.sa-etcinput').forEach(t=>{ t.disabled = true; });
      card.querySelectorAll('.sa-answer').forEach(x=>x.classList.remove('veil'));
      ex.innerHTML = `<span class="verdict" style="color:${correct?'var(--ok)':'var(--no)'}">${correct?'정답(자가채점)':'오답(자가채점)'}</span>${item.expl}<span class="src">📄 출처: ${item.src}</span>`;
      ex.classList.add('show');
      return;
    }
    const opts = document.querySelectorAll(`.opt[data-q="${qi}"]`);
    opts.forEach((el, oi)=>{
      el.style.cursor='default';
      el.classList.remove('ruled');
      const eye = el.querySelector('.eye');
      if(eye) eye.remove();
      if(oi === item.answer) el.classList.add('correct');
      if(oi === selected[qi] && oi !== item.answer) el.classList.add('wrong');
    });
    const correct = selected[qi] === item.answer;
    ex.innerHTML = `<span class="verdict" style="color:${correct?'var(--ok)':'var(--no)'}">${correct?'정답!':(selected[qi]==='DK'?'모르겠음(무답)':'오답')}</span>${item.expl}<span class="src">📄 출처: ${item.src}</span>`;
    ex.classList.add('show');
  });
  const r = document.getElementById('result');
  document.getElementById('score').textContent = built.score;
  document.getElementById('rmsg').textContent = msgFor(built.score);
  r.classList.add('show');
  btn.textContent = '🔄 다시 풀기';
  btn.classList.add('retry');
  document.querySelectorAll('.dk-btn').forEach(b => { b.disabled = true; });
  const wrongMCQ = [];
  QUESTIONS.forEach((it, qi) => { if(it.type !== '단답' && selected[qi] !== it.answer) wrongMCQ.push(qi); });
  // 모르겠음(무답)은 원인 자동 진단: 개념부재 — 본인이 이미 "모른다"고 선언한 것이라 다시 묻지 않는다
  wrongMCQ.forEach(qi => { if(selected[qi] === 'DK') mcqDiag[qi] = { cause: '개념부재' }; });
  const needDiag = wrongMCQ.filter(qi => selected[qi] !== 'DK');
  if(needDiag.length === 0){
    if(wrongMCQ.length > 0){ diagPending = wrongMCQ; attachCauses(built.payload); }
    document.getElementById('copyBtn').classList.add('show');
    // 결과 자동 다운로드 (주간 수거·원장 갱신이 읽는 파일)
    downloadResult(built.payload);
  } else {
    // ── 오답 원인 진단 게이트 (2026-09-01): 원인을 다 골라야 저장된다 ──
    diagPending = wrongMCQ;
    needDiag.forEach(qi => {
      const ex = document.getElementById('expl-' + qi);
      if(ex) ex.insertAdjacentElement('afterend', makeDiag(qi));
    });
    const dn = document.getElementById('dlnote');
    dn.textContent = '⚠️ 아직 저장 전 — 틀린 문제(빨간 칸)마다 원인을 고르고 아래 버튼으로 저장하세요';
    const bd = document.createElement('button');
    bd.type = 'button'; bd.className = 'copybtn show'; bd.id = 'diagSave'; bd.disabled = true;
    bd.addEventListener('click', () => {
      if(DIAG_SAVED || !diagDone()) return;
      DIAG_SAVED = true;
      attachCauses(LAST_PAYLOAD);
      document.getElementById('copyBtn').classList.add('show');
      downloadResult(LAST_PAYLOAD);
      document.querySelectorAll('.mcq-diag').forEach(x => x.classList.add('done'));
      document.querySelectorAll('.mcq-diag .dmemo').forEach(x => { x.disabled = true; });
      document.querySelectorAll('.mcq-diag .sa-chip').forEach(x => { x.style.cursor = 'default'; });
      bd.textContent = '✅ 진단 저장됨'; bd.disabled = true;
    });
    dn.insertAdjacentElement('afterend', bd);
    diagUpdate();
  }

  r.scrollIntoView({behavior:'smooth', block:'center'});
}

function downloadResult(payload){
  try{
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `법무사_오답_${QUIZ_DATE}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    document.getElementById('dlnote').textContent =
      payload.wrongCount>0 ? `💾 결과 저장됨(오답 ${payload.wrongCount}개) — 다운로드 폴더 확인` : "💾 만점 기록 저장됨";
  }catch(e){
    document.getElementById('dlnote').textContent = "⚠️ 자동 저장 실패 — 아래 '결과 JSON 복사'를 눌러 수동 저장";
  }
}

function msgFor(s){
  const t = QUESTIONS.length;
  const r = s/t;
  if(s===t)   return "만점. 이 페이스면 동차가 농담이 아니게 됩니다 ⚖️";
  if(r>=0.8)  return "합격권. 틀린 개념만 해설 한 번 더 — 그게 오늘의 회독입니다.";
  if(r>=0.6)  return "절반 이상. 단답에서 막힌 건 백지 인출감이 아직이라는 신호예요.";
  if(r>=0.4)  return "흔들리는 개념이 보입니다. 해설 정독 후 다음 회차에서 재도전.";
  return "괜찮아요. 인출 실패 + 피드백이 읽기보다 낫다는 게 연구 결론입니다.";
}
</script>
</body>
</html>
